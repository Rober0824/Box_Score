<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BBall Stats</title>
<meta name="theme-color" content="#241a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBall Stats">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: oklch(15% 0.014 55);
    --surface: oklch(20% 0.016 55);
    --surface-2: oklch(25% 0.018 55);
    --border: oklch(32% 0.02 55);
    --text: oklch(96% 0.015 85);
    --text-dim: oklch(68% 0.03 70);
    --accent: oklch(72% 0.18 45);
    --accent-ink: oklch(18% 0.02 55);
    --good: oklch(70% 0.17 145);
    --bad: oklch(62% 0.19 25);
    --reb: oklch(76% 0.08 90);
    --foul-c: oklch(20% 0.012 55);
    --foul-r: oklch(46% 0.015 55);
    --create: oklch(80% 0.09 150);
    --loss: oklch(74% 0.01 55);
    --rival: oklch(68% 0.15 240);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  body{ font-family:'Manrope',sans-serif; color:var(--text); position:fixed; inset:0; width:100%; display:flex; justify-content:center; }
  a{ color:var(--accent); text-decoration:none; }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0; }

  #app{ max-width:460px; width:100%; background:var(--bg); display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; overscroll-behavior:none; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg); position:sticky; top:0; z-index:5; }
  .iconbtn{ width:36px; height:36px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0; }
  .iconbtn:active{ background:var(--border); }
  .scoreline{ display:flex; flex-direction:column; align-items:center; }
  .scoreline .teams{ font-size:10.5px; color:var(--text-dim); font-weight:700; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scoreline .score{ font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; }
  .finish{ font-size:13px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }
  .finish[disabled]{ opacity:0.35; }

  .header{ padding:22px 20px 4px; flex-shrink:0; }
  .header-row{ display:flex; align-items:center; gap:12px; }
  .htitles{ display:flex; flex-direction:column; }
  .title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; letter-spacing:0.02em; text-transform:uppercase; }
  .subtitle{ font-size:12px; color:var(--text-dim); font-weight:600; margin-top:2px; }

  .content{ flex:1; overflow-y:auto; padding:8px 20px 24px; display:flex; flex-direction:column; gap:24px; -webkit-overflow-scrolling:touch; }
  .section{ display:flex; flex-direction:column; }
  .label{ font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }

  .rowcard{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; gap:10px; }
  .rowcard + .rowcard{ margin-top:10px; }
  .rowcard .k{ color:var(--text-dim); font-size:13px; font-weight:600; flex-shrink:0; }
  .rowcard input[type=text]{ background:none; border:none; color:var(--text); font-weight:800; font-size:14px; text-align:right; flex:1; font-family:inherit; outline:none; }
  .rowcard input::placeholder{ color:var(--text-dim); font-weight:600; }
  .rowcard input[type=date]{ background:none; border:none; color:var(--text); font-weight:800; font-size:14px; text-align:right; flex:1; font-family:inherit; outline:none; color-scheme:dark; }

  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:700; color:var(--text-dim); }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .chipswrap{ position:relative; margin-bottom:10px; }
  .fasechips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .fasechips::-webkit-scrollbar{ display:none; }
  .fasechips .chip{ white-space:nowrap; flex-shrink:0; }
  .fadeedge{ position:absolute; top:0; right:0; bottom:2px; width:36px; background:linear-gradient(to right, transparent, var(--bg)); pointer-events:none; }

  .navrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; gap:10px; }
  .navrow .navlabel{ font-weight:700; font-size:14px; color:var(--text); }
  .navrow .navsub{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .navrow .chev{ color:var(--text-dim); flex-shrink:0; }

  .faserow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; gap:10px; }
  .faserow + .faserow{ margin-top:10px; }
  .faselabel{ font-weight:700; font-size:14px; }
  .fasesub{ font-size:11.5px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .faseactions{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .ibtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
  .ibtn.dim{ opacity:0.3; pointer-events:none; }
  .addfase{ width:100%; margin-top:12px; padding:13px; border-radius:14px; border:1.5px dashed var(--border); background:none; color:var(--accent); font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .stepperrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 14px; margin-top:10px; }
  .stepperrow .k{ font-size:13.5px; font-weight:700; }
  .stepperrow .k .auto{ display:block; font-size:10px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin-top:2px; }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepbtn{ width:32px; height:32px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .stepbtn:active{ background:var(--border); }
  .stepval{ font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; min-width:34px; text-align:center; }

  .seg2{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px; }
  .seg2 .opt{ flex:1; text-align:center; padding:10px 6px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .seg2 .opt.on{ background:var(--accent); color:var(--accent-ink); }
  .caption{ font-size:11.5px; color:var(--text-dim); margin-top:8px; line-height:1.5; }

  .countline{ display:flex; align-items:baseline; justify-content:space-between; }
  .count{ font-size:12px; font-weight:700; color:var(--text-dim); }

  .players{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .prow{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
  .prow.oncourt{ border-color:var(--accent); background:oklch(72% 0.18 45 / 10%); }
  .dorsal{ width:34px; height:34px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; flex-shrink:0; }
  .prow.oncourt .dorsal{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .pname{ flex:1; min-width:0; }
  .pname .nm{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pname .tag{ font-size:10.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px; }
  .dorsal.editable{ padding:0; }
  .dorsal.editable input{ width:100%; height:100%; background:none; border:none; text-align:center; color:inherit; font:inherit; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; padding:0; -moz-appearance:textfield; }
  .dorsal.editable input::-webkit-outer-spin-button, .dorsal.editable input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .pname input.nmedit{ background:none; border:none; color:var(--text); font-weight:700; font-size:14px; width:100%; font-family:inherit; padding:0; outline:none; }
  .pcheck{ width:26px; height:26px; border-radius:999px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pcheck.on{ background:var(--good); border-color:var(--good); color:oklch(18% 0.02 55); }
  .rmbtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
  .editbtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }

  .addrow{ display:flex; gap:8px; margin-top:10px; }
  .addrow input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:13.5px; outline:none; }
  .addrow input:focus{ border-color:var(--accent); }
  .addrow input.dorsalinput{ flex:0 0 64px; min-width:0; text-align:center; }
  .addbtn{ width:40px; flex-shrink:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; }

  .ctabar{ padding:14px 20px 22px; border-top:1px solid var(--border); flex-shrink:0; background:var(--bg); }
  .cta{ width:100%; height:52px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; letter-spacing:0.03em; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .cta[disabled]{ opacity:0.4; }
  .cta.ghost{ background:none; border:1px solid var(--border); color:var(--text); }

  .tabsrow{ display:flex; gap:7px; padding:12px 18px; overflow-x:auto; flex-shrink:0; }
  .tab{ flex-shrink:0; padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .tab.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .feedbar{ margin:0 18px 14px; background:var(--surface-2); border-radius:10px; padding:10px 14px; flex-shrink:0; }
  .feedbar .k{ font-size:9.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  .feedbar .v{ font-size:12.5px; font-weight:700; margin-top:3px; }
  .feedbar .v b{ color:var(--accent); }

  .playhead{ display:flex; align-items:center; justify-content:space-between; padding:0 18px 8px; flex-shrink:0; }
  .playlist{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 10px; display:flex; flex-direction:column; gap:7px; min-height:0; }
  .playrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 10px; }
  .playrow .per{ font-family:'Oswald',sans-serif; font-size:10.5px; font-weight:700; color:var(--text-dim); width:20px; text-align:center; flex-shrink:0; }
  .playrow .who{ font-weight:800; font-size:12.5px; flex-shrink:0; }
  .playrow .what{ flex:1; min-width:0; font-size:12.5px; color:var(--text-dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .playrow .delta{ font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .playrow .delta.good{ color:var(--good); }
  .playrow .delta.bad{ color:var(--bad); }
  .playbtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
  .playbtn:active{ color:var(--text); }
  .editpanel{ width:100%; border-top:1px solid var(--border); margin-top:8px; padding-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .editlabel{ width:100%; font-size:10.5px; font-weight:700; color:var(--text-dim); }
  .editchip{ padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); font-size:11px; font-weight:700; color:var(--text); }
  .editchip.sel{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .editchip.back{ background:transparent; border-style:dashed; color:var(--text-dim); }
  .delconfirm{ display:flex; align-items:center; gap:8px; width:100%; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .delconfirm .msg{ flex:1; font-size:11.5px; font-weight:700; color:var(--text-dim); }
  .delconfirm button{ font-size:11.5px; font-weight:800; padding:6px 10px; border-radius:8px; }
  .delconfirm .yes{ background:var(--bad); color:#fff; }
  .delconfirm .no{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .emptyplays{ text-align:center; color:var(--text-dim); font-size:12.5px; padding:18px 0; }

  .courtheader{ display:flex; align-items:center; justify-content:space-between; padding:0 18px 10px; flex-shrink:0; }
  .swaplink{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }

  .livecontent{ flex:1; overflow-y:auto; padding:0 18px 18px; -webkit-overflow-scrolling:touch; }
  .grid3{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; padding:0 18px; flex-shrink:0; }
  .ptile{ aspect-ratio:1/1; background:var(--surface); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .ptile:active{ background:var(--surface-2); }
  .ptile .num{ font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; }
  .ptile .nm{ font-size:9.5px; color:var(--text-dim); font-weight:700; text-align:center; padding:0 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .ptile.rival{ background:var(--surface-2); border-style:dashed; }
  .ptile.rival .nm{ font-size:11px; color:var(--text); font-weight:800; text-transform:uppercase; letter-spacing:0.02em; }

  .undobar{ padding:10px 18px 18px; text-align:center; flex-shrink:0; }
  .undo{ display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12.5px; font-weight:700; }
  .undo[disabled]{ opacity:0.3; }

  .pheader{ display:flex; align-items:center; gap:12px; margin:6px 18px 16px; background:var(--surface); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; flex-shrink:0; }
  .pheader .av{ width:44px; height:44px; border-radius:999px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; flex-shrink:0; }
  .pheader .nm{ font-weight:800; font-size:15px; }
  .pheader .sub{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:2px; }

  .shotrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:9px 13px; }
  .shotrow + .shotrow{ margin-top:8px; }
  .shotrow .k{ font-weight:700; font-size:13.5px; }
  .shotbtns{ display:flex; gap:8px; }
  .sbtn{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .sbtn.good{ background:oklch(70% 0.17 145 / 18%); border:1.5px solid var(--good); color:var(--good); }
  .sbtn.bad{ background:oklch(62% 0.19 25 / 16%); border:1.5px solid var(--bad); color:var(--bad); }
  .sbtn:active{ transform:scale(0.94); }

  .statgrid4{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:7px; }
  .glabel{ grid-column: span 2; font-size:9.5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); padding-bottom:1px; }
  .gtile{ border-radius:12px; min-height:56px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:11px; line-height:1.2; padding:4px; }
  .gtile:active{ transform:scale(0.96); }
  .gtile.reb{ background:var(--reb); color:var(--accent-ink); }
  .gtile.foulc{ background:var(--foul-c); color:var(--text); border:1px solid var(--border); }
  .gtile.foulr{ background:var(--foul-r); color:var(--text); }
  .gtile.create{ background:var(--create); color:var(--accent-ink); }
  .gtile.loss{ background:var(--loss); color:var(--accent-ink); }

  .closebar{ padding:14px 18px 20px; text-align:center; flex-shrink:0; }
  .close{ font-size:13.5px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }

  .veil{ position:fixed; inset:0; max-width:460px; margin:0 auto; background:oklch(10% 0.01 55 / 78%); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .modal{ width:100%; background:var(--surface); border-top:1px solid var(--border); border-radius:22px 22px 0 0; padding:24px 22px 28px; display:flex; flex-direction:column; gap:16px; max-height:80vh; overflow-y:auto; }
  .mhead{ text-align:center; }
  .mtitle{ font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:0.03em; }
  .msub{ font-size:13px; color:var(--text-dim); font-weight:600; margin-top:6px; }
  .msub b{ color:var(--text); }
  .assistgrid{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .achip{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px; text-align:left; }
  .achip:active{ border-color:var(--accent); }
  .achip .av{ width:32px; height:32px; border-radius:999px; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; }
  .achip .nm{ font-weight:700; font-size:13.5px; }
  .fullbtn{ width:100%; text-align:center; padding:14px; border-radius:12px; border:1px solid var(--border); color:var(--text-dim); font-weight:700; font-size:14px; }
  .fullbtn:active{ border-color:var(--accent); color:var(--text); }
  .cancel{ text-align:center; font-size:12.5px; color:var(--text-dim); text-decoration:underline; font-weight:600; }

  .zshead{ display:flex; align-items:center; justify-content:space-between; }
  .zsplayer{ display:flex; align-items:center; gap:10px; }
  .zsname{ font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; }
  .zsbadge{ margin-left:auto; display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase; color:var(--accent-ink); flex-shrink:0; }
  .courtwrap{ display:flex; justify-content:center; padding:6px 0 2px; }
  .courtbox{ position:relative; width:100%; max-width:320px; }
  .zonepath{ cursor:pointer; transition:opacity .15s; }
  .zonelabel{ position:absolute; transform:translate(-50%,-50%); font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; color:var(--text); text-shadow:0 1px 3px oklch(10% 0.01 55 / 80%); pointer-events:none; text-align:center; white-space:nowrap; }
  .zoneprompt{ text-align:center; font-size:13px; font-weight:700; color:var(--text-dim); min-height:18px; }
  .shotmapcard{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 8px 10px; margin-top:16px; }
  .shotmaptitle{ padding:0 10px; margin-bottom:2px; }
  .zonelbl{ position:absolute; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  .zonepct{ font-family:'Oswald',sans-serif; font-size:13px; font-weight:700; color:oklch(98% 0.01 85); text-shadow:0 1px 3px oklch(10% 0.01 55 / 85%); line-height:1.1; }
  .zonema{ font-size:9px; font-weight:700; color:oklch(98% 0.01 85 / 82%); text-shadow:0 1px 3px oklch(10% 0.01 55 / 85%); margin-top:1px; }

  .swipecard .shotmapcard, .swipecard .trendcard, .swipecard .periodstatcard{ background:none; border:none; border-radius:0; margin-top:0; padding-top:0; }
  /* la altura del viewport se fija por JS (setupSwipeHeights) a la altura

     páginas más cortas). align-items:flex-start hace que cada página mida

  .swipeviewport{ overflow:hidden; touch-action:pan-y; flex-shrink:0; transition:height 0.28s ease; }

  /* ---- estructura de 3 páginas forzadas del PDF exportado ---- */
  .printpage{ position:relative; min-height:178mm; padding-bottom:30px; }
  .printpage.pagebreak{ page-break-before:always; break-before:page; }
  .printfoot{ position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px solid var(--border); font-size:10px; font-weight:700; letter-spacing:0.02em; color:var(--text-dim); }

  @media print{
    html, body{ background:#fff !important; height:auto !important; overflow:visible !important; }
    /* El body normal es position:fixed + inset:0 (para que la app se comporte
       como una pantalla de móvil) -- eso por sí solo ya recorta cualquier
       contenido a la altura de la pantalla aunque #app esté oculto y el resto
       tenga overflow:visible, porque "fixed + inset:0" fija el tamaño de la
       caja al viewport. Hay que anularlo explícitamente para imprimir. */
    body{ position:static !important; inset:auto !important; display:block !important; }
    /* Antes se ocultaba todo con visibility:hidden y #printArea se sacaba del
       flujo con position:absolute -- en el "Compartir" -> "Imprimir"/PDF del
       iPhone (WKWebView) eso recorta el documento a una sola página: todo lo
       que quede más abajo de esa primera pantalla (la tabla de jugadoras)
       simplemente no llega a exportarse, no es que pase a una página 2.
       Ahora en su lugar se oculta #app entero (que es donde vive TODA la app,
       incluida cualquier ventana abierta) con display:none y #printArea se
       queda en flujo normal (position:static), para que la paginación real
       a varias páginas funcione como en cualquier documento HTML normal. */
    #app{ display:none !important; }
    #printArea{
      display:block; position:static; width:100%; padding:10px 14px 30px;
      --bg:#ffffff; --surface:#ffffff; --surface-2:#f2efe9; --border:#d9d3c9; --text:#221a14; --text-dim:#6c6259; --accent:#c2410c; --accent-ink:#ffffff; --good:#15803d; --bad:#b91c1c; --rival:#1d4ed8;
      background:#fff; color:#221a14;
    }
    #printArea .tablewrap{ overflow:visible; border:none; }
    #printArea .stattable{ font-size:9px; width:100%; }
    #printArea .stattable thead th, #printArea .stattable tbody td{ padding:5px 5px; }
    #printArea .stattable thead th{ position:static; }
    #printArea .stickycol{ position:static; }

<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
'use strict';

/* ---------- storage ---------- */
var STORE_KEY = 'boxscore_v1_state';

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { games: [], current: null, route: 'boot', routeParams: {}, currentTeamId: null, currentSeasonId: null };
}
function saveState(game){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  scheduleCloudSave(game || S.current);
}

var S = loadState();
/* Cada vez que se abre la app (icono, refresco) debe arrancar SIEMPRE en Inicio.
   Si hay un partido en curso sin terminar, se ofrece continuarlo mediante un
   popup (ver maybeOfferResume) en lugar de navegar directamente a él. */
S.route = 'home';
S.routeParams = {};
// el equipo/temporada que se estaban viendo se recuerdan entre sesiones (se
// confirman o se corrigen en cuanto vuelve a cargar la lista real desde la nube)
currentTeamId = S.currentTeamId || null;
currentSeasonId = S.currentSeasonId || null;
var resumePromptShown = false;

/* ---------- Supabase (cloud backend) ---------- */
var SUPABASE_URL = 'https://amgmlsdbllknvwuixozc.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtZ21sc2RibGxrbnZ3dWl4b3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjI0MzMsImV4cCI6MjEwNDczODQzM30._ddwOdRLoQR4xSoskQ26znaZjDSJo0677BdbbAOFdI4';
var SUPABASE_CONFIGURED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
var sb = null;
if(SUPABASE_CONFIGURED && window.supabase && window.supabase.createClient){
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ sb = null; }
}

var authUser = null;
var authProfile = null;
var authChecked = false;
var authBusy = false;
var authError = '';
var clubSettings = { team_name:'', category:'', logo_url:'', photo_url:'', fbm_url:'', fbm_fases:[] };
var selectedFaseId = null;
var standings = [];
var teamRoster = [];
var cloudSaveTimer = null;
var assetUploadBusy = false;

/* ---------- equipos y temporadas ---------- */
// "teams" y "seasons" son las filas reales de Supabase visibles para esta persona
// (RLS ya se encarga de que solo aparezcan los equipos/temporadas a los que tiene
// algún tipo de relación). "clubSettings" (arriba) sigue existiendo tal cual para
// no tocar toda la pantalla de Inicio/Equipo/AdminFbm: se recalcula a partir del
// equipo+temporada actuales cada vez que cambian (ver recomputeClubSettingsView).
var teams = [];
var seasons = [];
var currentTeamId = null;
var currentSeasonId = null;
var currentTeam = null;
var currentSeason = null;
var myAccessRows = [];           // filas de team_season_access de esta persona (todas, cualquier estado)
var pendingAccessRequests = [];  // solicitudes pendientes de la temporada actual (para la campanita de Inicio)
var teamSwitcherOpen = false;
var seasonSwitcherOpen = false;
var nuevaTemporadaStep = 0;      // 0 = cerrado, 1 = paso 1, 2 = paso 2
var nuevaTemporadaDraft = null;
var usersFilterSeasonId = null;
var usersScreenData = { pending:[], approved:[], others:[] };
var analyticsRangeDays = 30;   // 7 / 30 / null (Todo)
var analyticsScreen = 'list';  // 'list' | 'detail'
var analyticsSelectedUserId = null;
var analyticsLoading = false;
var analyticsUsers = [];        // [{id,name,email,totalSeconds,visitCount,lastVisitAt(Date)}]
var analyticsVisitsByUser = {}; // userId -> [{route,entered_at(Date),duration_seconds}]

function uuidv4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

async function bootAuth(){
  if(!sb){ authChecked = true; if(S.route==='boot') S.route = 'home'; maybeOfferResume(); render(); return; }
  try{
    var res = await sb.auth.getSession();
    var session = res && res.data && res.data.session;
    if(session && session.user){
      authUser = session.user;
      await loadProfile();
    }
  }catch(e){}
  authChecked = true;
  await decideRouteAfterAuth();
  render();
  try{
    sb.auth.onAuthStateChange(function(_evt, session){
      var wasUser = authUser;
      authUser = (session && session.user) ? session.user : null;
      if(authUser && (!wasUser || wasUser.id!==authUser.id)){
        loadProfile().then(function(){ return decideRouteAfterAuth(); }).then(function(){ render(); });
      } else if(!authUser){
        authProfile = null; S.route = 'login'; render();
      }
    });
  }catch(e){}
}
async function loadProfile(){
  if(!sb || !authUser) return;
  try{
    var res = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
    authProfile = (res && res.data) || null;
  }catch(e){ authProfile = null; }
  // si el usuario ya tiene sesión pero todavía no existe su fila en "profiles"
  // (primer login tras confirmar el correo, o el alta se hizo con sesión inmediata),
  // la creamos ahora que sabemos que auth.uid() coincide con su id (RLS lo permite).
  if(!authProfile){
    var fallbackName = (authUser.user_metadata && authUser.user_metadata.name) || (authUser.email||'').split('@')[0];
    try{
      var ins = await sb.from('profiles').insert({ id:authUser.id, name:fallbackName, email:authUser.email, status:'pending', role:'member' });
      if(!ins || !ins.error){
        authProfile = { id:authUser.id, name:fallbackName, email:authUser.email, status:'pending', role:'member' };
      }
    }catch(e){ /* no se pudo crear el perfil; se reintentará en el siguiente acceso */ }
  }
}
var AUTH_ROUTES = ['login','register','pending','rejected','confirm','boot','pickTeam'];
async function decideRouteAfterAuth(){
  if(!SUPABASE_CONFIGURED) return;
  if(!authUser){ S.route = 'login'; return; }
  if(!authProfile){ S.route = 'pending'; return; }
  await loadTeamsAndAccess();
  if(isAdmin()){
    if(AUTH_ROUTES.indexOf(S.route)!==-1 || !S.route) S.route = 'home';
    loadPendingAccessRequests();
    if(S.route==='home') maybeOfferResume();
    return;
  }
  var approved = myAccessRows.filter(function(r){ return r.status==='approved'; });
  var pending = myAccessRows.filter(function(r){ return r.status==='pending'; });
  if(approved.length){
    if(AUTH_ROUTES.indexOf(S.route)!==-1 || !S.route) S.route = 'home';
    if(S.route==='home') maybeOfferResume();
    return;
  }
  if(pending.length){ S.route = 'pending'; return; }
  if(myAccessRows.length){ S.route = 'rejected'; return; } // todas sus solicitudes fueron rechazadas
  // cuenta recién creada, sin ninguna solicitud todavía: hace falta elegir a qué equipo pertenece
  if(!teams.length){ S.route = 'pending'; return; }
  if(teams.length===1){
    await requestAccessToTeam(teams[0].id);
    S.route = 'pending';
    return;
  }
  S.route = 'pickTeam';
}
async function requestAccessToTeam(teamId){
  if(!sb || !authUser || !teamId) return;
  try{
    var sr = await sb.from('seasons').select('id').eq('team_id', teamId).eq('is_current', true).maybeSingle();
    var seasonId = sr && sr.data && sr.data.id;
    if(!seasonId) return;
    var ins = await sb.from('team_season_access').insert({ user_id: authUser.id, season_id: seasonId, status:'pending' });
    if(!ins || !ins.error){
      myAccessRows.push({ id:null, user_id:authUser.id, season_id:seasonId, status:'pending' });
    }
  }catch(e){}
}
function choosePickTeam(teamId){
  authBusy = true; render();
  requestAccessToTeam(teamId).then(function(){ authBusy=false; S.route='pending'; render(); });
}

async function doRegister(){
  if(!sb) return;
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  if(!name || !email || !pass){ authError='Rellena todos los campos.'; render(); return; }
  if(pass.length<6){ authError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(pass!==pass2){ authError='Las contraseñas no coinciden.'; render(); return; }
  authBusy = true; authError=''; render();
  try{
    var res = await sb.auth.signUp({ email: email, password: pass, options: { data: { name: name } } });
    if(res.error) throw res.error;
    var user = res.data.user;
    var session = res.data.session;
    if(user && session){
      // el proyecto no exige confirmar el correo: ya hay sesión activa, creamos el perfil ya mismo
      authUser = user;
      await loadProfile();
      await decideRouteAfterAuth();
    } else if(user){
      // el proyecto exige confirmar el correo antes de tener sesión;
      // el perfil se creará automáticamente en el primer inicio de sesión tras confirmarlo
      authUser = null; authProfile = null;
      S.route = 'confirm';
    }
  }catch(e){
    authError = (e && e.message) || 'No se ha podido crear la cuenta.';
  }
  authBusy = false; render();
}
async function doLogin(){
  if(!sb) return;
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  if(!email || !pass){ authError='Introduce tu correo y contraseña.'; render(); return; }
  authBusy = true; authError=''; render();
  try{
    var res = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(res.error) throw res.error;
    authUser = res.data.user;
    await loadProfile();
    await decideRouteAfterAuth();
  }catch(e){
    authError = 'Correo o contraseña incorrectos.';
  }
  authBusy = false; render();
}
async function doLogout(){
  if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
  authUser = null; authProfile = null; menuOpen=false; teams=[]; seasons=[]; myAccessRows=[];
  currentTeamId=null; currentSeasonId=null; currentTeam=null; currentSeason=null;
  S.route = 'login'; render();
}

/* ---------- equipos, temporadas y acceso ---------- */
async function loadTeamsAndAccess(){
  if(!sb || !authUser) return;
  try{
    var tr = await sb.from('teams').select('*').order('created_at',{ascending:true});
    teams = (tr && tr.data) || [];
  }catch(e){ teams = []; }
  try{
    var ar = await sb.from('team_season_access').select('*').eq('user_id', authUser.id);
    myAccessRows = (ar && ar.data) || [];
  }catch(e){ myAccessRows = []; }
  await pickCurrentTeamAndSeason();
}
function byIdArr(arr, id){ return (arr||[]).filter(function(x){ return x.id===id; })[0] || null; }
function saveSelectionLocally(){
  S.currentTeamId = currentTeamId; S.currentSeasonId = currentSeasonId;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
}
async function pickCurrentTeamAndSeason(){
  if(!teams.length){ currentTeamId=null; currentTeam=null; seasons=[]; currentSeasonId=null; currentSeason=null; recomputeClubSettingsView(); return; }
  if(!currentTeamId || !teams.some(function(t){ return t.id===currentTeamId; })){
    currentTeamId = teams[0].id;
  }
  currentTeam = byIdArr(teams, currentTeamId);
  await loadSeasonsForCurrentTeam();
}
async function loadSeasonsForCurrentTeam(){
  seasons = [];
  if(!currentTeamId){ currentSeasonId=null; currentSeason=null; recomputeClubSettingsView(); return; }
  try{
    var sr = await sb.from('seasons').select('*').eq('team_id', currentTeamId).order('created_at',{ascending:false});
    seasons = (sr && sr.data) || [];
  }catch(e){ seasons = []; }
  if(!currentSeasonId || !seasons.some(function(s){ return s.id===currentSeasonId; })){
    var cur = seasons.filter(function(s){ return s.is_current; })[0];
    currentSeasonId = cur ? cur.id : (seasons[0] ? seasons[0].id : null);
  }
  currentSeason = byIdArr(seasons, currentSeasonId);
  saveSelectionLocally();
  recomputeClubSettingsView();
  await loadSeasonScopedData();
}
function recomputeClubSettingsView(){
  clubSettings = {
    team_name: (currentTeam && currentTeam.name) || '',
    category: (currentTeam && currentTeam.category) || '',
    logo_url: (currentTeam && currentTeam.logo_url) || '',
    photo_url: (currentTeam && currentTeam.photo_url) || '',
    fbm_url: (currentSeason && currentSeason.fbm_url) || '',
    fbm_fases: (currentSeason && currentSeason.fbm_fases) || []
  };
}
function switchTeam(teamId){
  if(teamId===currentTeamId){ teamSwitcherOpen=false; render(); return; }
  if(S.current && S.current.started && !S.current.finished){ showToast('Termina el partido en curso antes de cambiar de equipo.'); return; }
  currentTeamId = teamId;
  currentSeasonId = null; // se recalcula a la temporada actual de ese equipo
  teamSwitcherOpen = false;
  render();
  pickCurrentTeamAndSeason().then(function(){ if(isAdmin()) loadPendingAccessRequests(); });
}
function switchSeason(seasonId){
  if(seasonId===currentSeasonId){ seasonSwitcherOpen=false; render(); return; }
  if(S.current && S.current.started && !S.current.finished){ showToast('Termina el partido en curso antes de cambiar de temporada.'); return; }
  currentSeasonId = seasonId;
  seasonSwitcherOpen = false;
  render();
  loadSeasonsForCurrentTeam().then(function(){ if(isAdmin()) loadPendingAccessRequests(); });
}
function openTeamSwitcher(){ teamSwitcherOpen = true; seasonSwitcherOpen=false; render(); }
function closeTeamSwitcher(){ teamSwitcherOpen = false; render(); }
function openSeasonSwitcher(){ seasonSwitcherOpen = true; teamSwitcherOpen=false; render(); }
function closeSeasonSwitcher(){ seasonSwitcherOpen = false; render(); }

async function loadPendingAccessRequests(){
  if(!sb || !currentSeasonId){ pendingAccessRequests = []; render(); return; }
  try{
    var res = await sb.from('team_season_access').select('*, profiles(name,email)').eq('season_id', currentSeasonId).eq('status','pending').order('created_at',{ascending:true});
    pendingAccessRequests = (res && res.data) || [];
  }catch(e){ pendingAccessRequests = []; }
  render();
}
async function decideOnAccessRequest(id, approve){
  if(!sb) return;
  try{ await sb.from('team_season_access').update({ status: approve?'approved':'rejected', decided_at: new Date().toISOString() }).eq('id', id); }catch(e){}
  loadPendingAccessRequests();
}

function hasApprovedAccessTo(seasonId){
  if(isAdmin()) return true;
  return myAccessRows.some(function(r){ return r.season_id===seasonId && r.status==='approved'; });
}
// Con acceso aprobado se puede VER la temporada; para poder ESCRIBIR en ella
// (crear partidos, tocar la plantilla, anotar en directo...) hace falta
// además ser "colaborador" (team_season_access.can_edit) -- o admin, que
// siempre puede. Por defecto una persona aprobada es de solo lectura.
function hasCollabAccessTo(seasonId){
  if(isAdmin()) return true;
  return myAccessRows.some(function(r){ return r.season_id===seasonId && r.status==='approved' && r.can_edit===true; });
}
function canWriteCurrentSeason(){
  return !!(currentSeason && currentSeason.is_current && hasCollabAccessTo(currentSeasonId));
}

async function loadSeasonScopedData(){
  if(!sb || !currentSeasonId){ standings=[]; teamRoster=[]; S.games=[]; S.current=null; render(); return; }
  try{
    var st = await sb.from('standings_entries').select('*').eq('season_id', currentSeasonId).order('position',{ascending:true});
    standings = (st && st.data) || [];
  }catch(e){ standings = []; }
  try{
    var pl = await sb.from('players').select('*').eq('season_id', currentSeasonId).eq('active',true).order('dorsal',{ascending:true});
    teamRoster = (pl && pl.data) || [];
  }catch(e){ teamRoster = []; }
  try{
    var ms = await sb.from('matches').select('*').eq('season_id', currentSeasonId).order('played_at',{ascending:false});
    S.games = []; S.current = null;
    if(ms && ms.data && ms.data.length){
      S.games = ms.data.filter(function(row){ return row.finished; }).map(function(row){
        var g = row.data || {};
        g.id = row.id; g.kind = row.kind; g.jornada = row.jornada; g.season_id = row.season_id;
        return g;
      });
      // Solo debería existir un partido en curso a la vez. Si aparece más de una
      // fila sin terminar (restos de una "resurrección" de una versión antigua
      // de deleteMatch(), cuando un guardado en la nube pendiente podía volver a
      // crear el partido justo después de borrarlo -- ya corregido, pero puede
      // haber dejado filas sueltas en Supabase de antes de ese arreglo), nos
      // quedamos con la más reciente como la de verdad y limpiamos el resto,
      // para que no puedan seguir reapareciendo como "otro partido nuevo" cada
      // vez que se borra el que se ve en la app.
      var unfinishedRows = ms.data.filter(function(row){ return !row.finished; });
      if(unfinishedRows.length){
        unfinishedRows.sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
        var liveRow = unfinishedRows[0];
        var staleRows = unfinishedRows.slice(1);
        if(staleRows.length && isAdmin()){
          staleRows.forEach(function(row){
            sb.from('matches').delete().eq('id', row.id).then(function(){}).catch(function(){});
          });
          showToast('Se han limpiado '+staleRows.length+' partido'+(staleRows.length===1?'':'s')+' en curso duplicado'+(staleRows.length===1?'':'s')+' que habían quedado sueltos en la nube.');
        }
        var g2 = liveRow.data || {};
        g2.id = liveRow.id; g2.kind = liveRow.kind; g2.jornada = liveRow.jornada; g2.season_id = liveRow.season_id;
        S.current = g2;
      }
    }
  }catch(e){}
  saveSelectionLocally();
  render();
}

function scheduleCloudSave(game){
  if(!sb || !canWriteCurrentSeason()) return;
  if(!game) return;
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(function(){ pushMatch(game); }, 900);
}
async function pushMatch(g){
  if(!sb || !g) return;
  var row = {
    id: g.id,
    season_id: g.season_id || currentSeasonId,
    kind: g.kind || 'liga',
    jornada: g.jornada || null,
    rival_name: g.rivalName || null,
    played_at: matchDateStr(g),
    finished: !!g.finished,
    team_score: (typeof teamScore==='function') ? teamScore(g) : 0,
    rival_score: (typeof rivalScore==='function') ? rivalScore(g) : 0,
    data: g,
    created_by: authProfile ? authProfile.id : null
  };
  if(!row.season_id) return { error: 'sin temporada seleccionada' };
  try{ return await sb.from('matches').upsert(row); }catch(e){ return { error: e }; }
}
// "clubSettings" (la copia local que usan las pantallas de Inicio/Equipo/AdminFbm)
// junta campos que en Supabase viven en dos tablas distintas: el nombre/categoría/
// escudo/foto pertenecen al EQUIPO ("teams"), mientras que la página y las fases de
// la FBM pertenecen a la TEMPORADA actual ("seasons"). saveClubSettings reparte cada
// patch a la tabla que corresponda. Sigue usando update() y no upsert() -- igual que
// antes con club_settings.id=1 -- porque el equipo y la temporada actuales siempre
// existen ya (se crean al darlos de alta), así que nunca hace falta el camino de
// INSERT y no dependemos de que esa política esté bien configurada. Y como cada
// llamada solo toca los campos concretos del patch (no la fila entera), dos guardados
// que se solapen en vuelo ya no pueden pisarse el uno al otro como sí podía pasar
// con el upsert() de la fila completa que usaba club_settings.
var TEAM_SETTINGS_FIELDS = { team_name:'name', category:'category', logo_url:'logo_url', photo_url:'photo_url' };
var SEASON_SETTINGS_FIELDS = { fbm_url:'fbm_url', fbm_fases:'fbm_fases' };
async function saveClubSettings(patch){
  clubSettings = Object.assign({}, clubSettings, patch);
  render();
  if(!sb) return;
  var teamPatch = {}, seasonPatch = {}, hasTeam=false, hasSeason=false;
  Object.keys(patch).forEach(function(k){
    if(TEAM_SETTINGS_FIELDS.hasOwnProperty(k)){ teamPatch[TEAM_SETTINGS_FIELDS[k]] = patch[k]; hasTeam = true; }
    else if(SEASON_SETTINGS_FIELDS.hasOwnProperty(k)){ seasonPatch[SEASON_SETTINGS_FIELDS[k]] = patch[k]; hasSeason = true; }
  });
  var jobs = [];
  if(hasTeam && currentTeamId){
    jobs.push(sb.from('teams').update(teamPatch).eq('id', currentTeamId).then(function(res){
      if(res && res.error) showToast('No se ha podido guardar el equipo.');
      else if(currentTeam) Object.assign(currentTeam, teamPatch);
    }));
  }
  if(hasSeason && currentSeasonId){
    jobs.push(sb.from('seasons').update(seasonPatch).eq('id', currentSeasonId).then(function(res){

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function byId(arr, id){ return arr.filter(function(x){return x.id===id;})[0]; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n){ return (n<10?'0':'')+n; }
function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
// Fecha del partido: usa el campo explícito "matchDate" (yyyy-mm-dd, editable desde
// la app) si existe; si no (partidos creados antes de que existiera este campo),
// se deduce de cuándo se creó/terminó el partido, como se hacía antes.
function matchDateStr(g){
  if(g.matchDate) return g.matchDate;
  var d = new Date(g.finishedAt||g.createdAt||Date.now());
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
// Devuelve un Date en hora LOCAL a partir de "yyyy-mm-dd" -- construirlo con
// "new Date('yyyy-mm-dd')" lo interpreta como UTC y puede mostrar el día anterior
// según la zona horaria del dispositivo.
function matchDateObj(g){
  var parts = matchDateStr(g).split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}

    rivalAgg: {twoM:0,twoA:0,threeM:0,threeA:0,ftM:0,ftA:0,rebO:0,rebD:0,foulC:0,foulR:0,ast:0,blk:0,to:0,stl:0}

/* ---------- derived stats (events are the single source of truth) ---------- */
function teamScore(g){
  var s=0;
  g.events.forEach(function(e){ if(e.side==='team') s+=e.points; });
  return s;
}
function rivalScore(g){
  var s=0;
  g.events.forEach(function(e){ if(e.side==='rival') s+=e.points; });
  return s;
}
function periodScores(g){
  var out = {};
  for(var p=1;p<=g.periodsCount;p++) out[p]={team:0,rival:0};
  g.events.forEach(function(e){
    if(!out[e.period]) out[e.period]={team:0,rival:0};
    out[e.period][e.side] += e.points;
  });
  return out;
}
function playerStats(g, playerId){
  var st = {pts:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,rebO:0,rebD:0,ast:0,stl:0,blk:0,to:0,foulC:0,foulR:0,plusMinus:0};
  g.events.forEach(function(e){
    if(e.side==='team' && e.playerId===playerId){
      switch(e.type){
        case '2m': st.fg2m++; st.fg2a++; st.pts+=2; break;
        case '2x': st.fg2a++; break;
        case '3m': st.fg3m++; st.fg3a++; st.pts+=3; break;
        case '3x': st.fg3a++; break;
        case 'ftm': st.ftm++; st.fta++; st.pts+=1; break;
        case 'ftx': st.fta++; break;
        case 'rebO': st.rebO++; break;
        case 'rebD': st.rebD++; break;
        case 'ast': st.ast++; break;
        case 'stl': st.stl++; break;
        case 'blk': st.blk++; break;
        case 'to': st.to++; break;
        case 'foulC': st.foulC++; break;
        case 'foulR': st.foulR++; break;
      }
    }
    // assist credited separately from the assisting player id on scoring events
    if(e.side==='team' && e.assistPlayerId===playerId){ st.ast++; }
  });
  // plus/minus: for every scoring event (team or rival) while this player was on court
  g.events.forEach(function(e){
    if((e.type==='2m'||e.type==='3m'||e.type==='ftm'||e.type==='rivalpts') && e.onCourtSnapshot && e.onCourtSnapshot.indexOf(playerId)!==-1){
      if(e.side==='team') st.plusMinus += e.points;
      else st.plusMinus -= e.points;
    }
  });
  return st;
}
function eff(st){
  var made = st.fg2m+st.fg3m+st.ftm;
  var attempted = st.fg2a+st.fg3a+st.fta;
  var missed = attempted-made;
  return (st.pts+st.rebO+st.rebD+st.ast+st.stl+st.blk) - (missed+st.to);
}
function minutesFor(g, playerId){
  var ov = g.minutesOverride[playerId];
  var total=0, perPeriod={};
  for(var p=1;p<=g.periodsCount;p++){
    if(ov && ov[p]!=null){ perPeriod[p]=ov[p]; }
    else if(g.periodAppearances[playerId] && g.periodAppearances[playerId].indexOf(p)!==-1){ perPeriod[p]=g.periodMinutes; }
    else { perPeriod[p]=0; }
    total += perPeriod[p];
  }
  return {total:total, perPeriod:perPeriod};
}
function recordAppearance(g){
  var p = g.currentPeriod;
  g.onCourt.forEach(function(pid){
    if(!g.periodAppearances[pid]) g.periodAppearances[pid]=[];
    if(g.periodAppearances[pid].indexOf(p)===-1) g.periodAppearances[pid].push(p);
  });
}

/* ---------- events ---------- */
function pushEvent(g, ev){
  ev.id = uid();
  ev.ts = Date.now();
  ev.period = g.currentPeriod;
  ev.onCourtSnapshot = g.onCourt.slice();
  g.events.push(ev);
  saveState();
}
function lastActionLabel(g){
  if(!g.events.length) return 'Sin jugadas registradas todavía';
  var e = g.events[g.events.length-1];
  var names = {'2m':'Tiro de 2 anotado (+2)','2x':'Tiro de 2 fallado','3m':'Tiro de 3 anotado (+3)','3x':'Tiro de 3 fallado',
    'ftm':'Tiro libre anotado (+1)','ftx':'Tiro libre fallado','rebO':'Rebote ofensivo','rebD':'Rebote defensivo',
    'ast':'Asistencia','stl':'Robo','blk':'Tapón','to':'Pérdida','foulC':'Falta cometida','foulR':'Falta recibida',
    'rivalpts':'Puntos del rival (+'+e.points+')'};
  if(e.side==='rival') return '<b>Rival</b> — ' + (names[e.type]||e.type);
  var p = byId(S.current.roster, e.playerId);
  var label = 'Nº'+(p?p.dorsal:'?')+' <b>'+(p?firstName(p.name):'?')+'</b> — '+(names[e.type]||e.type);
  return label;
}
function firstName(full){ return (full||'').split(' ')[0]; }

/* ---------- play-by-play (Partido en directo) ---------- */
var EVENT_TYPE_LABELS = {
  '2m':'Tiro de 2 anotado', '2x':'Tiro de 2 fallado', '3m':'Tiro de 3 anotado', '3x':'Tiro de 3 fallado',
  'ftm':'Tiro libre anotado', 'ftx':'Tiro libre fallado', 'rebO':'Rebote ofensivo', 'rebD':'Rebote defensivo',
  'ast':'Asistencia', 'stl':'Robo', 'blk':'Tapón', 'to':'Pérdida', 'foulC':'Falta cometida', 'foulR':'Falta recibida'
};
function playRowData(e, g){
  // "g" es el partido que se está mostrando -- antes esta función siempre
  // miraba a S.current (el partido en directo), lo cual solo funcionaba por
  // casualidad porque su única llamada era desde la pantalla "en directo".
  // Ahora también se usa para ver las jugadas de un partido ya finalizado
  // (que no es S.current), así que necesita el roster del partido correcto.
  g = g || S.current;
  var label = e.type==='rivalpts' ? 'Puntos del rival' : (EVENT_TYPE_LABELS[e.type] || e.type);
  var deltaLabel = '', deltaCls = '';
  if(e.type==='rivalpts'){ deltaLabel = '+'+e.points; deltaCls = 'bad'; }
  else if(e.points>0){ deltaLabel = '+'+e.points; deltaCls = 'good'; }
  if(e.assistPlayerId){
    var ap = byId(g.roster, e.assistPlayerId);
    if(ap) label += ' · asist. Nº'+ap.dorsal;
  }
  var who;
  if(e.side==='rival') who = 'Rival';
  else { var p = byId(g.roster, e.playerId); who = p ? ('Nº'+p.dorsal+' '+firstName(p.name)) : '?'; }
  return { who:who, label:label, deltaLabel:deltaLabel, deltaCls:deltaCls };
}

function renderPlayByPlay(g, opts){
  opts = opts || {};
  var readOnly = !!opts.readOnly;
  // "flowing": el llamador ya está dentro de su propio contenedor con scroll
  // (p.ej. .boxcontent en el box score de un partido ya finalizado), así que
  // esta lista no debe intentar ocupar el resto de la pantalla ni scrollear
  // por su cuenta -- se deja fluir como un bloque más, sin el padding propio
  // pensado originalmente para la pantalla "en directo".
  var headStyle = opts.flowing ? ' style="padding:0 0 8px"' : '';
  var listStyle = opts.flowing ? ' style="padding:0;overflow:visible;flex:none"' : '';
  var events = g.events.slice().reverse();
  var h = '<div class="playhead"'+headStyle+'><div class="label" style="margin-bottom:0">Jugadas del partido</div>'+
    '<div class="label" style="margin-bottom:0;color:var(--text-dim)">'+events.length+' jugada'+(events.length===1?'':'s')+'</div></div>';
  h += '<div class="playlist"'+listStyle+'>';
  if(!events.length){
    h += '<div class="emptyplays">Sin jugadas registradas todavía</div>';
  }
  events.forEach(function(e){
    var d = playRowData(e, g);
    h += '<div class="playrow">'+
      '<div class="per">'+esc(g.periodLabel.charAt(0).toUpperCase())+e.period+'</div>'+
      '<div class="who">'+esc(d.who)+'</div>'+
      '<div class="what">'+esc(d.label)+'</div>'+
      (d.deltaLabel ? '<div class="delta '+d.deltaCls+'">'+d.deltaLabel+'</div>' : '');
    if(!readOnly){
      h += '<button class="playbtn" onclick="pbpToggleEdit(\''+e.id+'\')">'+icon('pencil',14)+'</button>'+
        '<button class="playbtn" onclick="pbpAskDelete(\''+e.id+'\')">'+icon('trash',14)+'</button>';
    }
    if(!readOnly && pbpEditingId===e.id){
      if(pbpEditRivalId===e.id){
        h += '<div class="editpanel"><div class="editlabel">¿Cuántos puntos ha anotado el rival?</div>'+
          '<div class="editchip back" onclick="pbpBackToPlayers()">'+icon('back',12)+' Jugadoras</div>';
        [1,2,3].forEach(function(v){

        '<button class="no" onclick="pbpCancelDelete()">Cancelar</button>'+

    }
    h += '</div>';
  });
  h += '</div>';
  return h;

/* ---------- analítica de uso: qué pantallas visita cada persona y cuánto tiempo ----------
   Se guarda una fila por visita en la tabla screen_visits, solo para personas con acceso
   aprobado que no sean admin (Rober no se registra a sí mismo). El tiempo contado es solo
   el que la app pasa en primer plano: al pasar a segundo plano (bloquear el móvil, cambiar
   de app) se pausa el cronómetro sin cerrar la visita; al volver, se reanuda. La visita se
   cierra (y se guarda, si dura lo suficiente para ser significativa) al cambiar de pantalla
   o al cerrar la app. No hay ningún aviso en la app sobre esto -- decisión explícita de Rober. */
var ROUTE_LABELS = {
  home:'Inicio', team:'Equipo', roster:'Plantilla', admin:'Admin',
  adminFbm:'Admin · Fuente FBM', adminUsuarios:'Admin · Usuarios', analytics:'Admin · Analítica',
  diag:'Diagnóstico', stats:'Estadísticas', setup:'Nuevo partido',
  lineup:'Quinteto inicial', live:'Partido en directo', stat:'Anotar estadística',
  shotzone:'Zona de tiro', assist:'Asistencia', rivalquick:'Marcador rival rápido',
  rivalsheet:'Ficha rival', box:'Box score', minutes:'Minutos', games:'Partidos',
  approvals:'Solicitudes de acceso', ranking:'Clasificación', mvpHistory:'Histórico MVP',
  standingsEdit:'Editar clasificación', playerRadar:'Radar de jugadora', matchPlayer:'Jugadora del partido'
};
function routeLabel(route){ return ROUTE_LABELS[route] || route || '—'; }

var currentVisit = null; // { route, startedAt(ms), segStart(ms|null), accumMs }
var VISIT_MIN_SECONDS = 2; // visitas más cortas que esto no se guardan (ruido de navegación)
function shouldTrackVisits(){
  return !!(sb && authUser && authProfile && !isAdmin());
}
function startVisit(route){
  if(!shouldTrackVisits() || !route || AUTH_ROUTES.indexOf(route)!==-1) return;
  currentVisit = { route: route, startedAt: Date.now(), segStart: (document.visibilityState!=='hidden' ? Date.now() : null), accumMs: 0 };
}
function pauseVisit(){
  if(!currentVisit || currentVisit.segStart==null) return;
  currentVisit.accumMs += Date.now() - currentVisit.segStart;
  currentVisit.segStart = null;
}
function resumeVisit(){
  if(!currentVisit || currentVisit.segStart!=null) return;
  if(document.visibilityState==='hidden') return;
  currentVisit.segStart = Date.now();
}
function endVisit(){
  if(!currentVisit) return;
  pauseVisit();
  var v = currentVisit;
  currentVisit = null;
  var seconds = Math.round(v.accumMs/1000);
  if(seconds < VISIT_MIN_SECONDS || !shouldTrackVisits()) return;
  try{
    sb.from('screen_visits').insert({
      user_id: authUser.id,
      route: v.route,
      entered_at: new Date(v.startedAt).toISOString(),
      duration_seconds: seconds
    }).then(function(){}, function(){});
  }catch(e){}
}
function trackRouteVisit(route){
  if(currentVisit && currentVisit.route===route) return; // misma pantalla: no reiniciar la visita
  endVisit();
  startVisit(route);
}
try{
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden') pauseVisit(); else resumeVisit();
  });
  window.addEventListener('pagehide', function(){ endVisit(); });
}catch(e){}

// Convierte un evento de toque/click sobre un elemento SVG (con viewBox) en

// guardar el punto exacto del tiro, además de la zona, sin cambiar las
// "dianas" grandes que se tocan (siguen siendo las mismas cuñas de siempre).
function svgPointFromEvent(ev){
  try{
    var target = ev.currentTarget || ev.target;
    var svg = (target && target.ownerSVGElement) || (target && target.closest && target.closest('svg'));
    if(!svg || !svg.createSVGPoint) return null;
    var pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    var ctm = svg.getScreenCTM();
    if(!ctm) return null;
    var loc = pt.matrixTransform(ctm.inverse());
    return { x: Math.round(loc.x*10)/10, y: Math.round(loc.y*10)/10 };
  }catch(e){ return null; }
}

/* ---------- mapa de tiro (percentage by court zone) ---------- */
function zoneStatsFromEvents(events){
  var out = {};
  events.forEach(function(e){
    if(!e.zone) return;
    if(e.type!=='2m' && e.type!=='2x' && e.type!=='3m' && e.type!=='3x') return;
    var ring = (e.type==='3m' || e.type==='3x') ? 'three' : 'mid';
    var key = ring+':'+e.zone;
    if(!out[key]) out[key] = {m:0,a:0};
    out[key].a++;
    if(e.type==='2m' || e.type==='3m') out[key].m++;
  });
  return out;
}
function teamZoneStats(games, periods){
  var events = [];
  games.forEach(function(g){
    events = events.concat(g.events.filter(function(e){
      if(e.side!=='team') return false;
      if(periods && periods.length && periods.indexOf(e.period)===-1) return false;
      return true;
    }));
  });
  return zoneStatsFromEvents(events);
}
function playerZoneStats(games, dorsal, name){
  var events = [];
  games.forEach(function(g){
    var p = (g.roster||[]).filter(function(rp){ return rp.dorsal===dorsal && rp.name===name; })[0];
    if(!p) return;
    events = events.concat(g.events.filter(function(e){ return e.side==='team' && e.playerId===p.id; }));
  });
  return zoneStatsFromEvents(events);
}

/* ---------- mapa de calor: puntos exactos (o aproximados) por tiro ----------
   Desde esta actualización, cada tiro guarda además de su zona el punto (x,y)
   exacto donde se tocó (zoneX/zoneY, mismo sistema de coordenadas que
   ZONE_DEFS lx/ly). Los tiros anotados ANTES de esta actualización solo
   tienen la zona -- para esos se genera un punto aproximado, esparcido
   alrededor del centro de su zona. Ese esparcido usa una semilla fija por
   tiro (su id) en vez de Math.random(), para que el punto de un tiro antiguo
   no "salte" cada vez que se vuelve a pintar el mapa. */
function findZoneDef(ring, id){
  var list = ZONE_DEFS[ring];
  if(!list) return null;
  for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
  return null;
}
function seededRand01(seedStr){
  var h = 0;
  for(var i=0;i<seedStr.length;i++){ h = (h*31 + seedStr.charCodeAt(i)) | 0; }
  h = Math.abs(h);
  return (h % 100000) / 100000;
}
function seededGaussian(seedStr, sigma){
  var u1 = Math.max(seededRand01(seedStr+'|a'), 1e-6), u2 = seededRand01(seedStr+'|b');
  var z = Math.sqrt(-2*Math.log(u1)) * Math.cos(2*Math.PI*u2);
  return z*sigma;
}
function shotPointFor(e, zone){
  if(typeof e.zoneX==='number' && typeof e.zoneY==='number') return { x:e.zoneX, y:e.zoneY, real:true };
  var seed = e.id || (zone.id+'|'+(e.playerId||'')+'|'+(e.ts||''));
  var sigma = zone.ring==='three' ? 30 : 24;
  return { x: zone.lx + seededGaussian(seed+'x', sigma), y: zone.ly + seededGaussian(seed+'y', sigma), real:false };
}
// Recoge los puntos de tiro (cada uno {x,y,made}) de una lista de eventos ya
// filtrada, según el modo pedido ('attempts' = todos los tiros, 'makes' =
// solo los metidos).
function shotPointsFromEvents(events, mode){
  var pts = [];
  events.forEach(function(e){
    if(!e.zone) return;
    if(e.type!=='2m' && e.type!=='2x' && e.type!=='3m' && e.type!=='3x') return;
    var made = (e.type==='2m' || e.type==='3m');
    if(mode==='makes' && !made) return;
    var ring = (e.type==='3m' || e.type==='3x') ? 'three' : 'mid';
    var zone = findZoneDef(ring, e.zone);
    if(!zone) return;
    var p = shotPointFor(e, zone);
    pts.push({ x:p.x, y:p.y, made:made });
  });
  return pts;
}
function teamShotPoints(games, periods, mode){
  var events = [];
  games.forEach(function(g){
    events = events.concat((g.events||[]).filter(function(e){
      if(e.side!=='team') return false;
      if(periods && periods.length && periods.indexOf(e.period)===-1) return false;
      return true;
    }));
  });
  return shotPointsFromEvents(events, mode);
}
function playerShotPoints(games, dorsal, name, periods, mode){
  var events = [];
  games.forEach(function(g){
    var p = (g.roster||[]).filter(function(rp){ return rp.dorsal===dorsal && rp.name===name; })[0];
    if(!p) return;
    events = events.concat((g.events||[]).filter(function(e){
      if(e.side!=='team' || e.playerId!==p.id) return false;
      if(periods && periods.length && periods.indexOf(e.period)===-1) return false;
      return true;
    }));
  });
  return shotPointsFromEvents(events, mode);
}
function shotMapColorFor(pct){
  if(pct<35) return 'var(--bad)';
  if(pct<=50) return 'oklch(55% 0.03 70)';
  return 'var(--good)';

/* ---------- mapa de calor: tarjeta + dibujado en canvas ----------
   A diferencia del mapa de tiro (SVG por zonas), el mapa de calor se pinta
   en un <canvas> a partir de los puntos exactos (o aproximados, ver más
   arriba) de cada tiro: se acumulan como manchas suaves superpuestas y
   luego se recolorean con una paleta cálida según la densidad -- así salen
   manchas continuas de verdad, no gajos con bordes duros. Como el resto de
   la app pinta todo con innerHTML (el canvas no se puede "describir" en el
   HTML, hay que dibujarlo con JS después de insertarlo en el DOM), se sigue
   el mismo patrón que setupBracketZoom(): heatMapCardHtml() solo deja la
   tarjeta y registra los puntos en heatMapRegistry, y setupHeatMaps() (que
   se llama al final de render(), como setupBracketZoom()) es quien de
   verdad dibuja cada canvas ya insertado. */
function courtLinesSvg(){
  return '<path d="'+ZONE_COURT_ARCS.threeArcD+'" stroke="var(--border)" stroke-width="1.5" fill="none"/>'+
    '<path d="'+ZONE_COURT_ARCS.midArcD+'" stroke="var(--border)" stroke-width="1.5" fill="none"/>'+
    '<path d="'+ZONE_COURT_ARCS.paintArcD+'" stroke="var(--border)" stroke-width="1.5" fill="none"/>'+
    '<line x1="18" y1="420" x2="452" y2="420" stroke="var(--border)" stroke-width="1.5"/>'+
    '<rect x="223" y="396" width="24" height="5" rx="1.5" fill="var(--border)"/>'+
    '<circle cx="235" cy="408" r="6" fill="none" stroke="var(--text-dim)" stroke-width="2"/>';
}
var heatModeState = {};  // cardId -> 'attempts' | 'makes'
var heatMapRegistry = {}; // canvasId -> { points }
function getHeatMode(cardId){ return heatModeState[cardId] || 'attempts'; }
function setHeatMode(cardId, mode){ heatModeState[cardId] = mode; render(); }
// pointsFn(mode) -> [{x,y,made}, ...]. Se llama solo con el modo activo (no
// hace falta calcular ambos si no se van a ver).
function heatMapCardHtml(cardId, pointsFn){
  var mode = getHeatMode(cardId);
  var pts = pointsFn(mode) || [];
  var canvasId = 'heat-'+cardId;
  // se recorta el hueco vacío de encima del triple (ver COURT_CROP_TOP) --
  // los puntos se guardan ya trasladados a las coordenadas recortadas, que
  // son las que usa el <canvas> (también más bajo) para dibujarlos.
  heatMapRegistry[canvasId] = { points: pts.map(function(p){ return {x:p.x, y:p.y-COURT_CROP_TOP, made:p.made}; }) };
  var h = '<div class="shotmapcard">';
  h += '<div class="heatmodetoggle">'+
    '<button class="chip'+(mode==='attempts'?' on':'')+'" onclick="setHeatMode(\''+cardId+'\',\'attempts\')">Tiros realizados</button>'+
    '<button class="chip'+(mode==='makes'?' on':'')+'" onclick="setHeatMode(\''+cardId+'\',\'makes\')">Tiros metidos</button>'+
    '</div>';
  h += '<div class="heatsummary"><span class="val">'+pts.length+'</span> <span class="lbl">'+(mode==='attempts'?'tiros realizados':'tiros metidos')+'</span></div>';
  h += '<div class="courtwrap"><div class="courtbox">';
  h += '<svg viewBox="0 '+COURT_CROP_TOP+' 470 '+COURT_CROP_H+'" width="100%" style="display:block;position:absolute;inset:0">'+courtLinesSvg()+'</svg>';
  h += '<canvas class="heatcanvas" data-heatid="'+canvasId+'" width="470" height="'+COURT_CROP_H+'"></canvas>';
  h += '</div></div>';
  h += '<div class="heatlegend"><span class="heatlegendtxt">Menos</span><div class="heatlegendbar"></div><span class="heatlegendtxt">Más</span></div>';
  h += (pts.length ? '' : '<div class="caption" style="padding:0 10px;text-align:center">Sin tiros registrados con este filtro.</div>');
  h += '</div>';
  return h;
}
function heatDensityColor(t){
  var stops = [
    {t:0.00, r:20,  g:14,  b:10,  a:0.00},
    {t:0.22, r:120, g:40,  b:20,  a:0.35},
    {t:0.45, r:210, g:90,  b:35,  a:0.68},
    {t:0.70, r:240, g:150, b:55,  a:0.86},
    {t:1.00, r:255, g:225, b:150, a:0.95}
  ];
  t = Math.max(0, Math.min(1, t));
  var lo = stops[0], hi = stops[stops.length-1];
  for(var i=0;i<stops.length-1;i++){ if(t>=stops[i].t && t<=stops[i+1].t){ lo=stops[i]; hi=stops[i+1]; break; } }
  var span = (hi.t-lo.t)||1, f = (t-lo.t)/span;
  return { r: lo.r+(hi.r-lo.r)*f, g: lo.g+(hi.g-lo.g)*f, b: lo.b+(hi.b-lo.b)*f, a: lo.a+(hi.a-lo.a)*f };
}
function drawHeatMap(canvas, points){
  var W = canvas.width, H = canvas.height;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  if(!points || !points.length) return;
  var density = document.createElement('canvas');
  density.width = W; density.height = H;
  var dctx = density.getContext('2d');
  dctx.globalCompositeOperation = 'lighter';
  var dotR = 30;
  points.forEach(function(p){
    var grad = dctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, dotR);
    grad.addColorStop(0, 'rgba(255,255,255,0.55)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    dctx.fillStyle = grad;
    dctx.beginPath(); dctx.arc(p.x, p.y, dotR, 0, Math.PI*2); dctx.fill();
  });
  var img = dctx.getImageData(0,0,W,H);
  var out = ctx.createImageData(W,H);
  var maxAlpha = 0;
  for(var i=3;i<img.data.length;i+=4) maxAlpha = Math.max(maxAlpha, img.data[i]);
  maxAlpha = Math.max(maxAlpha, 40);
  for(var p2=0;p2<img.data.length;p2+=4){
    var a = img.data[p2+3];
    if(a<=2){ out.data[p2+3]=0; continue; }
    var t = Math.min(1, a/(maxAlpha*0.85));
    var c = heatDensityColor(t);
    out.data[p2]=c.r; out.data[p2+1]=c.g; out.data[p2+2]=c.b; out.data[p2+3]=Math.round(c.a*255);
  }
  ctx.putImageData(out,0,0);
}
function setupHeatMaps(){
  var canvases = document.querySelectorAll('.heatcanvas');
  canvases.forEach(function(canvas){
    var id = canvas.getAttribute('data-heatid');
    var entry = heatMapRegistry[id];
    if(entry) drawHeatMap(canvas, entry.points);
  });
}
// Se llama tras cada render(): un carrusel (swipeCarouselHtml) es un flex row
// con todas las páginas una al lado de otra para poder deslizar -- por eso,
// sin esto, todas las páginas se estirarían a la altura de la más alta
// (mucho hueco vacío en las páginas más cortas, tipo "Tendencia"). Aquí se
// mide la altura real del contenido de la página ACTIVA de cada carrusel y
// se aplica como altura fija de su viewport, así cada página ocupa solo lo
// que necesita.
function setupSwipeHeights(){
  document.querySelectorAll('.swipetrack').forEach(function(track){
    var id = track.id || '';
    if(id.indexOf('swTrack-')!==0) return;
    var cid = id.slice('swTrack-'.length);
    var n = track.children.length;
    if(!n) return;
    var page = getSwipePage(cid, n);
    var cur = track.children[page];
    var vp = track.parentElement;
    if(!cur || !vp) return;
    vp.style.height = cur.scrollHeight+'px';
  });
}

  switch(type){
    case '2m': agg.twoM++; agg.twoA++; break;

    case '3m': agg.threeM++; agg.threeA++; break;
    case '3x': agg.threeA++; break;
    case 'ftm': agg.ftM++; agg.ftA++; break;
    case 'ftx': agg.ftA++; break;
    case 'rebO': agg.rebO++; break;
    case 'rebD': agg.rebD++; break;
    case 'foulC': agg.foulC++; break;
    case 'foulR': agg.foulR++; break;
    case 'ast': agg.ast++; break;
    case 'blk': agg.blk++; break;
    case 'to': agg.to++; break;
    case 'stl': agg.stl++; break;
  }
  if(pts>0) pushEvent(g, {side:'rival', type:'rivalpts', playerId:null, points:pts});

/* ---------- box score view ---------- */

/* ---------- filtro de resultado por periodo (pantalla box score) ---------- */
var boxPeriodFilter = {}; // gameId -> array de nº de periodo seleccionados (vacío = "Todos", sin filtro)
function ensureBoxPeriodFilter(gid){
  if(!boxPeriodFilter[gid]) boxPeriodFilter[gid] = [];

}
function toggleBoxPeriod(gid, period){

  if(idx===-1) arr.push(period); else arr.splice(idx,1);

function clearBoxPeriodFilter(gid){

}
function periodFilterLabel(g, periods){
  if(!periods || !periods.length) return '';

  var teamSum=0, rivalSum=0;

    teamSum += (ps[p]?ps[p].team:0);
    rivalSum += (ps[p]?ps[p].rival:0);
    return esc(g.periodLabel)+' '+p;
  });
  return 'Filtrando: '+names.join(' + ')+' ('+teamSum+'-'+rivalSum+')';
}
function periodScoreChipsHtml(g){

/* ---------- gráfica de evolución del marcador (box score, vista Equipo) ---------- */
var boxEvoExpanded = {}; // gameId -> bool; sin entrada = abierta por defecto (Rober la ve poco alta)
function toggleEvoCard(gid){ boxEvoExpanded[gid] = !(boxEvoExpanded[gid]!==false); render(); }
var evoAxisLabel = 'Periodo'; // etiqueta del periodo activa mientras se pinta el gráfico (para el tooltip)

// puntos acumulados de un lado ("team"/"rival") SOLO para los periodos indicados
// (comprimidos y en orden, sin huecos para los periodos no seleccionados) --
// cada banda arranca en el acumulado real de entrada, así una banda sin jugadas
// se ve como tramo plano en vez de arrancar de 0.
function evoBuildSeries(g, side, bands){
  var ps = periodScores(g);
  function cumBefore(uptoPeriod){
    var t=0;
    for(var p=1;p<uptoPeriod;p++) t += (ps[p]?ps[p][side]:0);
    return t;
  }
  var pts = [];
  bands.forEach(function(p, bandIdx){
    var base = cumBefore(p);
    pts.push({band:bandIdx, frac:0, val:base});
    var scoring = g.events.filter(function(e){ return e.period===p && e.side===side && e.points>0; });
    var cum = base;
    scoring.forEach(function(e, i){
      cum += e.points;
      pts.push({band:bandIdx, frac:(i+1)/scoring.length, val:cum});
    });
  });
  return pts;
}
function evoPeriodMinuteRange(g, p){
  var mins = g.periodMinutes||8;
  return ((p-1)*mins)+'-'+(p*mins)+' min';
}
// dibuja el SVG + eje X; forPrint=true omite los puntos interactivos (tooltip)
// y añade el rango de minutos bajo cada periodo, para el PDF.
function evoChartHtml(g, bands, forPrint){
  evoAxisLabel = g.periodLabel || 'Periodo';
  if(!bands || !bands.length){ bands = []; for(var pp=1;pp<=g.periodsCount;pp++) bands.push(pp); }
  var teamPts = evoBuildSeries(g,'team',bands);
  var rivalPts = evoBuildSeries(g,'rival',bands);
  var maxVal = Math.max.apply(null, teamPts.concat(rivalPts).map(function(pt){return pt.val;}).concat([1]));
  var W = 340, H = forPrint?168:150, padL=26, padR=6, padT=10, padB=6;
  var plotW = W-padL-padR, plotH = H-padT-padB;
  var nBands = bands.length;
  function xOf(pt){ return padL + (pt.band+pt.frac)/nBands*plotW; }
  function yOf(v){ return padT + plotH - (v/maxVal)*plotH; }
  function pathFor(pts){ return pts.map(function(pt,i){ return (i===0?'M':'L')+xOf(pt).toFixed(1)+','+yOf(pt.val).toFixed(1); }).join(' '); }

  var gridLines = '';
  var steps = 4;
  for(var s=0;s<=steps;s++){
    var v = Math.round(maxVal/steps*s/2)*2;
    var y = yOf(v);
    gridLines += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>';
    gridLines += '<text x="2" y="'+(y+3).toFixed(1)+'" font-size="8.5" font-weight="700" fill="var(--text-dim)">'+v+'</text>';
  }
  var bandLines = '';
  for(var b=1;b<nBands;b++){
    var bx = padL + b/nBands*plotW;
    bandLines += '<line x1="'+bx.toFixed(1)+'" y1="'+padT+'" x2="'+bx.toFixed(1)+'" y2="'+(padT+plotH)+'" stroke="var(--border)" stroke-width="1"/>';
  }
  var dots = '';
  if(!forPrint){
    [{pts:teamPts,side:'team'},{pts:rivalPts,side:'rival'}].forEach(function(s){
      var otherPts = s.side==='team' ? rivalPts : teamPts;
      s.pts.forEach(function(pt){
        var sameBand = otherPts.filter(function(o){ return o.band===pt.band; });
        var px = xOf(pt);
        var closest = sameBand.sort(function(a,b){ return Math.abs(xOf(a)-px)-Math.abs(xOf(b)-px); })[0];
        var teamVal = s.side==='team' ? pt.val : (closest?closest.val:0);
        var rivalVal = s.side==='rival' ? pt.val : (closest?closest.val:0);
        var periodNum = bands[pt.band];
        dots += '<circle class="evopt" cx="'+px.toFixed(1)+'" cy="'+yOf(pt.val).toFixed(1)+'" r="9" fill="transparent" onclick="showEvoTip(this,'+teamVal+','+rivalVal+','+periodNum+')"/>';
      });
    });
  }
  var svg = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="display:block;overflow:visible">'+
    gridLines + bandLines +
    '<path d="'+pathFor(teamPts)+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<path d="'+pathFor(rivalPts)+'" fill="none" stroke="var(--rival)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots + '</svg>' +
    (forPrint ? '' : '<div class="evotip" id="evotip"></div>');
  var axisH = '';
  bands.forEach(function(p){
    axisH += '<span>'+esc(evoAxisLabel)+' '+p+(forPrint ? '<span class="sub">'+evoPeriodMinuteRange(g,p)+'</span>' : '')+'</span>';
  });
  var h = '<div class="evosvgwrap">'+svg+'</div>';
  h += '<div class="evoaxis" style="grid-template-columns:repeat('+nBands+',1fr)">'+axisH+'</div>';
  return h;
}
function showEvoTip(el, teamVal, rivalVal, periodNum){

/* ---------- team-level aggregates (for the "Equipo" box score view) ---------- */
function teamAggregates(g, side, eventsOverride){
  var a = {fgM:0,fgA:0,p3M:0,p3A:0,ftM:0,ftA:0,rebO:0,rebD:0,ast:0,blk:0,stl:0,to:0,foulC:0};
  (eventsOverride || g.events).forEach(function(e){
    if(e.side!==side) return;
    switch(e.type){
      case '2m': a.fgM++; a.fgA++; break;
      case '2x': a.fgA++; break;
      case '3m': a.fgM++; a.fgA++; a.p3M++; a.p3A++; break;
      case '3x': a.fgA++; a.p3A++; break;
      case 'ftm': a.ftM++; a.ftA++; break;
      case 'ftx': a.ftA++; break;
      case 'rebO': a.rebO++; break;
      case 'rebD': a.rebD++; break;
      case 'ast': a.ast++; break;
      case 'blk': a.blk++; break;
      case 'stl': a.stl++; break;
      case 'to': a.to++; break;
      case 'foulC': a.foulC++; break;
    }
    if(side==='team' && e.assistPlayerId) a.ast++;
  });
  return a;
}
function rivalAggAsTeamShape(g){
  var r = g.rivalAgg;
  return {fgM:r.twoM+r.threeM, fgA:r.twoA+r.threeA, p3M:r.threeM, p3A:r.threeA, ftM:r.ftM, ftA:r.ftA,
    rebO:r.rebO, rebD:r.rebD, ast:r.ast, blk:r.blk, stl:r.stl, to:r.to, foulC:r.foulC};
}
function pct(m,a){ return a>0 ? (m/a*100).toFixed(1) : '0.0'; }
function firstWord(s){ return (s||'').split(' ')[0]; }

function stepMinuteOverride(pid, period, delta){
  var g = getGameById(S.routeParams.gameId);
  if(!g.minutesOverride[pid]) g.minutesOverride[pid] = {};
  var cur = g.minutesOverride[pid][period];
  if(cur==null){
    var mf = minutesFor(g, pid);
    cur = mf.perPeriod[period]||0;
  }
  cur = Math.max(0, Math.min(g.periodMinutes, cur+delta));
  g.minutesOverride[pid][period] = cur;
  saveState(g); render();
}

function fillDiagnostics(){
  var el = document.getElementById('diagOutput');

  var appRect = app ? app.getBoundingClientRect() : null;

  var navCS = nav ? getComputedStyle(nav) : null;

  var safeTop = probeTop ? getComputedStyle(probeTop).paddingTop : '?';
  var safeBottom = probeBottom ? getComputedStyle(probeBottom).paddingBottom : '?';
  var vv = window.visualViewport;
  var trueBottom = vv ? vv.height : window.innerHeight;
  var gapBelowNav = navRect ? Math.round(trueBottom - navRect.bottom) : null;
  var gapVsScreen = navRect ? Math.round(window.screen.height - navRect.bottom) : null;
  var lines = [

    'documentElement client W x H: ' + document.documentElement.clientWidth + ' x ' + document.documentElement.clientHeight,
    '---',
    'safe-area-inset-top (medido): ' + safeTop,
    'safe-area-inset-bottom (medido): ' + safeBottom,
    '---',
    '#app top/bottom/height: ' + (appRect ? (Math.round(appRect.top)+' / '+Math.round(appRect.bottom)+' / '+Math.round(appRect.height)) : 'n/a'),
    '#app padding-top/bottom: ' + (appCS ? (appCS.paddingTop+' / '+appCS.paddingBottom) : 'n/a'),
    '---',
    '.bottomnav top/bottom/height: ' + (navRect ? (Math.round(navRect.top)+' / '+Math.round(navRect.bottom)+' / '+Math.round(navRect.height)) : 'n/a'),
    '.bottomnav padding: ' + (navCS ? navCS.padding : 'n/a'),

    'HUECO vs viewport reportado: ' + (gapBelowNav!=null ? gapBelowNav+' px' : 'n/a'),
    'HUECO vs pantalla física (screen.height): ' + (gapVsScreen!=null ? gapVsScreen+' px' : 'n/a')

  el.textContent = lines.join('\n');
