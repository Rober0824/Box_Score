<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BBall Stats</title>
<meta name="theme-color" content="#241a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBall Stats">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: oklch(15% 0.014 55);
    --surface: oklch(20% 0.016 55);
    --surface-2: oklch(25% 0.018 55);
    --border: oklch(32% 0.02 55);
    --text: oklch(96% 0.015 85);
    --text-dim: oklch(68% 0.03 70);
    --accent: oklch(72% 0.18 45);
    --accent-ink: oklch(18% 0.02 55);
    --good: oklch(70% 0.17 145);
    --bad: oklch(62% 0.19 25);
    --reb: oklch(76% 0.08 90);
    --foul-c: oklch(20% 0.012 55);
    --foul-r: oklch(46% 0.015 55);
    --create: oklch(80% 0.09 150);
    --loss: oklch(74% 0.01 55);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  body{ font-family:'Manrope',sans-serif; color:var(--text); position:fixed; inset:0; width:100%; }
  a{ color:var(--accent); text-decoration:none; }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0; }

  #app{ max-width:460px; margin:0 auto; width:100%; background:var(--bg); display:flex; flex-direction:column; position:fixed; inset:0; height:100vh; height:100dvh; overflow:hidden; overscroll-behavior:none; padding-top:env(safe-area-inset-top); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg); position:sticky; top:0; z-index:5; }
  .iconbtn{ width:36px; height:36px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0; }
  .iconbtn:active{ background:var(--border); }
  .scoreline{ display:flex; flex-direction:column; align-items:center; }
  .scoreline .teams{ font-size:10.5px; color:var(--text-dim); font-weight:700; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .scoreline .score{ font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; }
  .finish{ font-size:13px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }
  .finish[disabled]{ opacity:0.35; }

  .header{ padding:22px 20px 4px; flex-shrink:0; }
  .header-row{ display:flex; align-items:center; gap:12px; }
  .htitles{ display:flex; flex-direction:column; }
  .title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:19px; letter-spacing:0.02em; text-transform:uppercase; }
  .subtitle{ font-size:12px; color:var(--text-dim); font-weight:600; margin-top:2px; }

  .content{ flex:1; overflow-y:auto; padding:8px 20px 24px; display:flex; flex-direction:column; gap:24px; -webkit-overflow-scrolling:touch; }
  .section{ display:flex; flex-direction:column; }
  .label{ font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }

  .rowcard{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; gap:10px; }
  .rowcard + .rowcard{ margin-top:10px; }
  .rowcard .k{ color:var(--text-dim); font-size:13px; font-weight:600; flex-shrink:0; }
  .rowcard input[type=text]{ background:none; border:none; color:var(--text); font-weight:800; font-size:14px; text-align:right; flex:1; font-family:inherit; outline:none; }
  .rowcard input::placeholder{ color:var(--text-dim); font-weight:600; }

  .chiprow{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:700; color:var(--text-dim); }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .stepperrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:11px 14px; margin-top:10px; }
  .stepperrow .k{ font-size:13.5px; font-weight:700; }
  .stepperrow .k .auto{ display:block; font-size:10px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.03em; margin-top:2px; }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .stepbtn{ width:32px; height:32px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .stepbtn:active{ background:var(--border); }
  .stepval{ font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; min-width:34px; text-align:center; }

  .seg2{ display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px; }
  .seg2 .opt{ flex:1; text-align:center; padding:10px 6px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .seg2 .opt.on{ background:var(--accent); color:var(--accent-ink); }
  .caption{ font-size:11.5px; color:var(--text-dim); margin-top:8px; line-height:1.5; }

  .countline{ display:flex; align-items:baseline; justify-content:space-between; }
  .count{ font-size:12px; font-weight:700; color:var(--text-dim); }

  .players{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .prow{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; }
  .prow.oncourt{ border-color:var(--accent); background:oklch(72% 0.18 45 / 10%); }
  .dorsal{ width:34px; height:34px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; flex-shrink:0; }
  .prow.oncourt .dorsal{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .pname{ flex:1; min-width:0; }
  .pname .nm{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pname .tag{ font-size:10.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-top:1px; }
  .dorsal.editable{ padding:0; }
  .dorsal.editable input{ width:100%; height:100%; background:none; border:none; text-align:center; color:inherit; font:inherit; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; padding:0; -moz-appearance:textfield; }
  .dorsal.editable input::-webkit-outer-spin-button, .dorsal.editable input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .pname input.nmedit{ background:none; border:none; color:var(--text); font-weight:700; font-size:14px; width:100%; font-family:inherit; padding:0; outline:none; }
  .pcheck{ width:26px; height:26px; border-radius:999px; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pcheck.on{ background:var(--good); border-color:var(--good); color:oklch(18% 0.02 55); }
  .rmbtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
  .editbtn{ width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }

  .addrow{ display:flex; gap:8px; margin-top:10px; }
  .addrow input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:13.5px; outline:none; }
  .addrow input:focus{ border-color:var(--accent); }
  .addrow input.dorsalinput{ flex:0 0 64px; min-width:0; text-align:center; }
  .addbtn{ width:40px; flex-shrink:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; }

  .ctabar{ padding:14px 20px 22px; border-top:1px solid var(--border); flex-shrink:0; background:var(--bg); }
  .cta{ width:100%; height:52px; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-family:'Oswald',sans-serif; font-weight:700; font-size:16px; letter-spacing:0.03em; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .cta[disabled]{ opacity:0.4; }
  .cta.ghost{ background:none; border:1px solid var(--border); color:var(--text); }

  .tabsrow{ display:flex; gap:7px; padding:12px 18px; overflow-x:auto; flex-shrink:0; }
  .tab{ flex-shrink:0; padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:700; color:var(--text-dim); }
  .tab.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .feedbar{ margin:0 18px 14px; background:var(--surface-2); border-radius:10px; padding:10px 14px; flex-shrink:0; }
  .feedbar .k{ font-size:9.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  .feedbar .v{ font-size:12.5px; font-weight:700; margin-top:3px; }
  .feedbar .v b{ color:var(--accent); }

  .courtheader{ display:flex; align-items:center; justify-content:space-between; padding:0 18px 10px; flex-shrink:0; }
  .swaplink{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }

  .livecontent{ flex:1; overflow-y:auto; padding:0 18px 18px; -webkit-overflow-scrolling:touch; }
  .grid3{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; }
  .ptile{ aspect-ratio:1/1; background:var(--surface); border:1px solid var(--border); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .ptile:active{ background:var(--surface-2); }
  .ptile .num{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; }
  .ptile .nm{ font-size:11px; color:var(--text-dim); font-weight:700; text-align:center; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .ptile.rival{ background:var(--surface-2); border-style:dashed; }
  .ptile.rival .nm{ font-size:12.5px; color:var(--text); font-weight:800; text-transform:uppercase; letter-spacing:0.02em; }

  .undobar{ padding:10px 18px 18px; text-align:center; flex-shrink:0; }
  .undo{ display:inline-flex; align-items:center; gap:8px; color:var(--text-dim); font-size:12.5px; font-weight:700; }
  .undo[disabled]{ opacity:0.3; }

  .pheader{ display:flex; align-items:center; gap:12px; margin:6px 18px 16px; background:var(--surface); border:1px solid var(--accent); border-radius:14px; padding:12px 14px; flex-shrink:0; }
  .pheader .av{ width:44px; height:44px; border-radius:999px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; flex-shrink:0; }
  .pheader .nm{ font-weight:800; font-size:15px; }
  .pheader .sub{ font-size:11.5px; color:var(--text-dim); font-weight:600; margin-top:2px; }

  .shotrow{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:9px 13px; }
  .shotrow + .shotrow{ margin-top:8px; }
  .shotrow .k{ font-weight:700; font-size:13.5px; }
  .shotbtns{ display:flex; gap:8px; }
  .sbtn{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .sbtn.good{ background:oklch(70% 0.17 145 / 18%); border:1.5px solid var(--good); color:var(--good); }
  .sbtn.bad{ background:oklch(62% 0.19 25 / 16%); border:1.5px solid var(--bad); color:var(--bad); }
  .sbtn:active{ transform:scale(0.94); }

  .statgrid4{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:7px; }
  .glabel{ grid-column: span 2; font-size:9.5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); padding-bottom:1px; }
  .gtile{ border-radius:12px; min-height:56px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:800; font-size:11px; line-height:1.2; padding:4px; }
  .gtile:active{ transform:scale(0.96); }
  .gtile.reb{ background:var(--reb); color:var(--accent-ink); }
  .gtile.foulc{ background:var(--foul-c); color:var(--text); border:1px solid var(--border); }
  .gtile.foulr{ background:var(--foul-r); color:var(--text); }
  .gtile.create{ background:var(--create); color:var(--accent-ink); }
  .gtile.loss{ background:var(--loss); color:var(--accent-ink); }

  .closebar{ padding:14px 18px 20px; text-align:center; flex-shrink:0; }
  .close{ font-size:13.5px; font-weight:800; color:var(--accent); text-transform:uppercase; letter-spacing:0.02em; }

  .veil{ position:fixed; inset:0; max-width:460px; margin:0 auto; background:oklch(10% 0.01 55 / 78%); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .modal{ width:100%; background:var(--surface); border-top:1px solid var(--border); border-radius:22px 22px 0 0; padding:24px 22px 28px; display:flex; flex-direction:column; gap:16px; max-height:80vh; overflow-y:auto; }
  .mhead{ text-align:center; }
  .mtitle{ font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:0.03em; }
  .msub{ font-size:13px; color:var(--text-dim); font-weight:600; margin-top:6px; }
  .msub b{ color:var(--text); }
  .assistgrid{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
  .achip{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1.5px solid var(--border); border-radius:12px; padding:12px; text-align:left; }
  .achip:active{ border-color:var(--accent); }
  .achip .av{ width:32px; height:32px; border-radius:999px; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; flex-shrink:0; }
  .achip .nm{ font-weight:700; font-size:13.5px; }
  .fullbtn{ width:100%; text-align:center; padding:14px; border-radius:12px; border:1px solid var(--border); color:var(--text-dim); font-weight:700; font-size:14px; }
  .fullbtn:active{ border-color:var(--accent); color:var(--text); }
  .cancel{ text-align:center; font-size:12.5px; color:var(--text-dim); text-decoration:underline; font-weight:600; }

  .zshead{ display:flex; align-items:center; justify-content:space-between; }
  .zsplayer{ display:flex; align-items:center; gap:10px; }
  .zsname{ font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; }
  .zsbadge{ margin-left:auto; display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:0.03em; text-transform:uppercase; color:var(--accent-ink); flex-shrink:0; }
  .courtwrap{ display:flex; justify-content:center; padding:6px 0 2px; }
  .courtbox{ position:relative; width:100%; max-width:320px; }
  .zonepath{ cursor:pointer; transition:opacity .15s; }
  .zonelabel{ position:absolute; transform:translate(-50%,-50%); font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; color:var(--text); text-shadow:0 1px 3px oklch(10% 0.01 55 / 80%); pointer-events:none; text-align:center; white-space:nowrap; }
  .zoneprompt{ text-align:center; font-size:13px; font-weight:700; color:var(--text-dim); min-height:18px; }

  .finalpill{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); background:oklch(72% 0.18 45 / 14%); border:1px solid var(--accent); border-radius:999px; padding:4px 10px; margin-bottom:10px; }
  .finalscore{ display:flex; align-items:center; justify-content:space-between; }
  .fteam{ display:flex; flex-direction:column; gap:2px; max-width:180px; }
  .fteam.right{ align-items:flex-end; text-align:right; }
  .fname{ font-size:11px; font-weight:700; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fscore{ font-family:'Oswald',sans-serif; font-size:38px; font-weight:700; }
  .fdash{ font-family:'Oswald',sans-serif; font-size:22px; color:var(--text-dim); }

  .sortrow{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 0; flex-shrink:0; }
  .sortlabel{ font-size:10.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }

  .boxcontent{ flex:1; overflow-y:auto; padding:12px 20px 20px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .prow2{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .ptop{ display:flex; align-items:center; gap:10px; }
  .pnm2{ font-weight:800; font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pmin{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); font-weight:700; flex-shrink:0; }
  .pmin button{ display:flex; }
  .ppts{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--accent); min-width:26px; text-align:right; flex-shrink:0; }
  .pline{ font-size:11.5px; color:var(--text-dim); font-weight:600; padding-left:38px; }
  .pextra{ display:flex; gap:6px; padding-left:38px; }
  .pill{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-dim); }
  .pill.pm.pos{ color:var(--good); }
  .pill.pm.neg{ color:var(--bad); }

  .totalsrow{ background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .totalsrow .tk{ font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:0.03em; }
  .totalsrow .tv{ font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; }

  .teamstat-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:6px 18px 10px; }
  .tsheadrow{ display:flex; align-items:center; padding:14px 0 12px; border-bottom:1px solid var(--border); margin-bottom:4px; }
  .tsteam{ width:34%; font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.02em; }
  .tsteam.right{ text-align:right; }
  .tscaption{ flex:1; text-align:center; font-size:9.5px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }
  .teamstatrow{ display:flex; align-items:center; padding:9px 0; }
  .tsval{ width:34%; font-family:'Oswald',sans-serif; font-size:16px; font-weight:700; }
  .tsval.right{ text-align:right; }
  .tslabel{ flex:1; text-align:center; font-size:11.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .teamstatrow.pct{ padding-top:0; padding-bottom:6px; }
  .teamstatrow.pct .tsval{ font-size:12.5px; font-weight:600; color:var(--text-dim); }
  .teamstatrow.pct .tslabel{ font-size:10.5px; font-weight:600; text-transform:none; letter-spacing:0; }
  .teamstat-divider{ height:1px; background:var(--border); margin:6px 0 8px; }

  .tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  .stattable{ border-collapse:separate; border-spacing:0; font-family:'Manrope',sans-serif; white-space:nowrap; }
  .stattable thead th{ position:sticky; top:0; background:var(--surface-2); color:var(--text-dim); font-size:9.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; padding:9px 10px; text-align:center; border-bottom:1px solid var(--border); z-index:1; }
  .stattable tbody td{ padding:9px 10px; text-align:center; font-size:12px; font-weight:600; color:var(--text); border-bottom:1px solid var(--border); }
  .stattable tbody tr:last-child td{ border-bottom:none; }
  .stickycol{ position:sticky; left:0; z-index:2; background:var(--surface); text-align:left !important; }
  .stattable thead th.stickycol{ z-index:3; text-align:left !important; }
  .tcell-player{ display:flex; align-items:center; gap:8px; min-width:120px; }
  .tcell-player .dorsal{ display:flex; align-items:center; justify-content:center; border-radius:999px; background:var(--surface-2); color:var(--text); font-weight:800; flex-shrink:0; }

<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
'use strict';

/* ---------- iOS standalone viewport-height fix ---------- */
/* On his device, in the installed (standalone) app, window.innerHeight / 100vh / 100dvh
   all report a viewport ~50pt shorter than the true physical screen (confirmed via his
   on-device diagnostics: screen.height=812 vs innerHeight=762). #app relying on any of
   those leaves a real gap, filled with #app's own background, below the bottom nav.
   window.screen.height matches the true screen correctly, so when standalone mode shows
   a mismatch we set #app's height directly from it, bypassing the viewport units entirely. */
function fixStandaloneHeight(){
  var appEl = document.getElementById('app');
  if(!appEl) return;
  var isStandalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var realH = window.screen.height;
  var isPortrait = window.screen.height >= window.screen.width;
  if(isStandalone && isPortrait && realH && realH > window.innerHeight){
    appEl.style.height = realH + 'px';
  } else {
    appEl.style.height = '';
  }
}
fixStandaloneHeight();
window.addEventListener('resize', fixStandaloneHeight);
window.addEventListener('orientationchange', function(){ setTimeout(fixStandaloneHeight, 60); });

/* ---------- storage ---------- */
var STORE_KEY = 'boxscore_v1_state';

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { games: [], current: null, route: 'boot', routeParams: {} };
}
function saveState(game){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  scheduleCloudSave(game || S.current);
}

var S = loadState();
/* Cada vez que se abre la app (icono, refresco) debe arrancar en Inicio,
   salvo que haya un partido en curso sin terminar, que sí se retoma. */
if(S.current && !S.current.finished){ S.route = 'live'; }
else { S.route = 'home'; S.routeParams = {}; }

/* ---------- Supabase (cloud backend) ---------- */
var SUPABASE_URL = 'https://amgmlsdbllknvwuixozc.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtZ21sc2RibGxrbnZ3dWl4b3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjI0MzMsImV4cCI6MjEwNDczODQzM30._ddwOdRLoQR4xSoskQ26znaZjDSJo0677BdbbAOFdI4';
var SUPABASE_CONFIGURED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
var sb = null;
if(SUPABASE_CONFIGURED && window.supabase && window.supabase.createClient){
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ sb = null; }
}

var authUser = null;
var authProfile = null;
var authChecked = false;
var authBusy = false;
var authError = '';
var pendingProfiles = [];
var clubSettings = { team_name:'', category:'', logo_url:'', photo_url:'' };
var standings = [];
var teamRoster = [];
var cloudSaveTimer = null;
var assetUploadBusy = false;

function uuidv4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

async function bootAuth(){
  if(!sb){ authChecked = true; if(S.route==='boot') S.route = S.current ? 'live' : 'setup'; render(); return; }
  try{
    var res = await sb.auth.getSession();
    var session = res && res.data && res.data.session;
    if(session && session.user){
      authUser = session.user;
      await loadProfile();
    }
  }catch(e){}
  authChecked = true;
  decideRouteAfterAuth();
  render();
  try{
    sb.auth.onAuthStateChange(function(_evt, session){
      var wasUser = authUser;
      authUser = (session && session.user) ? session.user : null;
      if(authUser && (!wasUser || wasUser.id!==authUser.id)){
        loadProfile().then(function(){ decideRouteAfterAuth(); render(); });
      } else if(!authUser){
        authProfile = null; S.route = 'login'; render();
      }
    });
  }catch(e){}
}
async function loadProfile(){
  if(!sb || !authUser) return;
  try{
    var res = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
    authProfile = (res && res.data) || null;
  }catch(e){ authProfile = null; }
  // si el usuario ya tiene sesión pero todavía no existe su fila en "profiles"
  // (primer login tras confirmar el correo, o el alta se hizo con sesión inmediata),
  // la creamos ahora que sabemos que auth.uid() coincide con su id (RLS lo permite).
  if(!authProfile){
    var fallbackName = (authUser.user_metadata && authUser.user_metadata.name) || (authUser.email||'').split('@')[0];
    try{
      var ins = await sb.from('profiles').insert({ id:authUser.id, name:fallbackName, email:authUser.email, status:'pending', role:'member' });
      if(!ins || !ins.error){
        authProfile = { id:authUser.id, name:fallbackName, email:authUser.email, status:'pending', role:'member' };
      }
    }catch(e){ /* no se pudo crear el perfil; se reintentará en el siguiente acceso */ }
  }
}
function decideRouteAfterAuth(){
  if(!SUPABASE_CONFIGURED) return;
  if(!authUser){ S.route = 'login'; return; }
  if(!authProfile || authProfile.status==='pending'){ S.route = 'pending'; return; }
  if(authProfile.status==='rejected'){ S.route = 'rejected'; return; }
  if(['login','register','pending','rejected','confirm','boot'].indexOf(S.route)!==-1 || !S.route){
    S.route = 'home';
  }
  syncFromCloud();
  if(authProfile.role==='admin') loadPendingProfiles();
}

async function doRegister(){
  if(!sb) return;
  var name = document.getElementById('regName').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  if(!name || !email || !pass){ authError='Rellena todos los campos.'; render(); return; }
  if(pass.length<6){ authError='La contraseña debe tener al menos 6 caracteres.'; render(); return; }
  if(pass!==pass2){ authError='Las contraseñas no coinciden.'; render(); return; }
  authBusy = true; authError=''; render();
  try{
    var res = await sb.auth.signUp({ email: email, password: pass, options: { data: { name: name } } });
    if(res.error) throw res.error;
    var user = res.data.user;
    var session = res.data.session;
    if(user && session){
      // el proyecto no exige confirmar el correo: ya hay sesión activa, creamos el perfil ya mismo
      authUser = user;
      await loadProfile();
      S.route = 'pending';
    } else if(user){
      // el proyecto exige confirmar el correo antes de tener sesión;
      // el perfil se creará automáticamente en el primer inicio de sesión tras confirmarlo
      authUser = null; authProfile = null;
      S.route = 'confirm';
    }
  }catch(e){
    authError = (e && e.message) || 'No se ha podido crear la cuenta.';
  }
  authBusy = false; render();
}
async function doLogin(){
  if(!sb) return;
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  if(!email || !pass){ authError='Introduce tu correo y contraseña.'; render(); return; }
  authBusy = true; authError=''; render();
  try{
    var res = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(res.error) throw res.error;
    authUser = res.data.user;
    await loadProfile();
    decideRouteAfterAuth();
  }catch(e){
    authError = 'Correo o contraseña incorrectos.';
  }
  authBusy = false; render();
}
async function doLogout(){
  if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
  authUser = null; authProfile = null; menuOpen=false; S.route = 'login'; render();
}

async function loadPendingProfiles(){
  if(!sb) return;

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,10); }
function byId(arr, id){ return arr.filter(function(x){return x.id===id;})[0]; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function defaultRoster(){
  return [
    {id:uid(), dorsal:4, name:'Noa Guerrero'},
    {id:uid(), dorsal:5, name:'Lucía Bravo'},
    {id:uid(), dorsal:6, name:'Vera Molina'},
    {id:uid(), dorsal:7, name:'Martina Ríos'},
    {id:uid(), dorsal:9, name:'Elena Castro'},
    {id:uid(), dorsal:11, name:'Sara Del Val'},
    {id:uid(), dorsal:13, name:'Paula Nieto'},
    {id:uid(), dorsal:15, name:'Carla Iglesias'}
  ];
}

function newGame(){
  var baseRoster = null;
  if(teamRoster && teamRoster.length){
    baseRoster = teamRoster;
  } else if(S.games && S.games.length && S.games[0] && S.games[0].roster && S.games[0].roster.length){
    baseRoster = S.games[0].roster;
  }
  var roster = baseRoster ? baseRoster.map(function(p){ return {id:uid(), dorsal:p.dorsal, name:p.name}; }) : defaultRoster();
  return {
    id: uuidv4(),
    createdAt: Date.now(),
    teamName: clubSettings.team_name || 'Distrito Olímpico Arranz',
    rivalName: '',
    kind: 'liga',
    jornada: null,
    periodsCount: 6,
    periodLabel: 'Sexto',
    periodMinutes: 8,
    trackRivalFull: false,
    roster: roster,
    onCourt: [],
    currentPeriod: 1,
    started: false,
    finished: false,
    events: [],
    periodAppearances: {}, // playerId -> Set(periods) as array
    minutesOverride: {},   // playerId -> {period: minutes}
    rivalAgg: {twoM:0,twoA:0,threeM:0,threeA:0,ftM:0,ftA:0,rebO:0,rebD:0,foulC:0,foulR:0,ast:0,blk:0,to:0,stl:0}
  };
}

function sortedRoster(g){
  return g.roster.slice().sort(function(a,b){ return a.dorsal-b.dorsal; });
}

/* ---------- derived stats (events are the single source of truth) ---------- */
function teamScore(g){
  var s=0;
  g.events.forEach(function(e){ if(e.side==='team') s+=e.points; });
  return s;
}
function rivalScore(g){
  var s=0;
  g.events.forEach(function(e){ if(e.side==='rival') s+=e.points; });
  return s;
}
function periodScores(g){
  var out = {};
  for(var p=1;p<=g.periodsCount;p++) out[p]={team:0,rival:0};
  g.events.forEach(function(e){
    if(!out[e.period]) out[e.period]={team:0,rival:0};
    out[e.period][e.side] += e.points;
  });
  return out;
}
function playerStats(g, playerId){
  var st = {pts:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,rebO:0,rebD:0,ast:0,stl:0,blk:0,to:0,foulC:0,foulR:0,plusMinus:0};
  g.events.forEach(function(e){
    if(e.side==='team' && e.playerId===playerId){
      switch(e.type){
        case '2m': st.fg2m++; st.fg2a++; st.pts+=2; break;
        case '2x': st.fg2a++; break;
        case '3m': st.fg3m++; st.fg3a++; st.pts+=3; break;
        case '3x': st.fg3a++; break;
        case 'ftm': st.ftm++; st.fta++; st.pts+=1; break;
        case 'ftx': st.fta++; break;
        case 'rebO': st.rebO++; break;
        case 'rebD': st.rebD++; break;
        case 'ast': st.ast++; break;
        case 'stl': st.stl++; break;
        case 'blk': st.blk++; break;
        case 'to': st.to++; break;
        case 'foulC': st.foulC++; break;
        case 'foulR': st.foulR++; break;
      }
    }
    // assist credited separately from the assisting player id on scoring events
    if(e.side==='team' && e.assistPlayerId===playerId){ st.ast++; }
  });
  // plus/minus: for every scoring event (team or rival) while this player was on court
  g.events.forEach(function(e){
    if((e.type==='2m'||e.type==='3m'||e.type==='ftm'||e.type==='rivalpts') && e.onCourtSnapshot && e.onCourtSnapshot.indexOf(playerId)!==-1){
      if(e.side==='team') st.plusMinus += e.points;
      else st.plusMinus -= e.points;
    }
  });
  return st;
}
function eff(st){
  var made = st.fg2m+st.fg3m+st.ftm;
  var attempted = st.fg2a+st.fg3a+st.fta;
  var missed = attempted-made;
  return (st.pts+st.rebO+st.rebD+st.ast+st.stl+st.blk) - (missed+st.to);
}
function minutesFor(g, playerId){
  var ov = g.minutesOverride[playerId];
  var total=0, perPeriod={};
  for(var p=1;p<=g.periodsCount;p++){
    if(ov && ov[p]!=null){ perPeriod[p]=ov[p]; }
    else if(g.periodAppearances[playerId] && g.periodAppearances[playerId].indexOf(p)!==-1){ perPeriod[p]=g.periodMinutes; }
    else { perPeriod[p]=0; }
    total += perPeriod[p];
  }
  return {total:total, perPeriod:perPeriod};
}
function recordAppearance(g){
  var p = g.currentPeriod;
  g.onCourt.forEach(function(pid){
    if(!g.periodAppearances[pid]) g.periodAppearances[pid]=[];
    if(g.periodAppearances[pid].indexOf(p)===-1) g.periodAppearances[pid].push(p);
  });
}

/* ---------- events ---------- */
function pushEvent(g, ev){
  ev.id = uid();
  ev.ts = Date.now();
  ev.period = g.currentPeriod;
  ev.onCourtSnapshot = g.onCourt.slice();
  g.events.push(ev);

}
function lastActionLabel(g){

  var names = {'2m':'Tiro de 2 anotado (+2)','2x':'Tiro de 2 fallado','3m':'Tiro de 3 anotado (+3)','3x':'Tiro de 3 fallado',
    'ftm':'Tiro libre anotado (+1)','ftx':'Tiro libre fallado','rebO':'Rebote ofensivo','rebD':'Rebote defensivo',
    'ast':'Asistencia','stl':'Robo','blk':'Tapón','to':'Pérdida','foulC':'Falta cometida','foulR':'Falta recibida',
    'rivalpts':'Puntos del rival (+'+e.points+')'};
  if(e.side==='rival') return '<b>Rival</b> — ' + (names[e.type]||e.type);
  var p = byId(S.current.roster, e.playerId);
  var label = 'Nº'+(p?p.dorsal:'?')+' <b>'+(p?firstName(p.name):'?')+'</b> — '+(names[e.type]||e.type);
  return label;
}

function recordTeamStat(type){
  var g = S.current;
  var pid = S.routeParams.playerId;
  var pts = type==='2m'?2:(type==='3m'?3:(type==='ftm'?1:0));
  if(type==='2m' || type==='2x' || type==='3m' || type==='3x'){
    go('shotzone', {playerId: pid, type: type, points: pts});

  var g = S.current;
  var pts = type==='2m'?2:(type==='3m'?3:(type==='ftm'?1:0));
  var agg = g.rivalAgg;
  switch(type){
    case '2m': agg.twoM++; agg.twoA++; break;
    case '2x': agg.twoA++; break;
    case '3m': agg.threeM++; agg.threeA++; break;
    case '3x': agg.threeA++; break;
    case 'ftm': agg.ftM++; agg.ftA++; break;
    case 'ftx': agg.ftA++; break;
    case 'rebO': agg.rebO++; break;
    case 'rebD': agg.rebD++; break;
    case 'foulC': agg.foulC++; break;
    case 'foulR': agg.foulR++; break;
    case 'ast': agg.ast++; break;
    case 'blk': agg.blk++; break;
    case 'to': agg.to++; break;
    case 'stl': agg.stl++; break;
  }
  if(pts>0) pushEvent(g, {side:'rival', type:'rivalpts', playerId:null, points:pts});

/* ---------- team-level aggregates (for the "Equipo" box score view) ---------- */
function teamAggregates(g, side){
  var a = {fgM:0,fgA:0,p3M:0,p3A:0,ftM:0,ftA:0,rebO:0,rebD:0,ast:0,blk:0,stl:0,to:0,foulC:0};
  g.events.forEach(function(e){
    if(e.side!==side) return;
    switch(e.type){
      case '2m': a.fgM++; a.fgA++; break;
      case '2x': a.fgA++; break;
      case '3m': a.fgM++; a.fgA++; a.p3M++; a.p3A++; break;
      case '3x': a.fgA++; a.p3A++; break;
      case 'ftm': a.ftM++; a.ftA++; break;
      case 'ftx': a.ftA++; break;
      case 'rebO': a.rebO++; break;
      case 'rebD': a.rebD++; break;
      case 'ast': a.ast++; break;
      case 'blk': a.blk++; break;
      case 'stl': a.stl++; break;
      case 'to': a.to++; break;
      case 'foulC': a.foulC++; break;
    }
    if(side==='team' && e.assistPlayerId) a.ast++;
  });
  return a;
}
function rivalAggAsTeamShape(g){
  var r = g.rivalAgg;
  return {fgM:r.twoM+r.threeM, fgA:r.twoA+r.threeA, p3M:r.threeM, p3A:r.threeA, ftM:r.ftM, ftA:r.ftA,
    rebO:r.rebO, rebD:r.rebD, ast:r.ast, blk:r.blk, stl:r.stl, to:r.to, foulC:r.foulC};

function stepMinuteOverride(pid, period, delta){
  var g = getGameById(S.routeParams.gameId);
  if(!g.minutesOverride[pid]) g.minutesOverride[pid] = {};
  var cur = g.minutesOverride[pid][period];
  if(cur==null){
    var mf = minutesFor(g, pid);
    cur = mf.perPeriod[period]||0;
  }
  cur = Math.max(0, Math.min(g.periodMinutes, cur+delta));
  g.minutesOverride[pid][period] = cur;
  saveState(g); render();
}

  ];
  el.textContent = lines.join('\n');

/* ---- box score ---- */
function renderBox(){
  var gid = S.routeParams.gameId || (S.current && S.current.id);
  var g = getGameById(gid);
  if(!g) return renderGames();
  var roster = g.roster.slice();
  var rows = roster.map(function(p){
    var st = playerStats(g,p.id);
    var mf = minutesFor(g,p.id);
    return {p:p, st:st, eff:eff(st), min:mf.total};
  });
  rows.sort(function(a,b){return a.p.dorsal-b.p.dorsal;});

  var teamTotal = teamScore(g);
  var backDest = S.routeParams.fromGames ? "go('games')" : (S.current && !S.current.finished ? "go('live')" : "go('games')");
  var h = '';
  h += '<div class="header"><div class="header-row">'+
        '<button class="iconbtn" onclick="'+backDest+'">'+icon('back',18)+'</button>'+
        '<div class="htitles"><div class="title">Box score</div></div>'+
       '</div>';
  h += '<div style="padding-top:14px">'+
       '<div class="finalpill">'+(g.finished?'Final':'En curso')+' · '+g.periodsCount+' '+esc(g.periodLabel.toLowerCase())+(g.periodsCount!==1?'s':'')+'</div>'+
       '<div class="finalscore"><div class="fteam"><div class="fname">'+esc(g.teamName.toUpperCase())+'</div><div class="fscore">'+teamTotal+'</div></div>'+
       '<div class="fdash">–</div>'+
       '<div class="fteam right"><div class="fname">'+esc((g.rivalName||'RIVAL').toUpperCase())+'</div><div class="fscore">'+rivalScore(g)+'</div></div></div>'+
       '</div></div>';

  h += '<div class="sortrow"><div class="sortlabel">Vista</div><div class="seg2" style="width:auto">'+
       '<button class="opt'+(boxViewMode==='team'?' on':'')+'" onclick="setBoxView(\'team\')">Equipo</button>'+
       '<button class="opt'+(boxViewMode==='players'?' on':'')+'" onclick="setBoxView(\'players\')">Jugadores</button>'+
       '</div></div>';

  if(boxViewMode==='team'){
    h += '<div class="boxcontent">'+renderTeamPanel(g)+'</div>';
    h += '<div class="actions"><button class="abtn" onclick="exportBoxScorePDF(\''+g.id+'\')">Exportar PDF</button><button class="abtn" onclick="shareBoxScore(\''+g.id+'\')">Compartir</button></div>';
    return h;
  }

  h += '<div class="boxcontent">'+renderPlayersTable(g, rows, teamTotal)+'</div>';

  return h;
}

/* ---- players table (Jugadores view of the box score) ---- */
function renderPlayersTable(g, rows, teamTotal){
  rows = rows.slice().sort(function(a,b){ return a.p.dorsal-b.p.dorsal; });
  var cols = ['MIN','FG','2PT','3PT','FT','O-REB','D-REB','REB','AST','ROB','TAP','PÉR','FAL','EFF','+/-','PTS'];
  var h = '<div class="tablewrap"><table class="stattable"><thead><tr><th class="stickycol">Jugadora</th>';
  cols.forEach(function(c){ h += '<th>'+c+'</th>'; });
  h += '</tr></thead><tbody>';

  function fg(m,a){ return m+'-'+a; }

  rows.forEach(function(r){
    var st = r.st;
    var pm = st.plusMinus;
    h += '<tr>';
    h += '<td class="stickycol"><div class="tcell-player"><span class="dorsal" style="width:22px;height:22px;font-size:11px">'+r.p.dorsal+'</span><span>'+esc(r.p.name)+'</span></div></td>';
    h += '<td class="numcell">'+r.min+'\' <button class="minbtn" onclick="openMinutes(\''+r.p.id+'\')">'+icon('pencil',10)+'</button></td>';
    h += '<td class="numcell">'+fg(st.fg2m+st.fg3m, st.fg2a+st.fg3a)+'</td>';
    h += '<td class="numcell">'+fg(st.fg2m,st.fg2a)+'</td>';
    h += '<td class="numcell">'+fg(st.fg3m,st.fg3a)+'</td>';
    h += '<td class="numcell">'+fg(st.ftm,st.fta)+'</td>';
    h += '<td class="numcell">'+st.rebO+'</td>';
    h += '<td class="numcell">'+st.rebD+'</td>';
    h += '<td class="numcell">'+(st.rebO+st.rebD)+'</td>';
    h += '<td class="numcell">'+st.ast+'</td>';
    h += '<td class="numcell">'+st.stl+'</td>';
    h += '<td class="numcell">'+st.blk+'</td>';
    h += '<td class="numcell">'+st.to+'</td>';
    h += '<td class="numcell">'+st.foulC+'</td>';
    h += '<td class="numcell">'+r.eff+'</td>';
    h += '<td class="numcell pmcell '+(pm>=0?'pos':'neg')+'">'+(pm>=0?'+':'−')+Math.abs(pm)+'</td>';
    h += '<td class="ptscell">'+st.pts+'</td>';
    h += '</tr>';
  });

  // team totals row
  var tot = {min:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,rebO:0,rebD:0,ast:0,stl:0,blk:0,to:0,foulC:0,eff:0,pts:0};
  rows.forEach(function(r){
    tot.min+=r.min; tot.fg2m+=r.st.fg2m; tot.fg2a+=r.st.fg2a; tot.fg3m+=r.st.fg3m; tot.fg3a+=r.st.fg3a;
    tot.ftm+=r.st.ftm; tot.fta+=r.st.fta; tot.rebO+=r.st.rebO; tot.rebD+=r.st.rebD; tot.ast+=r.st.ast;
    tot.stl+=r.st.stl; tot.blk+=r.st.blk; tot.to+=r.st.to; tot.foulC+=r.st.foulC; tot.eff+=r.eff; tot.pts+=r.st.pts;
  });
  h += '<tr class="totalrow">'+
    '<td class="stickycol">Total</td>'+
    '<td>'+tot.min+'\'</td>'+
    '<td>'+fg(tot.fg2m+tot.fg3m, tot.fg2a+tot.fg3a)+'</td>'+
    '<td>'+fg(tot.fg2m,tot.fg2a)+'</td>'+
    '<td>'+fg(tot.fg3m,tot.fg3a)+'</td>'+
    '<td>'+fg(tot.ftm,tot.fta)+'</td>'+
    '<td>'+tot.rebO+'</td><td>'+tot.rebD+'</td><td>'+(tot.rebO+tot.rebD)+'</td>'+
    '<td>'+tot.ast+'</td><td>'+tot.stl+'</td><td>'+tot.blk+'</td><td>'+tot.to+'</td><td>'+tot.foulC+'</td>'+
    '<td>'+tot.eff+'</td><td>—</td><td>'+teamTotal+'</td>'+
    '</tr>';

  // rival row (only meaningful stats when tracked fully; otherwise just points)
  if(g.trackRivalFull){
    var a = g.rivalAgg;
    h += '<tr class="rivalrow">'+
      '<td class="stickycol">'+esc(g.rivalName||'Rival')+'</td>'+
      '<td>—</td>'+
      '<td>'+fg(a.twoM+a.threeM, a.twoA+a.threeA)+'</td>'+
      '<td>'+fg(a.twoM,a.twoA)+'</td>'+
      '<td>'+fg(a.threeM,a.threeA)+'</td>'+
      '<td>'+fg(a.ftM,a.ftA)+'</td>'+
      '<td>'+a.rebO+'</td><td>'+a.rebD+'</td><td>'+(a.rebO+a.rebD)+'</td>'+
      '<td>'+a.ast+'</td><td>'+a.stl+'</td><td>'+a.blk+'</td><td>'+a.to+'</td><td>'+a.foulC+'</td>'+
      '<td>—</td><td>—</td><td>'+rivalScore(g)+'</td>'+
      '</tr>';
  } else {
    h += '<tr class="rivalrow"><td class="stickycol">'+esc(g.rivalName||'Rival')+'</td>'+
      '<td colspan="15" style="text-align:left;color:var(--text-dim);font-weight:600">Solo marcador registrado</td>'+
      '<td>'+rivalScore(g)+'</td></tr>';
  }

  h += '</tbody></table></div>';
  return h;
}

/* ---- export / share (Exportar PDF & Compartir buttons) ---- */
function buildPrintHtml(g){
  var roster = g.roster.slice();
  var rows = roster.map(function(p){
    var st = playerStats(g,p.id);
    var mf = minutesFor(g,p.id);
    return {p:p, st:st, eff:eff(st), min:mf.total};
  });
  rows.sort(function(a,b){return a.p.dorsal-b.p.dorsal;});
  var teamTotal = teamScore(g);
  var d = new Date(g.finishedAt||g.createdAt);
  var h = '';

function shareBoxScore(gid){
  var g = getGameById(gid);
  if(!g) return;
  var rows = g.roster.map(function(p){
    var st = playerStats(g,p.id);
    return {p:p, st:st, eff:eff(st)};
  });
  var topScorer = rows.slice().sort(function(a,b){return b.st.pts-a.st.pts;})[0];
  var topEff = rows.slice().sort(function(a,b){return b.eff-a.eff;})[0];
  var lines = [];
  lines.push(g.teamName+' '+teamScore(g)+' – '+rivalScore(g)+' '+(g.rivalName||'Rival'));
  lines.push(g.periodsCount+' '+g.periodLabel.toLowerCase()+(g.periodsCount!==1?'s':'')+(g.finished?' · Final':' · En curso'));
  if(topScorer && topScorer.st.pts>0) lines.push('Máxima anotadora: '+topScorer.p.name+' ('+topScorer.st.pts+' pts)');
  if(topEff && topEff.eff>0) lines.push('Mejor eficiencia: '+topEff.p.name+' ('+topEff.eff+' EFF)');
  var text = lines.join('\n');
  if(navigator.share){
    navigator.share({title:'Box score', text:text}).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast('Resumen copiado. Pégalo donde quieras compartirlo.');
    }).catch(function(){
      showToast('No se ha podido copiar el resumen.');
    });
  } else {
    showToast('Compartir no está disponible en este navegador.');
  }
}

/* ---------- Inicio ---------- */
var RANK_STATS = [
  {key:'pts', label:'Puntos'},
  {key:'reb', label:'Rebotes'},
  {key:'ast', label:'Asistencias'},
  {key:'stl', label:'Robos'},
  {key:'fg2pct', label:'% de 2'},
  {key:'fg3pct', label:'% de 3'},
  {key:'ftpct', label:'% de TL'},
  {key:'eff', label:'Eficiencia'}
];
function allFinishedGames(){ return S.games; }
function aggregatePlayers(games){
  var byKey = {};
  games.forEach(function(g){
    (g.roster||[]).forEach(function(p){
      var st = playerStats(g, p.id);
      var key = p.dorsal+'|'+p.name;
      if(!byKey[key]) byKey[key] = { dorsal:p.dorsal, name:p.name, pts:0, reb:0, rebO:0, rebD:0, ast:0, stl:0, blk:0, to:0, foulC:0, fg2m:0, fg2a:0, fg3m:0, fg3a:0, ftm:0, fta:0, plusMinus:0, gp:0 };
      var a = byKey[key];
      a.pts += st.pts; a.reb += (st.rebO+st.rebD); a.rebO += st.rebO; a.rebD += st.rebD; a.ast += st.ast; a.stl += st.stl; a.blk += st.blk; a.to += st.to; a.foulC += st.foulC;
      a.fg2m += st.fg2m; a.fg2a += st.fg2a; a.fg3m += st.fg3m; a.fg3a += st.fg3a; a.ftm += st.ftm; a.fta += st.fta;
      a.plusMinus += st.plusMinus;
      if(st.fg2a||st.fg3a||st.fta||st.pts||st.rebO||st.rebD||st.ast||st.stl||st.blk||st.to||st.foulC) a.gp += 1;
    });
  });
  var list = Object.keys(byKey).map(function(k){ return byKey[k]; });
  list.forEach(function(a){
    a.fg2pct = a.fg2a>0 ? Math.round(a.fg2m/a.fg2a*100) : 0;
    a.fg3pct = a.fg3a>0 ? Math.round(a.fg3m/a.fg3a*100) : 0;
    a.ftpct = a.fta>0 ? Math.round(a.ftm/a.fta*100) : 0;
    a.fgpct = (a.fg2a+a.fg3a)>0 ? Math.round((a.fg2m+a.fg3m)/(a.fg2a+a.fg3a)*100) : 0;
    a.eff = eff({pts:a.pts,fg2m:a.fg2m,fg2a:a.fg2a,fg3m:a.fg3m,fg3a:a.fg3a,ftm:a.ftm,fta:a.fta,rebO:a.reb,rebD:0,ast:a.ast,stl:a.stl,blk:a.blk,to:a.to});
  });
  return list;
}
function rankLeader(list, key){

/* ---------- radar de jugadora ---------- */
var playerRadarFilter = 'todas';
function openPlayerRadar(key, from){ playerRadarFilter='todas'; go('playerRadar', {playerKey:key, from: from||'stats'}); }
function setPlayerRadarFilter(m){ playerRadarFilter = m; render(); }
function filteredGamesForPlayerRadar(){
  return S.games.filter(function(g){ return playerRadarFilter==='todas' || (g.kind||'liga')===playerRadarFilter; });
}
function radarPoint(cx,cy,R,i,n,ratio){
  var angle = (-90 + i*(360/n)) * Math.PI/180;
  var r = R * Math.max(0, Math.min(1, ratio));
  return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
}
function renderRadarSVG(axes, meVals, avgVals){
  var cx=150, cy=150, R=92, n=axes.length;
  var rings = [0.25,0.5,0.75,1];
  var gridPolys = rings.map(function(f){
    var pts = axes.map(function(_,i){ return radarPoint(cx,cy,R,i,n,f).join(','); }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  var axisLines = axes.map(function(_,i){
    var p = radarPoint(cx,cy,R,i,n,1);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  var labels = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R+22,i,n,1);
    var anchor = Math.abs(p[0]-cx)<4 ? 'middle' : (p[0]>cx?'start':'end');
    return '<text x="'+p[0]+'" y="'+p[1]+'" fill="var(--text-dim)" font-size="10.5" font-weight="800" text-anchor="'+anchor+'" dominant-baseline="middle">'+ax.label+'</text>';
  }).join('');
  function poly(vals, extra){
    var pts = axes.map(function(ax,i){ return radarPoint(cx,cy,R,i,n,vals[i]).join(','); }).join(' ');
    return '<polygon points="'+pts+'" '+extra+'/>';
  }
  var avgPoly = poly(avgVals, 'fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-dasharray="4,3"');
  var mePoly = poly(meVals, 'fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2.5"');
  var meDots = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R,i,n,meVals[i]);
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="var(--accent)"/>';
  }).join('');
  return '<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;display:block;margin:6px auto">'+
    gridPolys+axisLines+avgPoly+mePoly+meDots+labels+'</svg>';
}

function renderPlayerRadarPopup(){
  var games = filteredGamesForPlayerRadar();
  var list = aggregatePlayers(games);
  var key = S.routeParams.playerKey;
  var backTo = S.routeParams.from || 'stats';
  var me = list.filter(function(a){ return (a.dorsal+'|'+a.name)===key; })[0];
  var filterChips = '<div class="compsrow" style="padding-top:2px">'+
    ['todas','liga','torneo','amistoso'].map(function(f){

      return '<button class="chip'+(playerRadarFilter===f?' on':'')+'" onclick="setPlayerRadarFilter(\''+f+'\')">'+labels[f]+'</button>';
    }).join('')+'</div>';
  var h = '<div class="veilfull"><div class="sheet">';

    h += '<div class="content">'+filterChips+'<div class="empty">No hay datos suficientes con este filtro.</div></div>';
    h += '</div></div>';
    return h;
  }
  var axes = [
    {key:'pts', label:'PTS'}, {key:'to', label:'PÉR'}, {key:'blk', label:'TAP'},
    {key:'stl', label:'ROB'}, {key:'ast', label:'AST'}, {key:'rebD', label:'REB-D'},
    {key:'rebO', label:'REB-O'}, {key:'fg3pct', label:'3P%'}, {key:'fgpct', label:'FG%'}
  ];
  var maxes = axes.map(function(ax){
    return Math.max(1, Math.max.apply(null, list.map(function(a){ return a[ax.key]||0; })));
  });
  var meVals = axes.map(function(ax,i){ return (me[ax.key]||0) / maxes[i]; });
  var avgVals = axes.map(function(ax,i){
    var avg = list.reduce(function(s,a){ return s+(a[ax.key]||0); },0) / (list.length||1);
    return avg / maxes[i];
  });
  h += '<div class="sheethead"><div><div class="shtitle">'+esc(me.name)+'</div><div class="shsub">Dorsal '+me.dorsal+' &middot; perfil de estadísticas</div></div>'+
    '<button class="iconbtn" onclick="go(\''+backTo+'\')">'+icon('x',15)+'</button></div>';
  h += '<div class="content">';
  h += filterChips;
  h += renderRadarSVG(axes, meVals, avgVals);
  h += '<div class="radarlegend"><span><i class="dot" style="background:var(--accent)"></i>'+esc(me.name)+'</span><span><i class="dash"></i>Media del equipo</span></div>';
  h += '<div class="caption" style="text-align:center;margin-top:10px">Cada eje está a escala de la jugadora con el valor más alto del equipo en ese apartado.</div>';
  h += renderPlayerStatLine(me);
  h += '</div></div></div>';
  return h;
}

    '<div class="p1">Te hemos enviado un enlace de confirmación por correo electrónico.<br>Ábrelo y después vuelve aquí para iniciar sesión.</div>'+
    '<div class="cta ghost" style="cursor:pointer;margin-top:12px" onclick="authError=\'\';go(\'login\')">Ir a iniciar sesión</div>'+
    '</div>';
}
function renderRejected(){
  return '<div class="centerscreen">'+
    '<div class="iconwrap" style="color:var(--bad)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>'+
    '<div class="h1">Acceso no concedido</div>'+
    '<div class="p1">El administrador del equipo no ha aprobado tu solicitud. Si crees que es un error, habla con él directamente.</div>'+
    '<div class="cta ghost" style="cursor:pointer;margin-top:12px" onclick="doLogout()">Cerrar sesión</div>'+
    '</div>';
}
function openApprovals(){ loadPendingProfiles(); go('approvals'); }
function renderApprovals(){
  var h = '<div class="header" style="padding-bottom:8px"><div class="header-row">'+
    '<button class="iconbtn" onclick="go(\'home\')">'+icon('back',18)+'</button>'+
    '<div class="htitles"><div class="title">Solicitudes de acceso</div><div class="subtitle">'+pendingProfiles.length+' pendientes</div></div>'+
    '</div></div>';
  h += '<div class="content">';
  if(!pendingProfiles.length){
    h += '<div class="empty">No hay solicitudes pendientes.</div>';
  } else {
    pendingProfiles.forEach(function(p){
      var initials = (p.name||'?').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
      h += '<div class="reqcard"><div class="rtop"><div class="avatar">'+esc(initials)+'</div>'+
        '<div class="rinfo"><div class="rname">'+esc(p.name)+'</div><div class="rmeta">'+esc(p.email)+'</div></div></div>'+
        '<div class="ractions">'+
        '<button class="abtn approve" style="background:var(--good);color:oklch(18% 0.02 55);flex:1;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:12.5px" onclick="decideOnProfile(\''+p.id+'\',true)">'+icon('check',14)+'Aprobar</button>'+
        '<button class="abtn reject" style="flex:1;height:40px;border-radius:11px;border:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:12.5px" onclick="decideOnProfile(\''+p.id+'\',false)">'+icon('x',14)+'Rechazar</button>'+
        '</div></div>';
    });
  }
  h += '</div>';
  return h;
}

/* ---------- init ---------- */
if(SUPABASE_CONFIGURED){ bootAuth(); } else { render(); }
</script>
</body>
</html>
