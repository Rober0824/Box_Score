var playerRadarFilter = 'todas';
var playerRadarPage = 'radar';
function openPlayerRadar(key, from){ playerRadarFilter='todas'; playerRadarPage='radar'; go('playerRadar', {playerKey:key, from: from||'stats'}); }
function setPlayerRadarFilter(m){ playerRadarFilter = m; render(); }
function setPlayerRadarPage(p){ playerRadarPage = p; render(); }
/* ---- swipe between radar and mapa de tiro (touch drag, with the dots as a tap fallback) ---- */
var prSwipeStartX = null, prSwipeStartY = null, prSwipeDeltaX = 0, prSwipeDragging = false, prSwipeAxis = null;
function prSwipeStart(ev){
  var t = ev.touches[0];
  prSwipeStartX = t.clientX; prSwipeStartY = t.clientY;
  prSwipeDeltaX = 0; prSwipeAxis = null; prSwipeDragging = true;
}
function prSwipeMove(ev){
  if(!prSwipeDragging) return;
  var t = ev.touches[0];
  var dx = t.clientX - prSwipeStartX;
  var dy = t.clientY - prSwipeStartY;
  if(!prSwipeAxis && (Math.abs(dx)>8 || Math.abs(dy)>8)){
    prSwipeAxis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(prSwipeAxis!=='x') return; // vertical drag: let the sheet scroll normally
  ev.preventDefault();
  prSwipeDeltaX = dx;
  var track = document.getElementById('prSwipeTrack');
  if(track){
    var vp = track.parentElement;
    var base = playerRadarPage==='radar' ? 0 : -50;
    var pct = base + (dx / vp.offsetWidth * 50);
    pct = Math.max(-58, Math.min(8, pct));
    track.style.transition = 'none';
    track.style.transform = 'translateX('+pct+'%)';
  }
}
function prSwipeEnd(){
  if(!prSwipeDragging) return;
  prSwipeDragging = false;
  if(prSwipeAxis==='x'){
    var threshold = 40;
    if(prSwipeDeltaX < -threshold && playerRadarPage==='radar') playerRadarPage='map';
    else if(prSwipeDeltaX > threshold && playerRadarPage==='map') playerRadarPage='radar';
    render();
  }
  prSwipeDeltaX = 0; prSwipeAxis = null;
}
function filteredGamesForPlayerRadar(){
  return S.games.filter(function(g){ return playerRadarFilter==='todas' || (g.kind||'liga')===playerRadarFilter; });
}
function radarPoint(cx,cy,R,i,n,ratio){
  var angle = (-90 + i*(360/n)) * Math.PI/180;
  var r = R * Math.max(0, Math.min(1, ratio));
  return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
}
function renderRadarSVG(axes, meVals, avgVals, warnKeys){
  warnKeys = warnKeys || [];
  var cx=150, cy=150, R=92, n=axes.length;
  var rings = [0.25,0.5,0.75,1];
  var wedgeHalf = (360/n)/2;
  // background tint behind any axis where "bigger" is actually worse (e.g. turnovers),
  // so a big spike there doesn't read as a strength at a glance
  var warnWedges = axes.map(function(ax,i){
    if(warnKeys.indexOf(ax.key)===-1) return '';
    var baseAngle = -90 + i*(360/n);
    var a1 = (baseAngle - wedgeHalf) * Math.PI/180, a2 = (baseAngle + wedgeHalf) * Math.PI/180;
    var x1 = cx + R*Math.cos(a1), y1 = cy + R*Math.sin(a1);
    var x2 = cx + R*Math.cos(a2), y2 = cy + R*Math.sin(a2);
    return '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+R+' '+R+' 0 0 1 '+x2+' '+y2+' Z" fill="var(--bad)" fill-opacity="0.12"/>';
  }).join('');
  var gridPolys = rings.map(function(f){
    var pts = axes.map(function(_,i){ return radarPoint(cx,cy,R,i,n,f).join(','); }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  var axisLines = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R,i,n,1);
    var warn = warnKeys.indexOf(ax.key)!==-1;
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+(warn?'var(--bad)':'var(--border)')+'" stroke-width="1"/>';
  }).join('');
  var labels = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R+22,i,n,1);
    var anchor = Math.abs(p[0]-cx)<4 ? 'middle' : (p[0]>cx?'start':'end');
    var warn = warnKeys.indexOf(ax.key)!==-1;
    return '<text x="'+p[0]+'" y="'+p[1]+'" fill="'+(warn?'var(--bad)':'var(--text-dim)')+'" font-size="10.5" font-weight="800" text-anchor="'+anchor+'" dominant-baseline="middle">'+ax.label+'</text>';
  }).join('');
  function poly(vals, extra){
    var pts = axes.map(function(ax,i){ return radarPoint(cx,cy,R,i,n,vals[i]).join(','); }).join(' ');
    return '<polygon points="'+pts+'" '+extra+'/>';
  }
  var avgPoly = poly(avgVals, 'fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-dasharray="4,3"');
  var mePoly = poly(meVals, 'fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2.5"');
  var meDots = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R,i,n,meVals[i]);
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="var(--accent)"/>';
  }).join('');
  return '<div style="width:100%;max-width:320px;aspect-ratio:1/1;margin:6px auto">'+
    '<svg viewBox="0 0 300 300" width="100%" height="100%" style="display:block">'+
    warnWedges+gridPolys+axisLines+avgPoly+mePoly+meDots+labels+'</svg></div>';
}

function renderPlayerRadarPopup(){
  var games = filteredGamesForPlayerRadar();
  var list = aggregatePlayers(games);
  var key = S.routeParams.playerKey;
  var backTo = S.routeParams.from || 'stats';
  var me = list.filter(function(a){ return (a.dorsal+'|'+a.name)===key; })[0];
  var filterChips = '<div class="compsrow" style="padding-top:2px">'+
    ['todas','liga','torneo','amistoso'].map(function(f){
      var labels = {todas:'Todos', liga:'Liga', torneo:'Torneo', amistoso:'Amistosos'};
      return '<button class="chip'+(playerRadarFilter===f?' on':'')+'" onclick="setPlayerRadarFilter(\''+f+'\')">'+labels[f]+'</button>';
    }).join('')+'</div>';
  var h = '<div class="veilfull"><div class="sheet">';
  if(!me){
    var keyName = (key||'').split('|').slice(1).join('|') || 'Jugadora';
    h += '<div class="sheethead"><div><div class="shtitle">'+esc(keyName)+'</div></div><button class="iconbtn" onclick="go(\''+backTo+'\')">'+icon('x',15)+'</button></div>';
    h += '<div class="content">'+filterChips+'<div class="empty">No hay datos suficientes con este filtro.</div></div>';
    h += '</div></div>';
    return h;
  }
  // per-game averages for counting stats (fair comparison regardless of games played);
  // fg3pct/fg2pct/ftpct are already rates, shown as-is however many attempts they're built on
  var axes = [
    {key:'pts_pg', label:'PTS'}, {key:'to_pg', label:'PÉR'}, {key:'blk_pg', label:'TAP'},
    {key:'stl_pg', label:'ROB'}, {key:'ast_pg', label:'AST'}, {key:'reb_pg', label:'REB'},
    {key:'fg3pct', label:'3P%'}, {key:'fg2pct', label:'2P%'}, {key:'ftpct', label:'TL%'}
  ];
  var radarWarnKeys = ['to_pg']; // fewer turnovers is better -- flagged in red, not treated as a strength
  var maxes = axes.map(function(ax){
    return Math.max(1, Math.max.apply(null, list.map(function(a){ return a[ax.key]||0; })));
  });
  var meVals = axes.map(function(ax,i){ return (me[ax.key]||0) / maxes[i]; });
  var avgVals = axes.map(function(ax,i){
    var avg = list.reduce(function(s,a){ return s+(a[ax.key]||0); },0) / (list.length||1);
    return avg / maxes[i];
  });
  h += '<div class="sheethead"><div><div class="shtitle">'+esc(me.name)+'</div><div class="shsub">Dorsal '+me.dorsal+' &middot; perfil de estadísticas</div></div>'+
    '<button class="iconbtn" onclick="go(\''+backTo+'\')">'+icon('x',15)+'</button></div>';
  h += '<div class="content">';
  h += filterChips;
  h += '<div class="swipeviewport" ontouchstart="prSwipeStart(event)" ontouchmove="prSwipeMove(event)" ontouchend="prSwipeEnd()" ontouchcancel="prSwipeEnd()">';
  h += '<div class="swipetrack" id="prSwipeTrack" style="transform:translateX('+(playerRadarPage==='radar'?'0%':'-50%')+')">';
  h += '<div class="swipepage">'+renderRadarSVG(axes, meVals, avgVals, radarWarnKeys)+
    '<div class="radarlegend"><span><i class="dot" style="background:var(--accent)"></i>'+esc(me.name)+'</span><span><i class="dash"></i>Media del equipo</span></div>'+
    '<div class="caption" style="text-align:center;margin-top:10px">Cada eje está a escala de la jugadora con el valor más alto del equipo en ese apartado.</div>'+
    '</div>';
  h += '<div class="swipepage">'+renderShotMap(playerZoneStats(games, me.dorsal, me.name))+'</div>';
  h += '</div></div>';
  h += '<div class="swipedots"><div class="swipedot'+(playerRadarPage==='radar'?' on':'')+'" onclick="setPlayerRadarPage(\'radar\')"></div>'+
    '<div class="swipedot'+(playerRadarPage==='map'?' on':'')+'" onclick="setPlayerRadarPage(\'map\')"></div></div>';
  h += renderPlayerStatLine(me);
  h += '</div></div></div>';
  return h;
}

}

/* ---------- init ---------- */
if(SUPABASE_CONFIGURED){ bootAuth(); } else { maybeOfferResume(); render(); }
</script>
