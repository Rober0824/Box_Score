// Guarda/restaura el scroll del contenedor principal de la pantalla entre
// renders -- como render() sustituye TODO el HTML de #app en cada interacción
// (p.ej. cada toque al marcar el quinteto), sin esto el contenedor scrolleable
// se recreaba siempre desde arriba y la pantalla "saltaba" hacia arriba en
// cada toque. lastRenderedRoute guarda qué pantalla era la que estaba en
// pantalla ANTES de este render (S.route ya puede haber cambiado a la nueva
// ruta si esto viene de una navegación, no de un simple refresco).
var scrollPositions = {};
var lastRenderedRoute = null;
function render(){
  var app = document.getElementById('app');
  var prevScroller = app.querySelector('.content, .playlist, .livecontent, .boxcontent');
  if(prevScroller && lastRenderedRoute){ scrollPositions[lastRenderedRoute] = prevScroller.scrollTop; }
  trackRouteVisit(S.route);
  var html = '';
  if(SUPABASE_CONFIGURED && !authChecked){
    html = renderBoot();
  } else if(SUPABASE_CONFIGURED && ['login','register','pending','rejected','confirm','pickTeam'].indexOf(S.route)!==-1){
    if(S.route==='login') html = renderLogin();
    else if(S.route==='register') html = renderRegister();
    else if(S.route==='pending') html = renderPending();
    else if(S.route==='confirm') html = renderConfirmEmail();
    else if(S.route==='pickTeam') html = renderPickTeam();
    else html = renderRejected();
  } else if(S.route==='approvals'){
    html = renderApprovals();
  } else if(S.route==='ranking'){
    html = renderRankingPopup();
  } else if(S.route==='mvpHistory'){
    html = renderMvpHistoryPopup();
  } else if(S.route==='standingsEdit'){
    html = renderStandingsEditor();
  } else if(S.route==='playerRadar'){
    html = renderPlayerRadarPopup();
  } else if(S.route==='matchPlayer'){
    html = renderMatchPlayerPopup();
  } else {
    switch(S.route){
      case 'home': html = renderHome(); break;
      case 'team': html = renderTeamScreen(); break;
      case 'roster': html = renderRoster(); break;
      case 'admin': html = renderAdminMenu(); break;
      case 'adminFbm': html = renderAdminFbmSource(); break;
      case 'adminUsuarios': html = renderAdminUsuarios(); break;
      case 'analytics': html = renderAnalytics(); break;
      case 'diag': html = renderDiagnostics(); break;
      case 'stats': html = renderStats(); break;
      case 'setup': html = renderSetup(); break;
      case 'lineup': html = renderLineup(); break;
      case 'live': html = renderLive(); break;
      case 'stat': html = renderStat(); break;
      case 'shotzone': html = renderShotZone(); break;
      case 'assist': html = renderAssist(); break;
      case 'rivalquick': html = renderRivalQuick(); break;
      case 'rivalsheet': html = renderRivalSheet(); break;
      case 'box': html = renderBox(); break;
      case 'minutes': html = renderMinutes(); break;
      case 'games': html = renderGames(); break;
      default: html = SUPABASE_CONFIGURED ? renderHome() : renderSetup();
    }
  }
  html += menuOverlay();
  html += confirmOverlay();
  html += editMatchOverlay();
  html += editPlayerOverlay();
  html += faseModalOverlay();
  html += teamSwitcherOverlay();
  html += seasonSwitcherOverlay();
  html += seasonRenameOverlay();
  html += createTeamOverlay();
  html += nuevaTemporadaOverlay();
  html += rankFilterSheetOverlay();
  html += statsFilterSheetOverlay();
  html += zonePopupOverlay();
  html += manualClasifOverlay();
  html += bracketSetupOverlay();
  html += bracketMatchOverlay();
  html += toastHtml();
  app.innerHTML = html;
  var newScroller = app.querySelector('.content, .playlist, .livecontent, .boxcontent');
  if(newScroller && scrollPositions[S.route]){ newScroller.scrollTop = scrollPositions[S.route]; }
  lastRenderedRoute = S.route;
  setupBracketZoom();
  setupHeatMaps();
  setupSwipeHeights();
}

/* ---- box score ---- */
function renderBox(){
  var gid = S.routeParams.gameId || (S.current && S.current.id);
  var g = getGameById(gid);
  if(!g) return renderGames();
  var roster = g.roster.slice();
  var rows = roster.map(function(p){
    var st = playerStats(g,p.id);
    var mf = minutesFor(g,p.id);
    return {p:p, st:st, eff:eff(st), min:mf.total};
  });
  rows.sort(function(a,b){return a.p.dorsal-b.p.dorsal;});

  var teamTotal = teamScore(g);
  var backDest = S.routeParams.fromGames ? "go('games')" : (S.current && !S.current.finished ? "go('live')" : "go('games')");
  var h = '';
  h += '<div class="header"><div class="header-row">'+
        '<button class="iconbtn" onclick="'+backDest+'">'+icon('back',18)+'</button>'+
        '<div class="htitles"><div class="title">Box score</div></div>'+
       '</div>';
  h += '<div style="padding-top:14px">'+
       '<div class="finalpill">'+(g.finished?'Final':'En curso')+' · '+g.periodsCount+' '+esc(g.periodLabel.toLowerCase())+(g.periodsCount!==1?'s':'')+'</div>'+
       '<div class="finalscore"><div class="fteam"><div class="fname">'+esc(g.teamName.toUpperCase())+'</div><div class="fscore">'+teamTotal+'</div></div>'+
       '<div class="fdash">–</div>'+
       '<div class="fteam right"><div class="fname">'+esc((g.rivalName||'RIVAL').toUpperCase())+'</div><div class="fscore">'+rivalScore(g)+'</div></div></div>'+
       '</div></div>';

  if(g.finished){
    h += periodScoreChipsHtml(g);
  }

  h += '<div class="sortrow"><div class="sortlabel">Vista</div><div class="seg2" style="width:auto">'+
       '<button class="opt'+(boxViewMode==='team'?' on':'')+'" onclick="setBoxView(\'team\')">Equipo</button>'+
       '<button class="opt'+(boxViewMode==='players'?' on':'')+'" onclick="setBoxView(\'players\')">Jugadores</button>'+
       '<button class="opt'+(boxViewMode==='plays'?' on':'')+'" onclick="setBoxView(\'plays\')">Jugadas</button>'+
       '</div></div>';

  if(boxViewMode==='plays'){
    h += '<div class="boxcontent">'+renderPlayByPlay(g, {readOnly:true, flowing:true})+'</div>';
    return h;
  }

  if(boxViewMode==='team'){
    var boxPeriods = (g.finished && ensureBoxPeriodFilter(g.id).length) ? ensureBoxPeriodFilter(g.id) : null;
    h += '<div class="boxcontent">'+renderTeamPanel(g, {periods: boxPeriods})+'</div>';
    h += '<div class="actions"><button class="abtn" onclick="exportBoxScorePDF(\''+g.id+'\')">Exportar PDF</button><button class="abtn" onclick="shareBoxScore(\''+g.id+'\')">Compartir</button></div>';
    return h;
  }

  h += '<div class="boxcontent">'+renderPlayersTable(g, rows, teamTotal)+'</div>';
  h += '<div class="actions"><button class="abtn" onclick="exportBoxScorePDF(\''+g.id+'\')">Exportar PDF</button><button class="abtn" onclick="shareBoxScore(\''+g.id+'\')">Compartir</button></div>';
  return h;
}

/* ---- players table (Jugadores view of the box score) ---- */
function renderPlayersTable(g, rows, teamTotal){
  rows = rows.slice().sort(function(a,b){ return a.p.dorsal-b.p.dorsal; });
  var cols = ['MIN','FG','2PT','3PT','FT','O-REB','D-REB','REB','AST','ROB','TAP','PÉR','FAL','EFF','+/-','PTS'];
  var h = '<div class="tablewrap"><table class="stattable"><thead><tr><th class="stickycol">Jugadora</th>';
  cols.forEach(function(c){ h += '<th>'+c+'</th>'; });
  h += '</tr></thead><tbody>';

  function fg(m,a){ return m+'-'+a; }

  var fromGamesFlag = S.routeParams.fromGames ? 'true' : 'false';
  rows.forEach(function(r){
    var st = r.st;
    var pm = st.plusMinus;
    h += '<tr>';
    h += '<td class="stickycol" style="cursor:pointer" onclick="openMatchPlayerPopup(\''+g.id+'\',\''+r.p.id+'\','+fromGamesFlag+')"><div class="tcell-player"><span class="dorsal" style="width:22px;height:22px;font-size:11px">'+r.p.dorsal+'</span><span>'+esc(r.p.name)+'</span></div></td>';
    h += '<td class="numcell">'+r.min+'\' <button class="minbtn" onclick="openMinutes(\''+r.p.id+'\')">'+icon('pencil',10)+'</button></td>';
    h += '<td class="numcell">'+fg(st.fg2m+st.fg3m, st.fg2a+st.fg3a)+'</td>';
    h += '<td class="numcell">'+fg(st.fg2m,st.fg2a)+'</td>';
    h += '<td class="numcell">'+fg(st.fg3m,st.fg3a)+'</td>';
    h += '<td class="numcell">'+fg(st.ftm,st.fta)+'</td>';
    h += '<td class="numcell">'+st.rebO+'</td>';
    h += '<td class="numcell">'+st.rebD+'</td>';
    h += '<td class="numcell">'+(st.rebO+st.rebD)+'</td>';
    h += '<td class="numcell">'+st.ast+'</td>';
    h += '<td class="numcell">'+st.stl+'</td>';
    h += '<td class="numcell">'+st.blk+'</td>';
    h += '<td class="numcell">'+st.to+'</td>';
    h += '<td class="numcell">'+st.foulC+'</td>';
    h += '<td class="numcell">'+r.eff+'</td>';
    h += '<td class="numcell pmcell '+(pm>=0?'pos':'neg')+'">'+(pm>=0?'+':'−')+Math.abs(pm)+'</td>';
    h += '<td class="ptscell">'+st.pts+'</td>';
    h += '</tr>';
  });

  // team totals row
  var tot = {min:0,fg2m:0,fg2a:0,fg3m:0,fg3a:0,ftm:0,fta:0,rebO:0,rebD:0,ast:0,stl:0,blk:0,to:0,foulC:0,eff:0,pts:0};
  rows.forEach(function(r){
    tot.min+=r.min; tot.fg2m+=r.st.fg2m; tot.fg2a+=r.st.fg2a; tot.fg3m+=r.st.fg3m; tot.fg3a+=r.st.fg3a;
    tot.ftm+=r.st.ftm; tot.fta+=r.st.fta; tot.rebO+=r.st.rebO; tot.rebD+=r.st.rebD; tot.ast+=r.st.ast;
    tot.stl+=r.st.stl; tot.blk+=r.st.blk; tot.to+=r.st.to; tot.foulC+=r.st.foulC; tot.eff+=r.eff; tot.pts+=r.st.pts;
  });
  h += '<tr class="totalrow">'+
    '<td class="stickycol">Total</td>'+
    '<td>'+tot.min+'\'</td>'+
    '<td>'+fg(tot.fg2m+tot.fg3m, tot.fg2a+tot.fg3a)+'</td>'+
    '<td>'+fg(tot.fg2m,tot.fg2a)+'</td>'+
    '<td>'+fg(tot.fg3m,tot.fg3a)+'</td>'+
    '<td>'+fg(tot.ftm,tot.fta)+'</td>'+
    '<td>'+tot.rebO+'</td><td>'+tot.rebD+'</td><td>'+(tot.rebO+tot.rebD)+'</td>'+
    '<td>'+tot.ast+'</td><td>'+tot.stl+'</td><td>'+tot.blk+'</td><td>'+tot.to+'</td><td>'+tot.foulC+'</td>'+
    '<td>'+tot.eff+'</td><td>—</td><td>'+teamTotal+'</td>'+
    '</tr>';

  // rival row (only meaningful stats when tracked fully; otherwise just points)
  if(g.trackRivalFull){
    var a = g.rivalAgg;
    h += '<tr class="rivalrow">'+
      '<td class="stickycol">'+esc(g.rivalName||'Rival')+'</td>'+
      '<td>—</td>'+
      '<td>'+fg(a.twoM+a.threeM, a.twoA+a.threeA)+'</td>'+
      '<td>'+fg(a.twoM,a.twoA)+'</td>'+
      '<td>'+fg(a.threeM,a.threeA)+'</td>'+
      '<td>'+fg(a.ftM,a.ftA)+'</td>'+
      '<td>'+a.rebO+'</td><td>'+a.rebD+'</td><td>'+(a.rebO+a.rebD)+'</td>'+
      '<td>'+a.ast+'</td><td>'+a.stl+'</td><td>'+a.blk+'</td><td>'+a.to+'</td><td>'+a.foulC+'</td>'+
      '<td>—</td><td>—</td><td>'+rivalScore(g)+'</td>'+
      '</tr>';
  } else {
    h += '<tr class="rivalrow"><td class="stickycol">'+esc(g.rivalName||'Rival')+'</td>'+
      '<td colspan="15" style="text-align:left;color:var(--text-dim);font-weight:600">Solo marcador registrado</td>'+
      '<td>'+rivalScore(g)+'</td></tr>';
  }

  h += '</tbody></table></div>';
  return h;
}

function exportBoxScorePDF(gid){
  var g = getGameById(gid);
  if(!g) return;
  var area = document.getElementById('printArea');
  area.innerHTML = buildPrintHtml(g);
  // Nombre de archivo por defecto al guardar/exportar el PDF: "BBall Stats_" +
  // la fecha del partido -- el título del documento es lo que el navegador usa
  // como nombre sugerido. Se restaura al terminar para no afectar al resto de la app.
  var originalTitle = document.title;
  var fd = matchDateObj(g);
  document.title = 'BBall Stats_'+pad2(fd.getDate())+'-'+pad2(fd.getMonth()+1)+'-'+fd.getFullYear();
  var restored = false;
  function restoreTitle(){
    if(restored) return;
    restored = true;
    document.title = originalTitle;
    window.removeEventListener('afterprint', restoreTitle);
  }
  window.addEventListener('afterprint', restoreTitle);
  setTimeout(function(){
    window.print();
    // Por si el navegador no dispara "afterprint" (pasa en algunos flujos de
    // "compartir/exportar a PDF" en móvil) -- restaurar el título de todos modos.
    setTimeout(restoreTitle, 5000);
  }, 30);
}
function shareBoxScore(gid){
  var g = getGameById(gid);
  if(!g) return;
  var rows = g.roster.map(function(p){
    var st = playerStats(g,p.id);
    return {p:p, st:st, eff:eff(st)};
  });
  var topScorer = rows.slice().sort(function(a,b){return b.st.pts-a.st.pts;})[0];
  var topEff = rows.slice().sort(function(a,b){return b.eff-a.eff;})[0];
  var lines = [];
  lines.push(g.teamName+' '+teamScore(g)+' – '+rivalScore(g)+' '+(g.rivalName||'Rival'));
  lines.push(g.periodsCount+' '+g.periodLabel.toLowerCase()+(g.periodsCount!==1?'s':'')+(g.finished?' · Final':' · En curso'));
  if(topScorer && topScorer.st.pts>0) lines.push('Máxima anotadora: '+topScorer.p.name+' ('+topScorer.st.pts+' pts)');
  if(topEff && topEff.eff>0) lines.push('Mejor eficiencia: '+topEff.p.name+' ('+topEff.eff+' EFF)');
  var text = lines.join('\n');
  if(navigator.share){
    navigator.share({title:'Box score', text:text}).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast('Resumen copiado. Pégalo donde quieras compartirlo.');
    }).catch(function(){
      showToast('No se ha podido copiar el resumen.');
    });
  } else {
    showToast('Compartir no está disponible en este navegador.');
  }
}

  h += row(team.ftM+'/'+team.ftA, 'Tiros libres', R(rivalKnown?(rival.ftM+'/'+rival.ftA):''));

  h += '<div class="teamstat-divider"></div>';

  if(!rivalKnown){
    h += '<div class="rivalnote" style="margin-top:10px"><div class="ic">'+icon('info',16)+'</div><div class="tx">Activa "Completas" en la configuración del rival para comparar también sus estadísticas de equipo. De momento solo tienes su marcador: <b>'+rivalScore(g)+' pts</b>.</div></div>';
  }
  if(periods && rivalKnown){
    var ps2 = periodScores(g);

function shotMapCardHtml(g, periods){
  var title = 'Mapa de tiro'+(periods?' · '+periods.slice().sort(function(a,b){return a-b;}).map(function(p){return esc(g.periodLabel)+' '+p;}).join(' + '):'');
  return {title: title, content: '<div class="shotmapcard">'+renderShotMap(teamZoneStats([g], periods))+'</div>'};
}
// % de tiro del EQUIPO en UN PERIODO concreto de un partido (para la
// tendencia por sexto de la pantalla de partido).
function teamPeriodShotPct(g, period, kind){
  var events = g.events.filter(function(e){ return e.period===period; });
  var ta = teamAggregates(g, 'team', events);
  var m,a;
  if(kind==='ft'){ m=ta.ftM; a=ta.ftA; }
  else if(kind==='3pt'){ m=ta.p3M; a=ta.p3A; }
  else { m=ta.fgM-ta.p3M; a=ta.fgA-ta.p3A; }
  return a>0 ? {m:m, a:a, pct:Math.round(1000*m/a)/10} : null;
}
var boxTrendSelectedIdx = {}; // gameId -> índice de periodo seleccionado en la gráfica
function setBoxTrendIdx(gid, i){ boxTrendSelectedIdx[gid] = i; render(); }
// Tarjeta "Tendencia de tiro" de la pantalla de partido: en vez de un punto
// por partido (como en Estadísticas), aquí un punto por periodo/sexto DE
// ESTE partido -- respeta el mismo filtro de periodos que el resto del panel.
function renderBoxTrendCard(g, periods){
  var pnums = (periods && periods.length) ? periods.slice().sort(function(a,b){return a-b;}) : (function(){
    var out = []; for(var p=1;p<=g.periodsCount;p++) out.push(p); return out;
  })();
  var items = pnums.map(function(p){ return {period:p}; });
  var series = [
    {color:'var(--reb)', label:'TL', dataFn:function(it){ return teamPeriodShotPct(g, it.period, 'ft'); }},
    {color:'var(--accent)', label:'2PT', dataFn:function(it){ return teamPeriodShotPct(g, it.period, '2pt'); }},
    {color:'var(--create)', label:'3PT', dataFn:function(it){ return teamPeriodShotPct(g, it.period, '3pt'); }}
  ];
  var h = '<div class="trendcard">';
  h += '<div class="legend"><span><i style="background:var(--reb)"></i>Tiro libre</span><span><i style="background:var(--accent)"></i>2 puntos</span><span><i style="background:var(--create)"></i>3 puntos</span></div>';
  if(!items.length){
    h += '<div class="empty" style="padding:16px 0">No hay tiros registrados todavía.</div>';
  } else {
    h += buildTrendChartSvg(items, series, boxTrendSelectedIdx[g.id], {
      selectFn: "setBoxTrendIdx.bind(null,'"+g.id+"')",
      labelFn: function(it){ return esc(g.periodLabel||'Periodo')+' '+it.period; }
    });
    h += '<div class="charttip">Toca un '+esc((g.periodLabel||'periodo').toLowerCase())+' en la gráfica para ver los datos exactos</div>';
  }
  h += '</div>';
  return {title: 'Tendencia por '+esc((g.periodLabel||'periodo').toLowerCase()), content: h};
}

function edField(field, value){
  if(!editMatchDraft) return;
  if(field==='kind'){ editMatchDraft.kind = value; if(value==='amistoso') editMatchDraft.jornada = null; else if(!editMatchDraft.jornada) editMatchDraft.jornada = 1; render(); }
  else if(field==='jornadaStep'){ editMatchDraft.jornada = Math.max(1, (editMatchDraft.jornada||1)+value); render(); }
  else if(field==='rivalName'){ editMatchDraft.rivalName = value; } // typed via oninput -- no render() here, or the input loses focus/closes the mobile keyboard on every keystroke
  else if(field==='matchDate'){ if(value) editMatchDraft.matchDate = value; render(); }

  if(!isAdmin()) return;
  var g = getGameById(id);
  if(!g) return;
  var isLive = !!(S.current && S.current.id===id);
  var msg = 'Se borrará '+g.teamName+' vs '+(g.rivalName||'Rival')+(isLive?' (partido en curso)':'')+' y todas sus estadísticas. Esta acción no se puede deshacer.';
  askConfirm('Borrar partido', msg, 'Borrar', function(){ deleteMatch(id); });
}
async function deleteMatch(id){
  if(!isAdmin()){ showToast('Solo un administrador puede borrar partidos.'); return; }
  if(!canWriteCurrentSeason()){ showToast('Esta temporada es solo de consulta.'); return; }
  // Si había un guardado en la nube pendiente (debounced, 900ms) para este
  // partido, hay que cancelarlo -- si no, podía dispararse JUSTO DESPUÉS de
  // borrar y volver a crear el partido en Supabase (pushMatch hace upsert),
  // "resucitándolo" sin que se note hasta la próxima vez que se cargan los
  // datos. Esto podía ser la causa de que un partido en curso "no se dejara
  // borrar" de verdad (parecía borrarse y luego volvía a aparecer).
  if(cloudSaveTimer){ clearTimeout(cloudSaveTimer); cloudSaveTimer = null; }
  var removedCurrent = null, removedFromGames = null, removedIdx = -1;
  if(S.current && S.current.id===id){ removedCurrent = S.current; S.current = null; }
  else {
    removedIdx = S.games.findIndex(function(g){ return g.id===id; });
    if(removedIdx!==-1) removedFromGames = S.games.splice(removedIdx,1)[0];
  }
  saveState();
  render();
  function restoreLocal(){
    if(removedCurrent){ S.current = removedCurrent; }
    else if(removedFromGames){ S.games.splice(removedIdx,0,removedFromGames); }
    saveState(); render();
  }
  if(sb){
    try{
      // OJO: pedimos .select('id') a propósito. Sin esto, si el permiso (RLS)
      // de Supabase bloquea el borrado, la llamada NO devuelve ningún error
      // -- simplemente borra 0 filas en silencio y responde "todo bien". Con
      // .select('id') podemos comprobar si de verdad se borró alguna fila, y
      // si no, avisar en vez de dar el borrado por hecho sin serlo.
      var res = await sb.from('matches').delete().eq('id', id).select('id');
      if(res && res.error){ restoreLocal(); showToast('No se ha podido borrar: '+res.error.message); }
      else if(!res || !res.data || !res.data.length){ restoreLocal(); showToast('No tienes permiso para borrar este partido (revisa los permisos en Supabase).'); }
    }catch(e){ restoreLocal(); showToast('No se ha podido borrar el partido (revisa la conexión).'); }
  }
}

  if(needsBracketWizard) openBracketSetup(clean.id);

async function loadUsersScreenData(){
  if(!sb || !usersFilterSeasonId || !seasons.length){ usersScreenData = {pending:[],approved:[],others:[]}; render(); return; }
  try{
    var teamSeasonIds = seasons.map(function(s){ return s.id; });
    var allRes = await sb.from('team_season_access').select('*, profiles(id,name,email,role)').in('season_id', teamSeasonIds);
    var allRows = (allRes && allRes.data) || [];
    var thisSeasonRows = allRows.filter(function(r){ return r.season_id===usersFilterSeasonId; });
    var pending = thisSeasonRows.filter(function(r){ return r.status==='pending'; });
    var approved = thisSeasonRows.filter(function(r){ return r.status==='approved'; });
    var idsInThisSeason = thisSeasonRows.map(function(r){ return r.user_id; });
    var byUser = {};
    allRows.forEach(function(r){
      if(idsInThisSeason.indexOf(r.user_id)!==-1) return;
      if(!r.profiles || r.profiles.role==='admin') return;
      if(!byUser[r.user_id] || new Date(r.created_at) > new Date(byUser[r.user_id].created_at)) byUser[r.user_id] = r;
    });
    var others = Object.keys(byUser).map(function(uid){
      var r = byUser[uid];
      var s = byIdArr(seasons, r.season_id);
      return { profile:r.profiles, seasonLabel: s ? s.label : '' };
    });
    usersScreenData = { pending:pending, approved:approved, others:others };
  }catch(e){ usersScreenData = {pending:[],approved:[],others:[]}; }
  render();
}

  if(!sb || !usersFilterSeasonId) return;
  try{ await sb.from('team_season_access').insert({ user_id:userId, season_id:usersFilterSeasonId, status:'approved', decided_at:new Date().toISOString() }); }catch(e){}

async function revokeAccessRow(id){

// jugadoras con distinto número de partidos jugados) -- excepto los

var RANK_STATS = [
  {key:'pts_pg', label:'Puntos'},
  {key:'reb_pg', label:'Rebotes'},
  {key:'ast_pg', label:'Asistencias'},
  {key:'stl_pg', label:'Robos'},
  {key:'fg2pct', label:'% de 2'},
  {key:'fg3pct', label:'% de 3'},
  {key:'ftpct', label:'% de TL'},
  {key:'eff_pg', label:'Eficiencia'}
];
function allFinishedGames(){ return S.games; }
function aggregatePlayers(games){
  var byKey = {};
  games.forEach(function(g){
    (g.roster||[]).forEach(function(p){
      var st = playerStats(g, p.id);
      var key = p.dorsal+'|'+p.name;
      if(!byKey[key]) byKey[key] = { dorsal:p.dorsal, name:p.name, pts:0, reb:0, rebO:0, rebD:0, ast:0, stl:0, blk:0, to:0, foulC:0, fg2m:0, fg2a:0, fg3m:0, fg3a:0, ftm:0, fta:0, plusMinus:0, gp:0 };
      var a = byKey[key];
      a.pts += st.pts; a.reb += (st.rebO+st.rebD); a.rebO += st.rebO; a.rebD += st.rebD; a.ast += st.ast; a.stl += st.stl; a.blk += st.blk; a.to += st.to; a.foulC += st.foulC;
      a.fg2m += st.fg2m; a.fg2a += st.fg2a; a.fg3m += st.fg3m; a.fg3a += st.fg3a; a.ftm += st.ftm; a.fta += st.fta;
      a.plusMinus += st.plusMinus;
      if(st.fg2a||st.fg3a||st.fta||st.pts||st.rebO||st.rebD||st.ast||st.stl||st.blk||st.to||st.foulC) a.gp += 1;
    });
  });
  var list = Object.keys(byKey).map(function(k){ return byKey[k]; });
  list.forEach(function(a){
    a.fg2pct = a.fg2a>0 ? Math.round(a.fg2m/a.fg2a*100) : 0;
    a.fg3pct = a.fg3a>0 ? Math.round(a.fg3m/a.fg3a*100) : 0;
    a.ftpct = a.fta>0 ? Math.round(a.ftm/a.fta*100) : 0;
    a.fgpct = (a.fg2a+a.fg3a)>0 ? Math.round((a.fg2m+a.fg3m)/(a.fg2a+a.fg3a)*100) : 0;
    a.eff = eff({pts:a.pts,fg2m:a.fg2m,fg2a:a.fg2a,fg3m:a.fg3m,fg3a:a.fg3a,ftm:a.ftm,fta:a.fta,rebO:a.reb,rebD:0,ast:a.ast,stl:a.stl,blk:a.blk,to:a.to});
    // per-game averages, so comparing players with a different number of games played is fair
    // (used by the radar chart; the text stat cards elsewhere still show season totals)
    a.pts_pg = a.gp>0 ? a.pts/a.gp : 0;
    a.to_pg = a.gp>0 ? a.to/a.gp : 0;
    a.blk_pg = a.gp>0 ? a.blk/a.gp : 0;
    a.stl_pg = a.gp>0 ? a.stl/a.gp : 0;
    a.ast_pg = a.gp>0 ? a.ast/a.gp : 0;
    a.rebD_pg = a.gp>0 ? a.rebD/a.gp : 0;
    a.rebO_pg = a.gp>0 ? a.rebO/a.gp : 0;
    a.reb_pg = a.gp>0 ? a.reb/a.gp : 0;
    a.eff_pg = a.gp>0 ? a.eff/a.gp : 0;
  });
  return list;
}
function rankLeader(list, key){
  var withPct = ['fg2pct','fg3pct','ftpct'].indexOf(key)!==-1;
  var pool = withPct ? list.filter(function(a){ return (key==='fg2pct'?a.fg2a:key==='fg3pct'?a.fg3a:a.fta) > 0; }) : list;
  if(!pool.length) return null;
  return pool.slice().sort(function(a,b){ return b[key]-a[key]; })[0];
}
// Formatea un valor de estadística para mostrar: los porcentajes van enteros
// (ya son una tasa, no tiene sentido "por partido"), el resto de medias por
// partido con 1 decimal (12 partidos con 3.0 puntos de media no es lo mismo
// que "3 puntos" a secas).
function fmtRankVal(val, isPct){

// MVP del mes: entre las jugadoras con partidos finalizados este mes natural,
// la que tiene mejor media de Eficiencia (EFF) por partido.
function mvpOfMonth(){
  var now = new Date();
  var gamesThisMonth = S.games.filter(function(g){
    var d = matchDateObj(g);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
  if(!gamesThisMonth.length) return null;
  var list = aggregatePlayers(gamesThisMonth).filter(function(a){ return a.gp>0; });
  if(!list.length) return null;
  list.sort(function(a,b){ return b.eff_pg-a.eff_pg; });
  var top = list[0];
  var monthLabel = now.toLocaleDateString('es-ES', {month:'long'});
  monthLabel = monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1);
  top.monthLabel = monthLabel;
  return top;
}

/* =====================================================================
   MODO MANUAL POR FASE (clasificación manual con auto-orden estilo FBM, o
   bracket/cuadro de eliminatorias) + tabla de clasificación con TODAS las
   columnas de la FBM. Todo lo del bracket (equipos, resultados) vive dentro
   del propio objeto de la fase (clubSettings.fbm_fases[i].bracket), como un
   jsonb más -- no hace falta ninguna tabla nueva en Supabase para esto.
   ===================================================================== */

function standingsForFase(faseId){
  if(!faseId) return standings;
  return standings.filter(function(r){ return r.fase_id===faseId; });
}
// P.G y Puntos se derivan siempre de P.J/P.P/P.E (nunca se piden a mano):
// P.G = P.J - P.P - P.E ; Puntos = P.G*2 + P.E*1 (victoria=2, empate=1).
function deriveClasifRow(r){
  var pj = parseInt(r.pj,10)||0, pp = parseInt(r.pp,10)||0, pe = parseInt(r.pe,10)||0;
  var pg = Math.max(0, pj - pp - pe);
  return { pg: pg, pts: pg*2 + pe };
}
// Reordena y renumera igual que hace la FBM: primero por Puntos, y en caso de
// empate por el mejor promedio/ratio entre P.F y P.C (si P.C es 0 con P.F>0 se
// considera el mejor promedio posible). Último desempate, por si el ratio
// también coincide: la diferencia de puntos a favor/en contra.
function sortedStandingsForDisplay(rows){
  var withDerived = rows.map(function(r){ return Object.assign({}, r); });
  withDerived.sort(function(a,b){
    if((b.pts||0) !== (a.pts||0)) return (b.pts||0) - (a.pts||0);
    var ra = (a.pc>0) ? (a.pf/a.pc) : ((a.pf>0) ? Infinity : 0);
    var rb = (b.pc>0) ? (b.pf/b.pc) : ((b.pf>0) ? Infinity : 0);
    if(rb !== ra) return rb - ra;
    return ((b.pf||0)-(b.pc||0)) - ((a.pf||0)-(a.pc||0));
  });
  withDerived.forEach(function(r,i){ r.position = i+1; });
  return withDerived;
}
// Tabla compartida (auto y manual) con TODAS las columnas de la FBM -- ancho
// pensado a propósito para que quepan las 9 columnas sin recortar nada ni

function mcField(i, field, value){

async function saveManualClasif(){
  if(!manualClasifFaseId || !currentSeasonId) return;
  if(!canWriteCurrentSeason()){ showToast('Esta temporada es solo de consulta.'); manualClasifOpen=false; render(); return; }
  manualClasifSaving = true; render();
  for(var i=0;i<manualClasifRemoved.length;i++){ try{ await sb.from('standings_entries').delete().eq('id', manualClasifRemoved[i]); }catch(e){} }
  var rowsToSave = manualClasifDraft.filter(function(r){ return (r.team_name||'').trim(); }).map(function(r){
    var d = deriveClasifRow(r);
    return Object.assign({}, r, { pg: d.pg, pts: d.pts });
  });
  var sorted = sortedStandingsForDisplay(rowsToSave);
  for(var j=0;j<sorted.length;j++){
    var row = sorted[j];
    var payload = { position: row.position, team_name: row.team_name, pj: row.pj||0, pg: row.pg||0, pp: row.pp||0, pe: row.pe||0, pf: row.pf||0, pc: row.pc||0, pts: row.pts||0, is_own_team: !!row.is_own_team, season_id: currentSeasonId, fase_id: manualClasifFaseId };
    if(row.id) payload.id = row.id; else payload.id = uuidv4();
    try{ await sb.from('standings_entries').upsert(payload); }catch(e){}

/* ---------- Bracket / cuadro de eliminatorias (por fase) ---------- */
function nextPow2(n){ var p=1; while(p<n) p*=2; return Math.max(1,p); }
function padToPow2(ids){
  var size = nextPow2(ids.length || 1);
  var out = ids.slice();
  while(out.length < size) out.push(null);
  return out;
}
// legs: [{a,b}, ...] resultados de cada partido de un mismo cruce. Ninguno
// fijo a 1 o 2 -- se admiten los que hagan falta (al mejor de 3, 5...). Gana
// quien tenga más partidos ganados; si el número de partidos ganados queda
// empatado (p.ej. eliminatorias a un número par de partidos), desempata quien
// tenga mejor suma total de puntos a favor/en contra de todos los partidos
// jugados. Solo si también empatan en eso el cruce sigue pendiente.
function legsTally(legs){
  var wa=0, wb=0, played=0, sumA=0, sumB=0;
  (legs||[]).forEach(function(l){
    if(!l) return;
    var a = (l.a==='' || l.a==null) ? null : Number(l.a);
    var b = (l.b==='' || l.b==null) ? null : Number(l.b);
    if(a==null || b==null || isNaN(a) || isNaN(b)) return;
    played++;
    sumA += a; sumB += b;
    if(a>b) wa++; else if(b>a) wb++;
  });
  return { wa:wa, wb:wb, played:played, sumA:sumA, sumB:sumB };
}
function legsResult(legs){
  var t = legsTally(legs);
  if(t.wa>t.wb) return 'A';
  if(t.wb>t.wa) return 'B';
  if(t.played>0){
    if(t.sumA>t.sumB) return 'A';
    if(t.sumB>t.sumA) return 'B';
  }
  return null;
}
// Construye las rondas de UN lado (o del bracket entero si sides=1) a partir
// de los slots iniciales (ids de equipo, o null = "bye"/pasa directo).
// Todo se deriva de los resultados guardados cada vez que se llama -- no se
// guarda ningún "ganador" en ningún sitio, así que corregir un resultado de
// una ronda ya jugada actualiza solo, en cadena, las rondas siguientes.
function computeSideBracket(initialSlots, results, keyPrefix){
  var rounds = [];
  var currentTeams = initialSlots.slice();
  while(currentTeams.length >= 1){
    if(currentTeams.length === 1) break;
    // El "bye" (un hueco vacío que pasa directo) SOLO existe en la ronda 0,
    // que viene de rellenar hasta la potencia de 2 más cercana. A partir de
    // la ronda 1, un hueco vacío significa "el cruce anterior aún no está
    // decidido" -- NUNCA se debe dar por ganador automático al otro equipo
    // solo porque su rival todavía no se conoce (si no, un cruce se declararía
    // "campeón" antes de que el resto del cuadro haya terminado).
    var isFirstRound = rounds.length === 0;
    var matchups = [];
    for(var i=0;i<currentTeams.length;i+=2){
      var teamA = currentTeams[i], teamB = currentTeams[i+1];
      var key = keyPrefix+rounds.length+'-'+(i/2);
      var legs = (results && results[key]) || [];
      var winnerId = null;
      if(isFirstRound && teamA && !teamB) winnerId = teamA;
      else if(isFirstRound && teamB && !teamA) winnerId = teamB;
      else if(teamA && teamB){
        var res = legsResult(legs);
        winnerId = res==='A' ? teamA : (res==='B' ? teamB : null);
      }
      matchups.push({ key:key, teamA:teamA, teamB:teamB, legs:legs, winnerId:winnerId });
    }
    rounds.push(matchups);
    currentTeams = matchups.map(function(m){ return m.winnerId; });
  }
  return { rounds: rounds, championId: currentTeams[0] || null };
}
function computeBracket(bracket){
  bracket = bracket || {};
  var teams = bracket.teams || [];
  var results = bracket.results || {};
  if(bracket.sides === 2){
    var side0 = teams.filter(function(t){ return t.side===0; }).map(function(t){ return t.id; });
    var side1 = teams.filter(function(t){ return t.side===1; }).map(function(t){ return t.id; });
    var sideA = computeSideBracket(padToPow2(side0), results, 'A');
    var sideB = computeSideBracket(padToPow2(side1), results, 'B');
    var finalKey = 'F-0';
    var finalLegs = results[finalKey] || [];
    var finalWinner = null;
    if(sideA.championId && sideB.championId){
      var res = legsResult(finalLegs);
      finalWinner = res==='A' ? sideA.championId : (res==='B' ? sideB.championId : null);
    }
    return { mode:'2sides', sideA: sideA.rounds, sideB: sideB.rounds, final: [{ key:finalKey, teamA:sideA.championId, teamB:sideB.championId, legs:finalLegs, winnerId:finalWinner }], championId: finalWinner };
  } else {
    var slots = padToPow2(teams.map(function(t){ return t.id; }));
    var single = computeSideBracket(slots, results, '');
    return { mode:'1side', rounds: single.rounds, championId: single.championId };
  }
}
function findMatchupByKey(bracket, key){
  var comp = computeBracket(bracket);
  var all = [];
  if(comp.mode==='2sides'){
    comp.sideA.forEach(function(r){ all = all.concat(r); });
    comp.sideB.forEach(function(r){ all = all.concat(r); });
    all = all.concat(comp.final);
  } else {
    comp.rounds.forEach(function(r){ all = all.concat(r); });
  }
  return all.filter(function(m){ return m.key===key; })[0] || null;
}
function roundName(matchCount){
  if(matchCount===1) return 'Final';
  if(matchCount===2) return 'Semifinal';
  if(matchCount===4) return 'Cuartos';
  if(matchCount===8) return 'Octavos';
  if(matchCount>=1) return (matchCount*2)+'avos';
  return '';
}

var bracketMatchDraft = null; // {faseId, key, legs:[{a,b}]}
function openBracketMatch(faseId, key){
  var fase = byIdArr(clubSettings.fbm_fases||[], faseId);
  if(!fase || !fase.bracket) return;
  var legs = (fase.bracket.results && fase.bracket.results[key]) || [];
  var emptyLegs = [];
  var n = Math.max(1, fase.bracket.legsPerTie || 2);
  for(var i=0;i<n;i++) emptyLegs.push({a:'',b:''});
  bracketMatchDraft = { faseId:faseId, key:key, legs: legs.length ? legs.map(function(l){ return Object.assign({},l); }) : emptyLegs };
  render();
}
function closeBracketMatch(){ bracketMatchDraft = null; render(); }
// Un solo sitio para el texto de "quién pasa": gana quien tenga más partidos
// ganados, y si empatan (eliminatorias a un nº par de partidos) se desempata
// por la suma total de puntos a favor/en contra -- igual que legsResult().
function bmWinnerLabel(tally, nameA, nameB){
  if(!tally.played) return '';
  if(tally.wa>tally.wb) return esc(nameA)+' gana '+tally.wa+'–'+tally.wb+' y pasa a la siguiente ronda';
  if(tally.wb>tally.wa) return esc(nameB)+' gana '+tally.wb+'–'+tally.wa+' y pasa a la siguiente ronda';
  if(tally.sumA>tally.sumB) return esc(nameA)+' pasa a la siguiente ronda por mejor suma de puntos ('+tally.sumA+'-'+tally.sumB+' en total)';
  if(tally.sumB>tally.sumA) return esc(nameB)+' pasa a la siguiente ronda por mejor suma de puntos ('+tally.sumB+'-'+tally.sumA+' en total)';
  return '';
}
// Igual que en mcField: nada de render() en cada tecla o el teclado se cierra.
// Se actualiza el borrador y se parchea a mano el aviso de "quién gana y pasa".
function bmLegField(i, side, value){
  if(!bracketMatchDraft || !bracketMatchDraft.legs[i]) return;
  bracketMatchDraft.legs[i][side] = value;
  var fase = byIdArr(clubSettings.fbm_fases||[], bracketMatchDraft.faseId);
  var bracket = fase && fase.bracket;
  var teamsById = {}; ((bracket&&bracket.teams)||[]).forEach(function(t){ teamsById[t.id]=t; });
  var m = bracket ? findMatchupByKey(bracket, bracketMatchDraft.key) : null;
  var nameA = m && teamsById[m.teamA] ? teamsById[m.teamA].name : '—';
  var nameB = m && teamsById[m.teamB] ? teamsById[m.teamB].name : '—';
  var tally = legsTally(bracketMatchDraft.legs);
  var winnerLabel = bmWinnerLabel(tally, nameA, nameB);
  var resultEl = document.getElementById('bm-result');
  if(resultEl){
    resultEl.textContent = winnerLabel;
    resultEl.style.display = winnerLabel ? 'block' : 'none';
  }
}
function bmAddLeg(){ if(bracketMatchDraft){ bracketMatchDraft.legs.push({a:'',b:''}); render(); } }
function bmRemoveLeg(i){ if(bracketMatchDraft){ bracketMatchDraft.legs.splice(i,1); render(); } }
async function saveBracketMatch(){
  if(!bracketMatchDraft) return;
  if(!canWriteCurrentSeason()){ showToast('Esta temporada es solo de consulta.'); bracketMatchDraft=null; render(); return; }
  var faseId = bracketMatchDraft.faseId, key = bracketMatchDraft.key;
  var legs = bracketMatchDraft.legs.filter(function(l){ return (l.a!=='' && l.a!=null) || (l.b!=='' && l.b!=null); });
  var fases = (clubSettings.fbm_fases||[]).map(function(f){
    if(f.id!==faseId) return f;
    var bracket = Object.assign({}, f.bracket||{});
    var results = Object.assign({}, bracket.results||{});
    if(legs.length) results[key] = legs; else delete results[key];
    bracket.results = results;
    return Object.assign({}, f, { bracket: bracket });
  });
  bracketMatchDraft = null;
  await saveClubSettings({ fbm_fases: fases });
}

  h += '<div class="caption">Añade tantos partidos como se jueguen entre estos dos equipos (1, 2, al mejor de 3, 5...). El equipo que gane más partidos avanza automáticamente.</div>';

      '<button class="rmbtn" onclick="bmRemoveLeg('+i+')">'+icon('trash',14)+'</button></div>';
  });
  h += '<button class="addlegbtn" onclick="bmAddLeg()">'+icon('plus',14)+' Añadir otro partido</button>';
  h += '<div class="result" id="bm-result" style="display:'+(winnerLabel?'block':'none')+'">'+winnerLabel+'</div>';
  h += '</div>';

    '<div class="cancel">Puedes volver a abrir este cruce cuando quieras para corregir los resultados</div></div>';
  h += '</div></div>';
  return h;
}

/* ---------- Bloque del bracket en Inicio: sale entero por defecto, pellizca
   con los dedos para ampliar/reducir y arrastra para moverte por él. ---------- */
var bracketZoomState = {}; // { [faseId]: {scale,tx,ty,fitted,sig} } -- transitorio, no se guarda
// Constantes de dibujo del bracket (px). BRK_H no depende del nº de partidos
// por eliminatoria -- la tarjeta de un cruce siempre muestra el resultado ya
// resumido (partidos ganados), no cada partido suelto.
var BRK_W = 148, BRK_H = 56, BRK_GAPX = 28, BRK_GAP0 = 16, BRK_TOP = 22, BRK_PADX = 14;
// Centrado recursivo, puramente geométrico (no toca el cálculo del bracket):
// cada cruce de una ronda se sitúa justo en medio de los dos cruces de los
// que depende, para poder trazar líneas rectas de un cruce al siguiente,
// como un cuadro de playoffs de verdad.
function bracketRoundYs(rounds){
  var ys = [];
  if(!rounds || !rounds.length) return ys;
  var pitch0 = BRK_H + BRK_GAP0;
  ys[0] = rounds[0].map(function(_, i){ return i*pitch0; });
  for(var r=1;r<rounds.length;r++){
    ys[r] = rounds[r].map(function(_, i){
      var c0 = ys[r-1][2*i] + BRK_H/2;
      var c1 = ys[r-1][2*i+1] + BRK_H/2;
      return (c0+c1)/2 - BRK_H/2;
    });
  }
  return ys;
}
function renderBracketBlock(fase){
  var bracket = fase.bracket || { teams:[], results:{}, sides:1 };
  var teams = bracket.teams || [];
  if(!teams.length){
    return '<div class="bracketempty"><div class="empty" style="padding:20px 0 16px">Todavía no has creado el bracket de esta fase.</div>'+
      '<button class="cta" onclick="openBracketSetup(\''+fase.id+'\')">'+icon('plus',16)+' Crear bracket</button></div>';
  }
  var teamsById = {}; teams.forEach(function(t){ teamsById[t.id]=t; });
  var comp = computeBracket(bracket);
  function teamLabel(id){ if(!id) return '—'; var t = teamsById[id]; return t ? t.name : '—'; }
  function isOwn(id){ return !!(id && bracket.ownTeamId===id); }

  var boxes = '', lines = [], dots = [], maxX = 0, maxY = 0;
  function addTop(y){ return y + BRK_TOP; }
  function pushLabel(text, x, y){
    boxes += '<div class="roundlabel" style="left:'+x+'px;top:'+y+'px;width:'+BRK_W+'px">'+esc(text)+'</div>';
  }
  function pushMatchupBox(m, x, y){
    var style = 'left:'+x+'px;top:'+y+'px;width:'+BRK_W+'px';
    var html;
    if(!m){
      html = '<div class="matchup" style="'+style+'"><div class="mempty">Esperando clasificados</div></div>';
    } else {
      var tally = legsTally(m.legs);
      var showScore = tally.played>0;
      var tapAttr = (m.teamA && m.teamB) ? ' onclick="openBracketMatch(\''+fase.id+'\',\''+m.key+'\')" style="'+style+';cursor:pointer"' : ' style="'+style+'"';
      var rowA = '<div class="mrow"><div class="mteam'+(m.winnerId && m.winnerId===m.teamA?' win':'')+(isOwn(m.teamA)?' me':'')+'">'+esc(teamLabel(m.teamA))+'</div>'+(showScore?'<div class="mscore'+(m.winnerId===m.teamA?' win':'')+'">'+tally.wa+'</div>':'')+'</div>';
      var rowB = '<div class="mrow"><div class="mteam'+(m.winnerId && m.winnerId===m.teamB?' win':'')+(isOwn(m.teamB)?' me':'')+'">'+esc(teamLabel(m.teamB))+'</div>'+(showScore?'<div class="mscore'+(m.winnerId===m.teamB?' win':'')+'">'+tally.wb+'</div>':'')+'</div>';
      html = '<div class="matchup"'+tapAttr+'>'+rowA+rowB+'</div>';
    }
    boxes += html;
    if(x+BRK_W>maxX) maxX = x+BRK_W;
    if(y+BRK_H>maxY) maxY = y+BRK_H;
  }
  // Traza el tramo entre una ronda de cruces (childX/childYs/childMatchups) y
  // la ronda o cruce del que dependen (parentX/parentYs): dos "patas"
  // horizontales desde cada hijo hasta un punto medio, una vertical partida
  // en dos (una mitad por cada hijo) y una "espuela" hacia el cruce padre.
  // Cada tramo se pinta en naranja SOLO si ese hijo concreto ya tiene
  // ganador decidido -- así se ve, en cualquier momento del torneo, qué
  // equipos ya han certificado su paso de ronda, sin esperar a que el
  // bracket entero esté terminado. mirror=true cuando la ronda "crece" hacia
  // la izquierda (lado B de un bracket a 2 lados).
  function connectRound(childX, childYs, childMatchups, parentX, parentYs, mirror){
    for(var i=0;i<parentYs.length;i++){
      var m0 = childMatchups[2*i], m1 = childMatchups[2*i+1];
      var y0 = childYs[2*i] + BRK_H/2, y1 = childYs[2*i+1] + BRK_H/2;
      var spurY = parentYs[i] + BRK_H/2;
      var childEdgeX = mirror ? childX : (childX + BRK_W);
      var xMid = mirror ? (childX - BRK_GAPX/2) : (childX + BRK_W + BRK_GAPX/2);
      var parentEdgeX = mirror ? (parentX + BRK_W) : parentX;
      var win0 = !!(m0 && m0.winnerId), win1 = !!(m1 && m1.winnerId);
      lines.push({x1:childEdgeX,y1:y0,x2:xMid,y2:y0,win:win0});
      lines.push({x1:childEdgeX,y1:y1,x2:xMid,y2:y1,win:win1});
      lines.push({x1:xMid,y1:y0,x2:xMid,y2:spurY,win:win0});
      lines.push({x1:xMid,y1:y1,x2:xMid,y2:spurY,win:win1});
      lines.push({x1:xMid,y1:spurY,x2:parentEdgeX,y2:spurY,win:win0||win1});
      dots.push({x:xMid,y:spurY,win:win0||win1});
    }
  }
  function champBoxHtml(x, y, championId, win){
    if(x+BRK_W>maxX) maxX = x+BRK_W;
    if(y+BRK_H>maxY) maxY = y+BRK_H;
    return '<div class="matchup champbox'+(win?' win':'')+'" style="left:'+x+'px;top:'+y+'px;width:'+BRK_W+'px;height:'+BRK_H+'px">'+
      (win ? '<div class="champbody">'+icon('star',14)+'<div class="name">'+esc(teamLabel(championId))+'</div></div>' : '<div class="mempty">Por decidir</div>')+
      '</div>';
  }

  var r, i;
  if(comp.mode==='2sides'){
    var RA = comp.sideA.length, RB = comp.sideB.length;
    var ysA = bracketRoundYs(comp.sideA), ysB = bracketRoundYs(comp.sideB);
    var xFinal = BRK_PADX + RA*(BRK_W+BRK_GAPX);
    var xsA = [], xsB = [];
    for(r=0;r<RA;r++) xsA[r] = BRK_PADX + r*(BRK_W+BRK_GAPX);
    for(r=0;r<RB;r++) xsB[r] = xFinal + BRK_W + BRK_GAPX + (RB-1-r)*(BRK_W+BRK_GAPX);
    for(r=0;r<RA;r++){
      pushLabel(roundName(comp.sideA[r].length), xsA[r], 0);
      for(i=0;i<comp.sideA[r].length;i++) pushMatchupBox(comp.sideA[r][i], xsA[r], addTop(ysA[r][i]));
    }
    for(r=0;r<RB;r++){
      pushLabel(roundName(comp.sideB[r].length), xsB[r], 0);
      for(i=0;i<comp.sideB[r].length;i++) pushMatchupBox(comp.sideB[r][i], xsB[r], addTop(ysB[r][i]));
    }
    for(r=0;r<RA-1;r++) connectRound(xsA[r], ysA[r].map(addTop), comp.sideA[r], xsA[r+1], ysA[r+1].map(addTop), false);
    for(r=0;r<RB-1;r++) connectRound(xsB[r], ysB[r].map(addTop), comp.sideB[r], xsB[r+1], ysB[r+1].map(addTop), true);
    var finalY;
    if(RA>0 && RB>0) finalY = (addTop(ysA[RA-1][0])+BRK_H/2 + addTop(ysB[RB-1][0])+BRK_H/2)/2 - BRK_H/2;
    else if(RA>0) finalY = addTop(ysA[RA-1][0]);
    else if(RB>0) finalY = addTop(ysB[RB-1][0]);
    else finalY = BRK_TOP;
    pushLabel('Final', xFinal, 0);
    pushMatchupBox(comp.final[0], xFinal, finalY);
    if(RA>0){
      var winA = !!(comp.sideA[RA-1][0] && comp.sideA[RA-1][0].winnerId);
      var cA = addTop(ysA[RA-1][0]) + BRK_H/2, xMidA = xsA[RA-1] + BRK_W + BRK_GAPX/2;
      lines.push({x1:xsA[RA-1]+BRK_W,y1:cA,x2:xMidA,y2:cA,win:winA});
      lines.push({x1:xMidA,y1:cA,x2:xMidA,y2:finalY+BRK_H/2,win:winA});
      lines.push({x1:xMidA,y1:finalY+BRK_H/2,x2:xFinal,y2:finalY+BRK_H/2,win:winA});
    }
    if(RB>0){
      var winB = !!(comp.sideB[RB-1][0] && comp.sideB[RB-1][0].winnerId);
      var cB = addTop(ysB[RB-1][0]) + BRK_H/2, xMidB = xsB[RB-1] - BRK_GAPX/2;
      lines.push({x1:xsB[RB-1],y1:cB,x2:xMidB,y2:cB,win:winB});
      lines.push({x1:xMidB,y1:cB,x2:xMidB,y2:finalY+BRK_H/2,win:winB});
      lines.push({x1:xMidB,y1:finalY+BRK_H/2,x2:xFinal+BRK_W,y2:finalY+BRK_H/2,win:winB});
    }
    var champWin2 = !!comp.championId;
    var champX2 = xFinal, champY2 = finalY + BRK_H + BRK_GAPX;
    lines.push({x1:xFinal+BRK_W/2,y1:finalY+BRK_H,x2:xFinal+BRK_W/2,y2:champY2,win:champWin2});
    pushLabel('Campeón', champX2, champY2-18);
    boxes += champBoxHtml(champX2, champY2, comp.championId, champWin2);
  } else {
    var rounds = comp.rounds, R = rounds.length, ys = bracketRoundYs(rounds), xs = [];
    for(r=0;r<R;r++) xs[r] = BRK_PADX + r*(BRK_W+BRK_GAPX);
    for(r=0;r<R;r++){
      pushLabel(roundName(rounds[r].length), xs[r], 0);
      for(i=0;i<rounds[r].length;i++) pushMatchupBox(rounds[r][i], xs[r], addTop(ys[r][i]));
    }
    for(r=0;r<R-1;r++) connectRound(xs[r], ys[r].map(addTop), rounds[r], xs[r+1], ys[r+1].map(addTop), false);
    if(R>0){
      var finalM = rounds[R-1][0];
      var champWin = !!(finalM && finalM.winnerId);
      var champX = xs[R-1] + BRK_W + BRK_GAPX, champY = addTop(ys[R-1][0]);
      lines.push({x1:xs[R-1]+BRK_W,y1:champY+BRK_H/2,x2:champX,y2:champY+BRK_H/2,win:champWin});
      pushLabel('Campeón', champX, 0);
      boxes += champBoxHtml(champX, champY, comp.championId, champWin);
    }
  }

  var svg = '<svg style="position:absolute;top:0;left:0" width="'+maxX+'" height="'+maxY+'">';
  lines.forEach(function(l){ svg += '<line x1="'+l.x1+'" y1="'+l.y1+'" x2="'+l.x2+'" y2="'+l.y2+'" stroke="'+(l.win?'var(--accent)':'var(--border)')+'" stroke-width="'+(l.win?2.5:2)+'"/>'; });
  dots.forEach(function(d){ svg += '<circle cx="'+d.x+'" cy="'+d.y+'" r="2.5" fill="'+(d.win?'var(--accent)':'var(--border)')+'"/>'; });
  svg += '</svg>';

  var sig = teams.length+'-'+(comp.mode==='2sides'?2:1)+'-'+JSON.stringify(Object.keys(bracket.results||{}));
  var h = '<div class="bracketlegend">'+icon('star',10)+' nuestro equipo &middot; toca un cruce para ver/editar el resultado</div>';
  h += '<div style="display:flex;justify-content:flex-end;margin:-2px 0 8px">'+
    '<div style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent);padding:5px 4px;cursor:pointer" onclick="openBracketTeamsEdit(\''+fase.id+'\')">'+icon('pencil',13)+'<span>Editar equipos / favorito</span></div>'+
    '</div>';
  h += '<div class="bracketwrap"><div class="bracketzoomcontrols">'+
    '<button class="zbtn" onclick="bracketZoomStep(\''+fase.id+'\',1)">+</button>'+
    '<button class="zbtn" onclick="bracketZoomFitNow(\''+fase.id+'\')">'+icon('history',13)+'</button>'+
    '<button class="zbtn" onclick="bracketZoomStep(\''+fase.id+'\',-1)">−</button>'+
    '</div>'+
    '<div class="bracketzoomouter" id="bz-'+fase.id+'" data-fase="'+fase.id+'">'+
      '<div class="bracketzoominner" data-sig="'+esc(sig)+'" style="width:'+maxX+'px;height:'+maxY+'px">'+svg+boxes+'</div>'+
    '</div></div>';
  return h;
}
function applyBracketTransform(outer, inner, st){
  inner.style.transformOrigin = '0 0';
  inner.style.transform = 'translate('+st.tx+'px,'+st.ty+'px) scale('+st.scale+')';
}
function bracketZoomStep(faseId, dir){
  var outer = document.getElementById('bz-'+faseId);
  var inner = outer && outer.querySelector('.bracketzoominner');
  var st = bracketZoomState[faseId];
  if(!outer || !inner || !st) return;
  var newScale = Math.max(0.25, Math.min(3, st.scale * (dir>0?1.25:0.8)));
  var cx = outer.clientWidth/2, cy = outer.clientHeight/2;
  var factor = newScale/st.scale;
  st.tx = cx - (cx - st.tx)*factor;
  st.ty = cy - (cy - st.ty)*factor;
  st.scale = newScale;
  applyBracketTransform(outer, inner, st);
}
function bracketZoomFitNow(faseId){
  var st = bracketZoomState[faseId];
  if(st) st.fitted = false;
  setupBracketZoom();
}
// Se llama tras cada render(): calcula (una vez por "forma" de bracket) el
// zoom que hace que se vea entero, y engancha pellizcar-para-ampliar / arrastrar
// con los dedos SIN pasar por render() en cada movimiento (para que no vaya a
// tirones, igual que se evitó el long-press en la gráfica de tendencia).
function setupBracketZoom(){
  var outers = document.querySelectorAll('.bracketzoomouter');
  outers.forEach(function(outer){
    var faseId = outer.getAttribute('data-fase');
    var inner = outer.querySelector('.bracketzoominner');
    if(!inner) return;
    var st = bracketZoomState[faseId] || (bracketZoomState[faseId] = { scale:1, tx:0, ty:0, fitted:false, sig:'' });
    var sig = inner.getAttribute('data-sig') || '';
    if(!st.fitted || st.sig !== sig){
      inner.style.transform = 'none';
      var r = inner.getBoundingClientRect();
      var orect = outer.getBoundingClientRect();
      var iw = r.width || 1, ih = r.height || 1;
      var ow = orect.width || 1, oh = orect.height || 1;
      var fit = Math.min(ow/iw, oh/ih);
      if(!isFinite(fit) || fit<=0) fit = 1;
      fit = Math.max(0.2, Math.min(fit, 2.5));
      st.scale = fit; st.tx = (ow - iw*fit)/2; st.ty = (oh - ih*fit)/2; st.fitted = true; st.sig = sig;
    }
    applyBracketTransform(outer, inner, st);
    attachBracketGestures(outer, inner, st);
  });
}
function attachBracketGestures(outer, inner, st){
  if(outer._bzWired) return; // los listeners no dependen del contenido -- se enganchan una vez por elemento
  outer._bzWired = true;
  var pointers = {};
  var mode = null;
  var startDist=1, startScale=1, startTx=0, startTy=0;
  var moved = false;
  outer.addEventListener('pointerdown', function(e){
    pointers[e.pointerId] = { x:e.clientX, y:e.clientY, startX:e.clientX, startY:e.clientY };
    try{ outer.setPointerCapture(e.pointerId); }catch(ex){}
    moved = false;
    var ids = Object.keys(pointers);
    if(ids.length===1){
      mode='pan'; startTx=st.tx; startTy=st.ty;
    } else if(ids.length===2){
      mode='pinch';
      var p = ids.map(function(id){ return pointers[id]; });
      startDist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y) || 1;
      startScale = st.scale; startTx = st.tx; startTy = st.ty;
    }
  });
  outer.addEventListener('pointermove', function(e){
    if(!pointers[e.pointerId]) return;
    pointers[e.pointerId].x = e.clientX; pointers[e.pointerId].y = e.clientY;
    var ids = Object.keys(pointers);
    if(mode==='pan' && ids.length===1){
      var p = pointers[ids[0]];
      var dx = e.clientX - p.startX, dy = e.clientY - p.startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
      st.tx = startTx + dx; st.ty = startTy + dy;
      applyBracketTransform(outer, inner, st);
    } else if(mode==='pinch' && ids.length===2){
      moved = true;
      var pts = ids.map(function(id){ return pointers[id]; });
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      var scale = Math.max(0.2, Math.min(3, startScale * (dist/startDist)));
      var mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      var rect = outer.getBoundingClientRect();
      var mx = mid.x - rect.left, my = mid.y - rect.top;
      var factor = scale/startScale;
      st.tx = mx - (mx - startTx)*factor;
      st.ty = my - (my - startTy)*factor;
      st.scale = scale;
      applyBracketTransform(outer, inner, st);
    }
  });
  function endPointer(e){
    delete pointers[e.pointerId];
    var ids = Object.keys(pointers);
    if(ids.length===1){
      mode='pan'; startTx=st.tx; startTy=st.ty;
      var id=ids[0]; pointers[id].startX=pointers[id].x; pointers[id].startY=pointers[id].y;
    } else if(ids.length===0){
      mode=null;
    }
  }
  outer.addEventListener('pointerup', endPointer);
  outer.addEventListener('pointercancel', endPointer);
  outer.addEventListener('pointerleave', function(e){ if(pointers[e.pointerId]) endPointer(e); });
  outer.addEventListener('click', function(e){
    if(moved){ e.stopPropagation(); e.preventDefault(); moved=false; }
  }, true);
}

/* ---------- Estadísticas (agregadas) ---------- */
var statsViewMode = 'players';
var statsFilterMode = 'todas';
var statsPeriodMode = 'all'; // 'all' | 'month' | 'week'
var statsPeriodKey = null;   // 'yyyy-mm' o el lunes de la semana 'yyyy-mm-dd'
var statsFilterSheetOpen = false;
function setStatsView(m){ statsViewMode = m; render(); }
function setStatsFilter(m){ statsFilterMode = m; render(); }
function setStatsPeriodMode(m){ statsPeriodMode = m; statsPeriodKey = null; render(); }
function setStatsPeriodKey(k){ statsPeriodKey = k; render(); }
function openStatsFilters(){ statsFilterSheetOpen = true; render(); }
function closeStatsFilters(){ statsFilterSheetOpen = false; render(); }
function statsFiltersActive(){ return statsFilterMode!=='todas' || statsPeriodMode!=='all'; }
// Igual que rankFilterSummaryLabel() pero para el filtro de Estadísticas
// (competición + periodo, con la etiqueta del mes/semana concreto si aplica).
function statsFilterSummaryLabel(){
  var parts = [];
  var compLabels = {liga:'Liga', torneo:'Torneo', amistoso:'Amistosos'};
  if(statsFilterMode!=='todas') parts.push(compLabels[statsFilterMode]||statsFilterMode);

function weekStart(d){
  var dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = (dt.getDay()+6)%7; // lunes=0 ... domingo=6
  dt.setDate(dt.getDate()-day);
  return dt;
}
function weekKeyFor(d){ var ws = weekStart(d); return ws.getFullYear()+'-'+pad2(ws.getMonth()+1)+'-'+pad2(ws.getDate()); }
function weekLabelFromKey(key){
  var parts = key.split('-');
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  var monthLabel = d.toLocaleDateString('es-ES', {month:'long'});
  return 'Semana del '+d.getDate()+' de '+monthLabel;
}
// Meses o semanas (según el modo) en los que hay al menos un partido, del más
// reciente al más antiguo -- igual que rankingMonthsAvailable() pero también
// admite semanas, para el filtro de la pantalla Estadísticas.
function statsPeriodsAvailable(mode){
  var set = {};
  S.games.forEach(function(g){
    var d = matchDateObj(g);
    var key = mode==='week' ? weekKeyFor(d) : monthKey(d);
    set[key] = true;
  });
  return Object.keys(set).sort().reverse().map(function(key){
    return {key:key, label: mode==='week' ? weekLabelFromKey(key) : monthLabelFromKey(key)};
  });
}
function filteredStatsGames(){
  return S.games.filter(function(g){
    if(statsFilterMode!=='todas' && (g.kind||'liga')!==statsFilterMode) return false;
    if(statsPeriodMode!=='all' && statsPeriodKey){
      var d = matchDateObj(g);
      var key = statsPeriodMode==='week' ? weekKeyFor(d) : monthKey(d);
      if(key!==statsPeriodKey) return false;
    }
    return true;
  });
}

/* ---------- tendencia de tiro (Estadísticas -> Equipo) ---------- */
var trendMonthKey = 'all';        // 'all' o 'yyyy-mm' -- filtra los partidos de la tarjeta de tendencia de equipo
var trendSelectedIdx = null;      // partido seleccionado en esa gráfica (índice sobre la lista ya filtrada/ordenada)
var zonePopup = null;             // {ring,id,label} para una zona del mapa, o {kind:'ft',label:'Tiros libres'} -- null = cerrado
var zoneTrendMonthKey = 'all';
var zoneTrendSelectedIdx = null;
function setTrendMonth(k){ trendMonthKey = k; trendSelectedIdx = null; render(); }
function setTrendIdx(i){ trendSelectedIdx = i; render(); }
function openZonePopup(ring, id, label){ zonePopup = {ring:ring, id:id, label:label}; zoneTrendMonthKey='all'; zoneTrendSelectedIdx=null; render(); }
function openFtPopup(){ zonePopup = {kind:'ft', label:'Tiros libres'}; zoneTrendMonthKey='all'; zoneTrendSelectedIdx=null; render(); }
function closeZonePopup(){ zonePopup = null; render(); }
function setZoneTrendMonth(k){ zoneTrendMonthKey = k; zoneTrendSelectedIdx = null; render(); }
function setZoneTrendIdx(i){ zoneTrendSelectedIdx = i; render(); }
// Meses con al menos un partido dentro de una lista de partidos dada (para los
// chips de mes de las tarjetas de tendencia -- igual criterio que rankingMonthsAvailable
// pero sobre un subconjunto, no siempre toda la temporada).
function monthsAvailableIn(games){
  var set = {};
  games.forEach(function(g){ set[monthKey(matchDateObj(g))] = true; });
  return Object.keys(set).sort().reverse().map(function(key){ return {key:key, label:monthLabelFromKey(key)}; });
}
function gamesSortedByDate(games){
  return games.slice().sort(function(a,b){ return matchDateObj(a) - matchDateObj(b); });
}
function shortDateLabel(g){ var d = matchDateObj(g); return d.getDate()+'/'+(d.getMonth()+1); }
function jsAttr(s){ return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function trendGamesFiltered(games, key){
  if(key==='all') return games;
  return games.filter(function(g){ return monthKey(matchDateObj(g))===key; });
}
// % de tiro del EQUIPO en un partido para 'ft' (tiro libre), '2pt' o '3pt'.
// Nota: teamAggregates().fgM/fgA son TODOS los tiros de campo (2+3 juntos), así
// que los 2 puntos "puros" son fgM-p3M / fgA-p3A (p3M/p3A son solo los triples).
function teamGameShotPct(g, kind){
  var ta = teamAggregates(g,'team');
  var m,a;
  if(kind==='ft'){ m=ta.ftM; a=ta.ftA; }
  else if(kind==='3pt'){ m=ta.p3M; a=ta.p3A; }
  else { m=ta.fgM-ta.p3M; a=ta.fgA-ta.p3A; }
  return a>0 ? {m:m, a:a, pct:Math.round(1000*m/a)/10} : null;
}
// % de tiro de UNA JUGADORA en un partido para 'ft'/'2pt'/'3pt' (misma idea
// que teamGameShotPct, pero solo con los tiros de esa jugadora en ese partido).
function playerGameShotPct(g, dorsal, name, kind){
  var p = (g.roster||[]).filter(function(rp){ return rp.dorsal===dorsal && rp.name===name; })[0];
  if(!p) return null;
  var st = playerStats(g, p.id);
  var m,a;
  if(kind==='ft'){ m=st.ftm; a=st.fta; }
  else if(kind==='3pt'){ m=st.fg3m; a=st.fg3a; }
  else { m=st.fg2m; a=st.fg2a; }
  return a>0 ? {m:m, a:a, pct:Math.round(1000*m/a)/10} : null;
}
var playerTrendMonthKey = 'all';
var playerTrendSelectedIdx = null;
function setPlayerTrendMonth(k){ playerTrendMonthKey = k; playerTrendSelectedIdx = null; render(); }
function setPlayerTrendIdx(i){ playerTrendSelectedIdx = i; render(); }
// Tarjeta "Tendencia de tiro" de una jugadora (mismo formato que la de
// equipo, pero filtrada a sus tiros).
function renderPlayerTrendCard(games, dorsal, name){
  var months = monthsAvailableIn(games);
  var sorted = gamesSortedByDate(trendGamesFiltered(games, playerTrendMonthKey));
  var series = [
    {color:'var(--reb)', label:'TL', dataFn:function(g){ return playerGameShotPct(g,dorsal,name,'ft'); }},
    {color:'var(--accent)', label:'2PT', dataFn:function(g){ return playerGameShotPct(g,dorsal,name,'2pt'); }},
    {color:'var(--create)', label:'3PT', dataFn:function(g){ return playerGameShotPct(g,dorsal,name,'3pt'); }}
  ];
  var h = '<div class="trendcard">';
  h += '<div class="legend"><span><i style="background:var(--reb)"></i>Tiro libre</span><span><i style="background:var(--accent)"></i>2 puntos</span><span><i style="background:var(--create)"></i>3 puntos</span></div>';
  h += '<div class="chipswrap"><div class="fasechips">'+
    '<div class="chip'+(playerTrendMonthKey==='all'?' on':'')+'" onclick="setPlayerTrendMonth(\'all\')">Por partido</div>'+
    months.map(function(m){ return '<div class="chip'+(playerTrendMonthKey===m.key?' on':'')+'" onclick="setPlayerTrendMonth(\''+m.key+'\')">'+esc(m.label)+'</div>'; }).join('')+
    '</div><div class="fadeedge"></div></div>';
  if(!sorted.length){
    h += '<div class="empty" style="padding:16px 0">No hay tiros registrados en este periodo.</div>';
  } else {
    h += buildTrendChartSvg(sorted, series, playerTrendSelectedIdx, {selectFn:'setPlayerTrendIdx'});
    h += '<div class="charttip">Toca un partido en la gráfica para ver los datos exactos</div>';
  }
  h += '</div>';
  return {title:'Tendencia de tiro', content: h};
}
// % de tiro de una zona concreta del mapa (o de tiros libres) en un partido.
function zoneGameStat(g, zp){
  if(zp.kind==='ft'){
    var ta = teamAggregates(g,'team');
    return ta.ftA>0 ? {m:ta.ftM, a:ta.ftA, pct:Math.round(1000*ta.ftM/ta.ftA)/10} : null;
  }
  var st = teamZoneStats([g])[zp.ring+':'+zp.id];
  return (st && st.a>0) ? {m:st.m, a:st.a, pct:Math.round(1000*st.m/st.a)/10} : null;
}
// Construye el SVG de una gráfica de tendencia (1 o varias series de %, una por
// partido). Se reutiliza tanto para la tarjeta de equipo (3 series: TL/2PT/3PT)
// como para el popup de una zona/"Tiros libres" (1 sola serie).
function buildTrendChartSvg(games, series, selectedIdx, opts){
  opts = opts || {};
  var W = 320, H = opts.height || 175;
  var yTop = 10, yBottom = H-25, xLeft = 30, xRight = W-10;
  var n = games.length;
  function xFor(i){ return n<=1 ? (xLeft+xRight)/2 : xLeft + i*(xRight-xLeft)/(n-1); }
  function yFor(p){ return yBottom - (p/100)*(yBottom-yTop); }
  var svg = '';
  svg += '<line x1="'+xLeft+'" y1="'+yTop+'" x2="'+xLeft+'" y2="'+yBottom+'" stroke="var(--border)" stroke-width="1"/>';
  svg += '<line x1="'+xLeft+'" y1="'+yBottom+'" x2="'+xRight+'" y2="'+yBottom+'" stroke="var(--border)" stroke-width="1"/>';
  svg += '<text x="'+(xLeft-6)+'" y="'+(yTop+4)+'" text-anchor="end" font-size="8" fill="var(--text-dim)" font-family="Manrope">100%</text>';
  svg += '<text x="'+(xLeft-6)+'" y="'+(yFor(50)+3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--text-dim)" font-family="Manrope">50%</text>';
  svg += '<text x="'+(xLeft-6)+'" y="'+(yBottom+3)+'" text-anchor="end" font-size="8" fill="var(--text-dim)" font-family="Manrope">0%</text>';
  if(!n) return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="margin-top:6px">'+svg+'</svg>';
  if(selectedIdx==null || selectedIdx<0 || selectedIdx>=n) selectedIdx = n-1;
  series.forEach(function(s){
    var pts = games.map(function(g,i){ var d = s.dataFn(g); return d ? {i:i, x:xFor(i), y:yFor(d.pct)} : null; });
    var run = [];
    function flush(){
      if(run.length>=2) svg += '<polyline points="'+run.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
      run = [];
    }
    pts.forEach(function(p){ if(p) run.push(p); else flush(); });
    flush();
    pts.forEach(function(p){
      if(!p) return;
      var isSel = p.i===selectedIdx;
      svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isSel?3.6:2.6)+'" fill="'+s.color+'"'+(isSel?' stroke="var(--bg)" stroke-width="1.5"':'')+'/>';
    });
  });
  // columnas invisibles para poder tocar cada partido y elegirlo
  games.forEach(function(g,i){
    var cx = xFor(i);
    var colW = n>1 ? (xRight-xLeft)/(n-1) : (xRight-xLeft);
    var left = Math.max(0, cx-colW/2), w = Math.min(W, cx+colW/2)-left;
    svg += '<rect x="'+left.toFixed(1)+'" y="0" width="'+w.toFixed(1)+'" height="'+H+'" fill="transparent" onclick="'+(opts.selectFn||'setTrendIdx')+'('+i+')"/>';
  });
  var selX = xFor(selectedIdx);
  var selGame = games[selectedIdx];
  var selLabel = opts.labelFn ? opts.labelFn(selGame) : ('vs '+esc(selGame.rivalName||'Rival')+' &middot; '+shortDateLabel(selGame));
  svg += '<line x1="'+selX.toFixed(1)+'" y1="'+(yTop-2)+'" x2="'+selX.toFixed(1)+'" y2="'+yBottom+'" stroke="var(--text-dim)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>';
  svg += '<text x="'+selX.toFixed(1)+'" y="'+(yBottom+14)+'" text-anchor="middle" font-size="8" fill="var(--text-dim)" font-family="Manrope">'+selLabel+'</text>';
  var lines = series.map(function(s){
    var d = s.dataFn(selGame);
    return {color:s.color, label:s.label, text: d ? (Math.round(d.pct)+'% ('+d.m+'/'+d.a+')') : 'Sin tiros'};
  });
  if(lines.length===1){
    var bw = 96, bh = 24;
    var bx = (selX+8+bw>W) ? Math.max(4, selX-8-bw) : selX+8;
    svg += '<rect x="'+bx.toFixed(1)+'" y="6" width="'+bw+'" height="'+bh+'" rx="7" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.2"/>';
    svg += '<text x="'+(bx+bw/2).toFixed(1)+'" y="21" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--text)" font-family="Manrope">'+lines[0].text+'</text>';
  } else {
    var bw2 = 118, bh2 = 14+lines.length*14;
    var bx2 = (selX+8+bw2>W) ? Math.max(4, selX-8-bw2) : selX+8;
    svg += '<rect x="'+bx2.toFixed(1)+'" y="6" width="'+bw2+'" height="'+bh2+'" rx="8" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.2"/>';
    lines.forEach(function(l,i){
      var cy = 18+i*14;
      svg += '<circle cx="'+(bx2+11).toFixed(1)+'" cy="'+(cy-3)+'" r="3" fill="'+l.color+'"/>';
      svg += '<text x="'+(bx2+19).toFixed(1)+'" y="'+cy+'" font-size="9" font-weight="700" fill="var(--text)" font-family="Manrope">'+esc(l.label)+' '+l.text+'</text>';
    });
  }
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="margin-top:6px">'+svg+'</svg>';
}

/* ---------- estadísticas por periodo (Estadísticas -> Equipo) ---------- */
// Agrega, sobre la lista de partidos ya filtrada (competición/mes/semana),
// el % de los puntos propios que vienen de cada periodo (sexto/cuarto/...) y
// el % de partidos en los que se gana/empata/pierde ese periodo. Usa el
// mayor periodsCount visto entre los partidos filtrados, así funciona igual
// si en algún momento se han jugado partidos con distinto número de periodos.
function aggregatePeriodStats(games){
  var maxP = 0, periodLabel = 'Periodo';
  games.forEach(function(g){
    if(g.periodsCount>maxP) maxP = g.periodsCount;
    if(g.periodLabel) periodLabel = g.periodLabel;
  });
  var pointsByPeriod = {}, resultsByPeriod = {}, totalTeamPoints = 0;
  for(var p=1;p<=maxP;p++){ pointsByPeriod[p]=0; resultsByPeriod[p]={win:0,tie:0,loss:0,total:0}; }
  games.forEach(function(g){
    var ps = periodScores(g);
    for(var p2=1;p2<=g.periodsCount;p2++){
      var sc = ps[p2] || {team:0,rival:0};
      pointsByPeriod[p2] = (pointsByPeriod[p2]||0) + sc.team;
      totalTeamPoints += sc.team;
      var r = resultsByPeriod[p2] || (resultsByPeriod[p2]={win:0,tie:0,loss:0,total:0});
      r.total++;
      if(sc.team>sc.rival) r.win++; else if(sc.team<sc.rival) r.loss++; else r.tie++;
    }
  });
  var points = [];
  for(var p3=1;p3<=maxP;p3++){
    var pts = pointsByPeriod[p3]||0;
    points.push({period:p3, pts:pts, pct: totalTeamPoints>0 ? Math.round(1000*pts/totalTeamPoints)/10 : 0});
  }
  var results = [];
  for(var p4=1;p4<=maxP;p4++){
    var r2 = resultsByPeriod[p4] || {win:0,tie:0,loss:0,total:0};
    results.push({period:p4, total:r2.total,
      winPct: r2.total>0 ? Math.round(100*r2.win/r2.total) : 0,
      tiePct: r2.total>0 ? Math.round(100*r2.tie/r2.total) : 0,
      lossPct: r2.total>0 ? Math.round(100*r2.loss/r2.total) : 0});
  }
  return {maxPeriods:maxP, periodLabel:periodLabel, points:points, results:results, totalTeamPoints:totalTeamPoints};
}

/* ---------- carrusel genérico de N páginas (arrastre táctil + puntos) ----------
   Un mismo componente para todos los carruseles de la app (radar/mapas de
   jugadora, mapas de equipo, tendencia por sexto...). Cada carrusel tiene un
   id propio (cid) y se acuerda de en qué página está en swipeState[cid]. La
   lógica de arrastre es la misma que tenía el carrusel original de 2 páginas
   (radar/mapa de tiro), generalizada a N: un desplazamiento de una página
   siempre equivale a -100/N puntos de translateX sobre una pista de ancho
   N*100%, así que da igual cuántas páginas tenga. */
var swipeState = {}; // carouselId -> índice de página actual (0-based)
function getSwipePage(cid, count){
  var p = swipeState[cid];
  if(p==null) p = 0;
  return Math.max(0, Math.min(count-1, p));
}
function setSwipePage(cid, i){ swipeState[cid] = i; render(); }
function swipeCarouselHtml(cid, pages){
  // pages: [{title, hint?, content: htmlString}, ...] en orden. El título (y
  // el hint, si lo hay) de la página actual se muestran en una cabecera fija
  // arriba de la tarjeta -- junto con los puntos del paginador -- para que se
  // vean sin necesidad de hacer scroll hasta el final de la tarjeta.
  var n = pages.length;
  var page = getSwipePage(cid, n);
  var stepPct = 100/n;
  var cur = pages[page] || {};
  var h = '<div class="swipecard">';
  h += '<div class="swipehead"><div class="swipeheadtext"><span class="swipetitle">'+(cur.title||'')+'</span>'+(cur.hint?'<span class="swipehint">'+cur.hint+'</span>':'')+'</div>';
  if(n>1){
    h += '<div class="swipedots">';
    pages.forEach(function(p,i){ h += '<div class="swipedot'+(i===page?' on':'')+'" onclick="setSwipePage(\''+cid+'\','+i+')"></div>'; });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="swipeviewport" ontouchstart="swSwipeStart(event,\''+cid+'\','+n+')" ontouchmove="swSwipeMove(event)" ontouchend="swSwipeEnd()" ontouchcancel="swSwipeEnd()">';
  h += '<div class="swipetrack" id="swTrack-'+cid+'" style="width:'+(n*100)+'%;transform:translateX(-'+(page*stepPct)+'%)">';
  pages.forEach(function(p){ h += '<div class="swipepage" style="width:'+stepPct+'%">'+p.content+'</div>'; });
  h += '</div></div>';
  h += '</div>';
  return h;
}
var swActiveId = null, swPages = 1, swStartX = null, swStartY = null, swDeltaX = 0, swDragging = false, swAxis = null;
function swSwipeStart(ev, cid, n){
  swActiveId = cid; swPages = n;
  var t = ev.touches[0];
  swStartX = t.clientX; swStartY = t.clientY;
  swDeltaX = 0; swAxis = null; swDragging = true;
}
function swSwipeMove(ev){
  if(!swDragging) return;
  var t = ev.touches[0];
  var dx = t.clientX - swStartX;
  var dy = t.clientY - swStartY;
  if(!swAxis && (Math.abs(dx)>8 || Math.abs(dy)>8)){
    swAxis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(swAxis!=='x') return; // arrastre vertical: dejar que la hoja haga scroll normal
  ev.preventDefault();
  swDeltaX = dx;
  var track = document.getElementById('swTrack-'+swActiveId);
  if(track){
    var vp = track.parentElement;
    var stepPct = 100/swPages;
    var page = getSwipePage(swActiveId, swPages);
    var base = -page*stepPct;
    var overdrag = stepPct*0.16;
    var pct = base + (dx / vp.offsetWidth * stepPct);
    pct = Math.max(-(swPages-1)*stepPct - overdrag, Math.min(overdrag, pct));
    track.style.transition = 'none';
    track.style.transform = 'translateX('+pct+'%)';
  }
}
function swSwipeEnd(){
  if(!swDragging) return;
  swDragging = false;
  if(swAxis==='x'){
    var threshold = 40;
    var page = getSwipePage(swActiveId, swPages);
    if(swDeltaX < -threshold && page < swPages-1) page++;
    else if(swDeltaX > threshold && page > 0) page--;
    swipeState[swActiveId] = page;
    render();
  }
  swDeltaX = 0; swAxis = null;
}

/* ---------- radar de jugadora ---------- */
var playerRadarFilter = 'todas';
function openPlayerRadar(key, from){

function setPlayerRadarFilter(m){ playerRadarFilter = m; render(); }
function filteredGamesForPlayerRadar(){
  return S.games.filter(function(g){ return playerRadarFilter==='todas' || (g.kind||'liga')===playerRadarFilter; });
}
function radarPoint(cx,cy,R,i,n,ratio){
  var angle = (-90 + i*(360/n)) * Math.PI/180;
  var r = R * Math.max(0, Math.min(1, ratio));
  return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
}
function renderRadarSVG(axes, meVals, avgVals, warnKeys){
  warnKeys = warnKeys || [];
  var cx=150, cy=150, R=92, n=axes.length;
  var rings = [0.25,0.5,0.75,1];
  var wedgeHalf = (360/n)/2;
  // background tint behind any axis where "bigger" is actually worse (e.g. turnovers),
  // so a big spike there doesn't read as a strength at a glance
  var warnWedges = axes.map(function(ax,i){
    if(warnKeys.indexOf(ax.key)===-1) return '';
    var baseAngle = -90 + i*(360/n);
    var a1 = (baseAngle - wedgeHalf) * Math.PI/180, a2 = (baseAngle + wedgeHalf) * Math.PI/180;
    var x1 = cx + R*Math.cos(a1), y1 = cy + R*Math.sin(a1);
    var x2 = cx + R*Math.cos(a2), y2 = cy + R*Math.sin(a2);
    return '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+R+' '+R+' 0 0 1 '+x2+' '+y2+' Z" fill="var(--bad)" fill-opacity="0.12"/>';
  }).join('');
  var gridPolys = rings.map(function(f){
    var pts = axes.map(function(_,i){ return radarPoint(cx,cy,R,i,n,f).join(','); }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  var axisLines = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R,i,n,1);
    var warn = warnKeys.indexOf(ax.key)!==-1;
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+(warn?'var(--bad)':'var(--border)')+'" stroke-width="1"/>';
  }).join('');
  var labels = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R+22,i,n,1);
    var anchor = Math.abs(p[0]-cx)<4 ? 'middle' : (p[0]>cx?'start':'end');
    var warn = warnKeys.indexOf(ax.key)!==-1;
    return '<text x="'+p[0]+'" y="'+p[1]+'" fill="'+(warn?'var(--bad)':'var(--text-dim)')+'" font-size="10.5" font-weight="800" text-anchor="'+anchor+'" dominant-baseline="middle">'+ax.label+'</text>';
  }).join('');
  function poly(vals, extra){
    var pts = axes.map(function(ax,i){ return radarPoint(cx,cy,R,i,n,vals[i]).join(','); }).join(' ');
    return '<polygon points="'+pts+'" '+extra+'/>';
  }
  var avgPoly = poly(avgVals, 'fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-dasharray="4,3"');
  var mePoly = poly(meVals, 'fill="var(--accent)" fill-opacity="0.22" stroke="var(--accent)" stroke-width="2.5"');
  var meDots = axes.map(function(ax,i){
    var p = radarPoint(cx,cy,R,i,n,meVals[i]);
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="var(--accent)"/>';
  }).join('');
  return '<div style="width:100%;max-width:320px;aspect-ratio:1/1;margin:6px auto">'+
    '<svg viewBox="0 0 300 300" width="100%" height="100%" style="display:block">'+
    warnWedges+gridPolys+axisLines+avgPoly+mePoly+meDots+labels+'</svg></div>';
}
function renderPlayerStatLine(me){
  function row(l,label){ return '<div class="teamstatrow"><div class="tsval">'+l+'</div><div class="tslabel">'+label+'</div><div class="tsval right">—</div></div>'; }
  function pctRow(l,label){ return '<div class="teamstatrow pct"><div class="tsval">'+l+'</div><div class="tslabel">'+label+'</div><div class="tsval right">—</div></div>'; }
  var h = '<div class="teamstat-card">';
  h += '<div class="tsheadrow"><div class="tsteam">'+me.gp+' partidos</div><div class="tscaption">Totales de la jugadora</div><div class="tsteam right"></div></div>';
  h += row(me.pts,'Puntos');
  h += row((me.fg2m+me.fg3m)+'/'+(me.fg2a+me.fg3a), 'Tiros de campo');
  h += pctRow(me.fgpct, '% de tiros de campo');
  h += row(me.fg2m+'/'+me.fg2a, 'Tiros de 2');
  h += pctRow(me.fg2pct, '% de 2');
  h += row(me.fg3m+'/'+me.fg3a, 'Triples');
  h += pctRow(me.fg3pct, '% de triples');
  h += row(me.ftm+'/'+me.fta, 'Tiros libres');
  h += pctRow(me.ftpct, '% de tiros libres');
  h += '<div class="teamstat-divider"></div>';
  h += row(me.reb, 'Rebotes totales');
  h += row(me.rebO, 'Rebotes ofensivos');
  h += row(me.rebD, 'Rebotes defensivos');
  h += '<div class="teamstat-divider"></div>';
  h += row(me.ast,'Asistencias'); h += row(me.stl,'Balones robados'); h += row(me.blk,'Bloqueos'); h += row(me.to,'Balones perdidos'); h += row(me.foulC,'Faltas personales'); h += row(me.eff,'Eficiencia (EFF)');
  h += '</div>';
  return h;
}
function renderPlayerRadarPopup(){
  var games = filteredGamesForPlayerRadar();
  var list = aggregatePlayers(games);
  var key = S.routeParams.playerKey;
  var backTo = S.routeParams.from || 'stats';
  var me = list.filter(function(a){ return (a.dorsal+'|'+a.name)===key; })[0];
  var filterChips = '<div class="compsrow" style="padding-top:2px">'+
    ['todas','liga','torneo','amistoso'].map(function(f){
      var labels = {todas:'Todos', liga:'Liga', torneo:'Torneo', amistoso:'Amistosos'};
      return '<button class="chip'+(playerRadarFilter===f?' on':'')+'" onclick="setPlayerRadarFilter(\''+f+'\')">'+labels[f]+'</button>';
    }).join('')+'</div>';
  var h = '<div class="veilfull"><div class="sheet">';
  if(!me){
    var keyName = (key||'').split('|').slice(1).join('|') || 'Jugadora';
    h += '<div class="sheethead"><div><div class="shtitle">'+esc(keyName)+'</div></div><button class="iconbtn" onclick="go(\''+backTo+'\')">'+icon('x',15)+'</button></div>';
    h += '<div class="content">'+filterChips+'<div class="empty">No hay datos suficientes con este filtro.</div></div>';
    h += '</div></div>';
    return h;
  }
  // per-game averages for counting stats (fair comparison regardless of games played);
  // fg3pct/fg2pct/ftpct are already rates, shown as-is however many attempts they're built on
  var axes = [
    {key:'pts_pg', label:'PTS'}, {key:'to_pg', label:'PÉR'}, {key:'blk_pg', label:'TAP'},
    {key:'stl_pg', label:'ROB'}, {key:'ast_pg', label:'AST'}, {key:'reb_pg', label:'REB'},
    {key:'fg3pct', label:'3P%'}, {key:'fg2pct', label:'2P%'}, {key:'ftpct', label:'TL%'}
  ];
  var radarWarnKeys = ['to_pg']; // fewer turnovers is better -- flagged in red, not treated as a strength
  var maxes = axes.map(function(ax){
    return Math.max(1, Math.max.apply(null, list.map(function(a){ return a[ax.key]||0; })));
  });
  var meVals = axes.map(function(ax,i){ return (me[ax.key]||0) / maxes[i]; });
  var avgVals = axes.map(function(ax,i){
    var avg = list.reduce(function(s,a){ return s+(a[ax.key]||0); },0) / (list.length||1);
    return avg / maxes[i];
  });
  h += '<div class="sheethead"><div><div class="shtitle">'+esc(me.name)+'</div><div class="shsub">Dorsal '+me.dorsal+' &middot; perfil de estadísticas</div></div>'+
    '<button class="iconbtn" onclick="go(\''+backTo+'\')">'+icon('x',15)+'</button></div>';
  h += '<div class="content">';
  h += filterChips;
  var radarPageContent = renderRadarSVG(axes, meVals, avgVals, radarWarnKeys)+
    '<div class="radarlegend"><span><i class="dot" style="background:var(--accent)"></i>'+esc(me.name)+'</span><span><i class="dash"></i>Media del equipo</span></div>'+
    '<div class="caption" style="text-align:center;margin-top:10px">Cada eje está a escala de la jugadora con el valor más alto del equipo en ese apartado.</div>';
  h += swipeCarouselHtml('playerRadar', [
    {title:'Gráfico araña', content: radarPageContent},
    {title:'Mapa de tiro', content: '<div class="shotmapcard">'+renderShotMap(playerZoneStats(games, me.dorsal, me.name))+'</div>'},
    {title:'Mapa de calor', content: heatMapCardHtml('playerRadar', function(mode){ return playerShotPoints(games, me.dorsal, me.name, null, mode); })},
    renderPlayerTrendCard(games, me.dorsal, me.name)
  ]);
  h += renderPlayerStatLine(me);
  h += '</div></div></div>';
  return h;
}
